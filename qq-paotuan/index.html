}

function messageHtml(m, cont) {
  const kind = m.kind || 'ic';
  const meta = m.meta && typeof m.meta === 'object' ? m.meta : {};

  /* 掷骰消息单独走一套排版：原文不显示，避免和卡片里的数字重复 */
  if (kind === 'roll' && (meta.type === 'check' || meta.type === 'dice' || meta.type === 'contest' || meta.type === 'contest_invite' || meta.type === 'contest_entry' || meta.type === 'rps_invite' || meta.type === 'rps_result' || meta.type === 'lottery_open' || meta.type === 'lottery_entry' || meta.type === 'lottery_result' || meta.type === 'death' || meta.type === 'attack' || meta.type === 'rescue')) {
    return rollMessageHtml(m);
  }

  if (kind === 'system') {
    if (meta.scene) {
      return `<div class="msg k-scene" data-seq="${m.seq}"><div class="scene-line"><span>${esc(m.text)}</span></div></div>`;
    }
    return `<div class="msg k-system" data-seq="${m.seq}"><div class="sys">${esc(m.text)}</div></div>`;
  }

  /* 皮下：按系统提示的样子显示，只有「玩家名：内容」，不可回复、不可操作 */
  if (kind === 'ooc') {
    const who = String(m.sender || m.author || '—');
    const visTag = m.visibility === 'dm' ? '（私主持人）' : m.visibility === 'direct' ? '（定向）' : '';
    return `<div class="msg k-ooc" data-seq="${m.seq}"><div class="sys-ooc">`
      + `<b${meta.gm ? ' class="gm"' : ''}>${esc(who)}</b>`
      + (visTag ? `<span class="ooc-vis">${visTag}</span>` : '')
      + `：${bodyHtml(m)}`
      + `</div></div>`;
  }

  const whisper = m.visibility === 'dm' ? '私主持人' : m.visibility === 'direct' ? '定向' : '';
  const gm = Boolean(meta.gm);

  const badges = (gm ? '<span class="badge gm">主持人</span>' : '')
    + (whisper ? `<span class="badge w">${whisper}</span>` : '');

  const extra = (meta.type === 'check' || meta.type === 'dice') ? diceHtml(meta) : '';
  const edited = meta.edited ? '<span class="edit-mark">（已编辑）</span>' : '';

  const quote = meta.reply
    ? `<div class="quote" data-quote="${meta.reply.seq}" title="跳到原消息"><b>${esc(meta.reply.author || '')}</b><span>${esc(meta.reply.text || '')}</span></div>`
    : '';

  const plus = m._plus
    ? `<button class="plus-badge" data-plus="${m.seq}" title="点一下，也发一条同样的话">+1</button>`
    : '';
  const ops = `<span class="msg-ops">
      <button data-mmore="${m.seq}" title="更多">⋮</button>
    </span>`;

  const folded = Boolean(meta.folded);
  const foldHint = `<div class="fold-hint">已折叠 · <button data-unfold="${m.seq}">展开</button></div>`;

  const cls = `msg k-${kind}${whisper ? ' whisper' : ''}${gm ? ' gm' : ''}${folded ? ' folded' : ''}`;

  if (cont) {
    return `<div class="${cls} cont" data-seq="${m.seq}" data-time="${fmtTime(m.created_at)}">${ops}
      <div class="m-main">${quote}<div class="m-body">${bodyHtml(m)}${plus}</div>${reactionsHtml(m)}${extra}${edited}${foldHint}</div>
    </div>`;
  }

  return `<div class="${cls}" data-seq="${m.seq}">${ops}
    ${msgAvatarHtml(m)}
    <div class="m-main">
      <div class="m-head">
        <span class="who"${gm ? '' : ` style="color:${msgCharColor(m)}"`}>${esc(m.author || '—')}</span>${badges}${msgHpBadge(m)}
        <span class="mt">${fmtTime(m.created_at)}</span>
      </div>
      ${quote}
      <div class="m-body">${bodyHtml(m)}${plus}</div>${reactionsHtml(m)}${extra}${edited}${foldHint}
    </div>
  </div>`;
}

function diceHtml(meta, seq) {
  const detail = String(meta.detail || '');

  /* 非主持人拿到的暗骰消息没有点数，只显示占位 */
  if (meta.dark && !Array.isArray(meta.rolls)) {
    return '<div class="dice-card dark"><span class="dark-hint">暗骰 · 点数只有主持人看得到</span></div>';
  }

  /* 随机抽选报名：主持人发，玩家用角色卡报名 */
  if (meta.type === 'lottery_open') {
    const pool = Array.isArray(meta.pool) ? meta.pool : [];
    const entries = state.messages.filter((x) => x.meta && x.meta.type === 'lottery_entry' && Number(x.meta.inviteSeq) === Number(seq));
    const done = new Set(entries.map((x) => String(x.meta.characterId || '')));
    const result = state.messages.find((x) => x.meta && x.meta.type === 'lottery_result' && Number(x.meta.inviteSeq) === Number(seq));
    const limit = Number(meta.limit) || 0;
    const winnerId = result && result.meta.winner ? String(result.meta.winner.characterId || '') : '';

    /* 报名者名单（含顺序号） */
    const entrantRows = entries.map((x, i) => `<span class="chip${winnerId && winnerId === String(x.meta.characterId || '') ? ' ok' : ''}">${i + 1}. ${esc(x.meta.name || '')}</span>`).join('');
    const listHtml = pool.map((t) => {
      const joined = done.has(t.refId);
      const won = Boolean(winnerId) && winnerId === t.refId;
      const mine = t.owner === state.me && !joined && !result;
      const dmAct = isDm() && !joined && !result;
      let right;
      if (won) right = '<span class="chip ok">🎯 抽中</span>';
      else if (joined) right = '<span class="chip ok">已报名</span>';
      else if (mine || dmAct) right = `<button class="lot-join" data-lotjoin="${Number(seq)}" data-card="${esc(t.refId)}">报名</button>`;
      else right = '<span class="chip">—</span>';
      return `<div class="ci-row${joined ? ' done' : ''}"><span>${esc(t.name)}</span>${right}</div>`;
    }).join('');

    let foot;
    if (result) {
      const w = result.meta.winner || {};
      foot = `<div class="lot-win"><span class="lw-name">${esc(w.name || '')}</span><span class="lw-tag">被抽中</span></div>
        <div class="lot-tally">共 ${Number(result.meta.total) || done.size} 人报名</div>`;
    } else {
      const tally = `<span class="lot-tally">${limit > 0 ? `满 ${limit} 人自动抽取` : '主持人手动截止'} · 已报 ${done.size} 人</span>`;
      const close = isDm() && entries.length
        ? `<button class="lot-close" data-lotclose="${Number(seq)}">截止并随机抽取 →</button>` : '';
      foot = `${entrantRows ? `<div class="atk-row">${entrantRows}</div>` : ''}${tally}${close}`;
    }
    return `<div class="dice-card invite">
      <div class="dc-head"><span class="dc-label">${esc(meta.title || '随机抽选')}</span>
        <span class="chip">报名抽选</span></div>
      <div class="ci-list">${listHtml}</div>
      <div class="ci-foot">${foot}</div>
    </div>`;
  }

  /* 随机抽选：某人报名了（这条只在未开奖时的列表里体现，卡片从简） */
  if (meta.type === 'lottery_entry') {
    return `<div class="dice-card invite">
      <div class="dc-head"><span class="dc-label">${esc(meta.name || '')} 报名了「${esc(meta.title || '随机抽选')}」</span>
        <span class="chip ok">已报名</span></div>
    </div>`;
  }

  /* 随机抽选：开奖结果 */
  if (meta.type === 'lottery_result') {
    const w = meta.winner || {};
    return `<div class="dice-card entry">
      <div class="dc-head"><span class="dc-label">${esc(meta.title || '随机抽选')} · 开奖</span></div>
      <div class="lot-win"><span class="lw-name">${esc(w.name || '')}</span><span class="lw-tag">被抽中</span></div>
      <div class="lot-tally">从 ${Number(meta.total) || 0} 名报名者中随机抽出</div>
    </div>`;
  }

  /* 拼点邀请：主持人发，玩家自己点参加 */
  if (meta.type === 'contest_invite') {
    const targets = Array.isArray(meta.targets) ? meta.targets : [];
    const done = new Set(state.messages
      .filter((x) => x.meta && x.meta.type === 'contest_entry' && Number(x.meta.inviteSeq) === Number(seq))
      .map((x) => String(x.meta.characterId || '')));
    const isDc = meta.judge === 'dc';
    const myTargets = targets.filter((t) => t.owner === state.me);
    const mineLeft = myTargets.some((t) => !done.has(t.refId));
    const dmLeft = isDm() && targets.some((t) => !done.has(t.refId));
    /* 只有「我名下所有参战卡都掷过了」才算已参加 */
    const meDone = myTargets.length > 0 && myTargets.every((t) => done.has(t.refId));
    const rows = targets.map((t) => `<div class="ci-row${done.has(t.refId) ? ' done' : ''}">
        <span>${esc(t.name)}</span>
        ${done.has(t.refId) ? '<span class="chip ok">已掷</span>' : '<span class="chip">等待</span>'}
      </div>`).join('');
    const sysTxt = meta.sysMod ? (meta.sysMod > 0 ? `+${meta.sysMod}` : `${meta.sysMod}`) : '';
    const ruleTxt = isDc
      ? `<span class="dark-hint">难度 DC ${meta.dc}</span>`
      : `<span class="dark-hint">系统方 1d6${sysTxt}</span>`;
    const allDone = targets.every((t) => done.has(t.refId));
    const action = allDone
      ? '<span class="chip ok">都掷完了</span>'
      : meDone
        ? '<span class="chip ok">你已参加</span>'
        : ((mineLeft || dmLeft) ? `<button class="ci-join" data-join="${Number(seq)}">掷骰 · 参加拼点 →</button>` : '');
    return `<div class="dice-card invite">
      <div class="dc-head"><span class="dc-label">${esc(meta.label || '对抗')}${isDc ? '判定' : '拼点'}</span>
        ${meta.mode === 'adv' ? '<span class="chip">优势</span>' : meta.mode === 'dis' ? '<span class="chip">劣势</span>' : ''}
      </div>
      <div class="ci-list">${rows}</div>
      <div class="ci-foot">${ruleTxt}${action}</div>
    </div>`;
  }

  /* 猜拳邀请：玩家自己点手势 */
  if (meta.type === 'rps_invite') {
    const targets = Array.isArray(meta.targets) ? meta.targets : [];
    const done = new Set(state.messages
      .filter((x) => x.meta && x.meta.type === 'rps_result' && Number(x.meta.inviteSeq) === Number(seq))
      .map((x) => String(x.meta.characterId || '')));
    const rows = targets.map((t) => `<div class="ci-row${done.has(t.refId) ? ' done' : ''}">
        <span>${esc(t.name)}</span>
        ${done.has(t.refId) ? '<span class="chip ok">已出拳</span>' : '<span class="chip">等待</span>'}
      </div>`).join('');
    const myRps = targets.filter((t) => t.owner === state.me);
    const meDone = myRps.length > 0 && myRps.every((t) => done.has(t.refId));
    const mineLeft = myRps.some((t) => !done.has(t.refId));
    const dmLeft = isDm() && targets.some((t) => !done.has(t.refId));
    const allDone = targets.every((t) => done.has(t.refId));
    const action = allDone
      ? '<span class="chip ok">都出完了</span>'
      : meDone
        ? '<span class="chip ok">你已出拳</span>'
        : ((mineLeft || dmLeft)
          ? `<div class="rps-btns">
              <button data-rps="${Number(seq)}" data-hand="rock">✊ 石头</button>
              <button data-rps="${Number(seq)}" data-hand="paper">✋ 布</button>
              <button data-rps="${Number(seq)}" data-hand="scissors">✌️ 剪刀</button>
            </div>`
          : '');
    return `<div class="dice-card invite">
      <div class="dc-head"><span class="dc-label">石头剪刀布</span></div>
      <div class="ci-list">${rows}</div>
      <div class="ci-foot"><span class="dark-hint">系统随机出拳</span>${action}</div>
    </div>`;
  }

  /* 猜拳结果 */
  if (meta.type === 'rps_result') {
    const E = { rock: '✊', paper: '✋', scissors: '✌️' };
    const C = { rock: '石头', paper: '布', scissors: '剪刀' };
    return `<div class="dice-card entry">
      <div class="dc-head"><span class="dc-label">猜拳</span>
        ${meta.win ? '<span class="chip ok">胜</span>' : meta.tie ? '<span class="chip">平</span>' : '<span class="chip bad">负</span>'}
      </div>
      <div class="dc-line rps-line">
        <span class="rps-hand">${E[meta.hand] || '?'}</span><span class="dice-op">${C[meta.hand] || ''}</span>
        <span class="dice-eq">vs</span>
        <span class="rps-hand">${E[meta.sysHand] || '?'}</span><span class="dice-op">${C[meta.sysHand] || ''}</span>
        <span class="dark-hint">系统</span>
      </div>
    </div>`;
  }

  /* 单人拼点结果 */
  if (meta.type === 'contest_entry') {
    const modTxt = meta.mod ? (meta.mod > 0 ? `+${meta.mod}` : `${meta.mod}`) : '';
    const isDc = meta.judge === 'dc';
    const tag = isDc
      ? (meta.win ? '<span class="chip ok">成功</span>' : '<span class="chip bad">失败</span>')
      : (meta.win ? '<span class="chip ok">胜</span>' : meta.tie ? '<span class="chip">平</span>' : '<span class="chip bad">负</span>');
    const right = isDc
      ? `<span class="dice-eq">vs</span><span class="dice-op">DC ${meta.dc}</span>`
      : (() => {
        const sysTxt = meta.sysMod ? (meta.sysMod > 0 ? `+${meta.sysMod}` : `${meta.sysMod}`) : '';
        return `<span class="dice-eq">vs</span><span class="die-face">${meta.sysRoll}</span>`
          + `${sysTxt ? `<span class="dice-plus">+</span><span class="dice-op">${meta.sysMod}</span>` : ''}`
          + `<span class="dice-eq">=</span><span class="dice-sum">${meta.sysTotal}</span>`;
      })();
    return `<div class="dice-card entry">
      <div class="dc-head"><span class="dc-label">${esc(meta.label || '对抗')}${isDc ? '判定' : ''}</span>${tag}</div>
      <div class="dc-line">
        <span class="die-face">${meta.roll}</span>${modTxt ? `<span class="dice-plus">+</span><span class="dice-op">${meta.mod}</span>` : ''}
        <span class="dice-eq">=</span><span class="dice-sum">${meta.total}</span>
        ${right}
      </div>
    </div>`;
  }

  /* 攻击：掷 1d6 判定点数，6→2 伤、5→1 伤、4 及以下无伤 */
  if (meta.type === 'attack') {
    const roll = meta.roll != null ? meta.roll : (meta.dmg && meta.dmg.total);
    const dmg = meta.dmg != null ? meta.dmg : roll;
    const verdict = meta.verdict || (roll === 6 ? '大成功' : dmg > 0 ? '命中' : '未命中');
    const chip = roll === 6 ? '<span class="chip nat">大成功</span>'
      : dmg > 0 ? '<span class="chip ok">命中</span>' : '<span class="chip bad">未命中</span>';
    return `<div class="dice-card attack">
      <div class="dc-head"><span class="dc-label">攻击 1d6</span>${chip}</div>
      <div class="dc-line"><span class="die-face${roll === 6 ? ' crit' : ''}">${roll}</span><span class="dice-eq">→</span><span class="atk-k">伤害</span><span class="dice-sum">${dmg}</span></div>
      ${meta.targetName ? `<div class="dc-line"><span class="dark-hint">目标：${esc(meta.targetName)}${meta.hpAfter != null ? ` · HP 剩 ${meta.hpAfter}` : ''}</span></div>` : ''}
    </div>`;
  }

  /* 技能救：无加成 DC=5，掷 1d6>=5 救回 1 HP */
  if (meta.type === 'rescue') {
    const ok = Boolean(meta.success);
    return `<div class="dice-card rescue">
      <div class="dc-head"><span class="dc-label">技能救 · ${esc(meta.rescuerName || '施救')} → ${esc(meta.targetName || '')}</span>
        ${ok ? '<span class="chip ok">救回</span>' : '<span class="chip bad">失败</span>'}</div>
      <div class="dc-line"><span class="die-face">${meta.roll}</span><span class="dice-eq">vs</span><span class="chip dc">DC ${meta.dc || 5}</span></div>
      <div class="dark-hint">${ok ? '成功，救回 1 点 HP' : '施救失败'}</div>
    </div>`;
  }

  /* 死亡豁免 */
  if (meta.type === 'death') {
    const dots = (n) => '●'.repeat(Math.max(0, Math.min(3, n || 0))) + '○'.repeat(Math.max(0, 3 - (n || 0)));
    const tag = meta.revived ? '<span class="chip ok">醒来</span>'
      : meta.dead ? '<span class="chip bad">死亡</span>'
        : meta.stable ? '<span class="chip ok">稳定</span>' : '';
    return `<div class="dice-card death">
      <div class="dc-head"><span class="dc-label">死亡豁免</span>${tag}</div>
      <div class="dc-line">
        <span class="die-face">${meta.roll}</span>
        <span class="dice-eq">·</span>
        <span class="death-dots">成功 ${dots(meta.s)}</span>
        <span class="death-dots">失败 ${dots(meta.f)}</span>
      </div>
      <div class="dark-hint">${esc(meta.note || '')}</div>
    </div>`;
  }

  /* 批量对抗拼点：一人一行，玩家 vs 系统 */
  if (meta.type === 'contest') {
    const rows = Array.isArray(meta.rows) ? meta.rows : [];
    const list = rows.map((r) => {
      const modTxt = (v) => (v ? (v > 0 ? `+${v}` : `${v}`) : '');
      const tag = r.win ? '<span class="chip ok">胜</span>'
        : r.tie ? '<span class="chip">平</span>' : '<span class="chip bad">负</span>';
      return `<tr class="${r.win ? '' : r.tie ? '' : 'lose'}">
        <td>${esc(r.name)}</td>
        <td class="num">${r.roll}${modTxt(r.mod)} = <b>${r.total}</b></td>
        <td class="ct-vs">vs</td>
        <td class="num">${r.sysRoll}${modTxt(meta.sysMod)} = <b>${r.sysTotal}</b></td>
        <td>${tag}</td></tr>`;
    }).join('');
    return `<div class="dice-card contest">
      <div class="dc-head"><span class="dc-label">${esc(meta.label || '对抗')}拼点</span>
        ${meta.mode === 'adv' ? '<span class="chip">优势</span>' : meta.mode === 'dis' ? '<span class="chip">劣势</span>' : ''}
      </div>
      <table class="ct-table"><tbody>${list}</tbody></table>
    </div>`;
  }

  /* 检定已移除：旧存档的 check 消息按自由骰卡片兜底渲染（不再显示逆转按钮） */

  const groups = Array.isArray(meta.rolls) ? meta.rolls : [];
  const keptIdx = Number.isFinite(meta.kept) ? Number(meta.kept) : 0;
  const multi = groups.length > 1;
  /* 固定修正（2d6+3 里的 +3）单独显示，不然看不出总和怎么来的 */
  let flat = Number((meta.parsed && meta.parsed.flat) || meta.flat || 0);
  if (!flat) {
    /* 老消息没存 flat，从表达式尾巴兜底解析（2d6+3 → 3） */
    const mm = /([+-]\d+)$/.exec(String(meta.expr || '').trim());
    if (mm) flat = Number(mm[1]);
  }
  const flatHtml = flat
    ? `<span class="dice-plus">+</span><span class="dice-op">${flat > 0 ? flat : `−${Math.abs(flat)}`}</span>`
    : '';
  const lines = groups.map((g, gi) => {
    /* 每个骰子点数都摆出来，中间用 + 连起来 */
    const faces = (Array.isArray(g) ? g : [])
      .map((v) => `<span class="die-face">${v}</span>`)
      .join('<span class="dice-plus">+</span>');
    const tot = Array.isArray(meta.totals) ? meta.totals[gi] : (gi === keptIdx ? meta.total : '');
    return `<div class="dc-line${multi && gi !== keptIdx ? ' dropped' : ''}">${faces}${flatHtml}<span class="dice-eq">=</span><span class="dice-sum">${tot}</span></div>`;
  }).join('');

  const modeTag = meta.mode === 'adv' ? '<span class="chip">优势</span>'
    : meta.mode === 'dis' ? '<span class="chip">劣势</span>' : '';

  return `<div class="dice-card" title="${esc(detail)}">
    <div class="dc-head"><span class="dc-label">${esc(meta.expr || '掷骰')}</span>${modeTag}
      ${meta.dc != null ? `<span class="chip ${meta.success ? 'ok' : 'bad'}">${meta.success ? '成功' : '失败'} · DC ${meta.dc}</span>` : ''}
    </div>
    ${lines}
    ${multi ? `<div class="dc-line"><span class="dice-eq">取</span><span class="dice-sum">${meta.total}</span></div>` : ''}
  </div>`;
}

/* ---------------- 拖拽实现 ---------------- */
function onDragMove(e) {
  if (!drag) return;
  drag.lastY = e.clientY;

  if (!drag.active) {
    if (Math.hypot(e.clientX - drag.startX, e.clientY - drag.startY) < 7) return;
    beginDrag(e);
  }
  if (!drag.active) return;

  e.preventDefault();
  const dy = e.clientY - drag.startY;
  drag.ghost.style.transform = `translate3d(0, ${dy}px, 0)`;
  repositionPlaceholder();
}

/* 指针停在上下边缘时持续滚动（只靠 pointermove 会滚一下就停） */
function dragTick() {
  if (!drag || !drag.active) return;
  const c = drag.container;
  const r = c.getBoundingClientRect();
  let scrolled = false;

  if (drag.lastY < r.top + 46 && c.scrollTop > 0) {
    c.scrollTop -= 13;
    scrolled = true;
  } else if (drag.lastY > r.bottom - 46) {
    const before = c.scrollTop;
    c.scrollTop += 13;
    if (c.scrollTop !== before) scrolled = true;
  }

  if (scrolled) repositionPlaceholder();
  drag.raf = requestAnimationFrame(dragTick);
}

function beginDrag(e) {
  const { row, container, rect } = drag;
  drag.active = true;
  state.dragging = true;
  container.classList.add('dragging');
  document.body.style.userSelect = 'none';
  document.body.style.cursor = 'grabbing';

  const ghost = row.cloneNode(true);
  ghost.classList.add('ghost');
  Object.assign(ghost.style, {
    position: 'fixed',
    left: rect.left + 'px',
    top: rect.top + 'px',
    width: rect.width + 'px',
    height: rect.height + 'px',
    margin: '0',
    pointerEvents: 'none',
    zIndex: '900',
  });
  document.body.appendChild(ghost);

  const ph = document.createElement('div');
  ph.className = 'msg-ph';
  ph.style.height = rect.height + 'px';

  container.insertBefore(ph, row);
  row.remove();

  drag.ghost = ghost;
  drag.ph = ph;
  drag.lastY = e.clientY;
  drag.raf = requestAnimationFrame(dragTick);
}

function repositionPlaceholder() {
  const { container, ph, lastY } = drag;
  const rows = Array.from(container.querySelectorAll('.msg[data-seq]'));

  let ref = null;
  for (const n of rows) {
    const r = n.getBoundingClientRect();
    if (lastY < r.top + r.height / 2) { ref = n; break; }
  }

  /* 已经在正确位置 */
  let cur = ph.nextElementSibling;
  while (cur && !cur.matches('.msg[data-seq]')) cur = cur.nextElementSibling;
  if (cur === ref) return;
  if (!ref && !cur) return;

  flipInsert(container, ph, ref);
}

function flipInsert(container, ph, ref) {
  const kids = Array.from(container.children).filter((n) => n !== ph);
  const before = new Map();
  for (const n of kids) before.set(n, n.getBoundingClientRect().top);

  container.insertBefore(ph, ref || null);

  const moved = [];
  for (const n of kids) {
    const now = n.getBoundingClientRect().top;
    const d = before.get(n) - now;
    if (Math.abs(d) > 0.5) {
      n.style.transition = 'none';
      n.style.transform = `translateY(${d}px)`;
      moved.push(n);
    }
  }

  if (!moved.length) return;
  requestAnimationFrame(() => {
    for (const n of moved) {
      n.style.transition = 'transform 220ms cubic-bezier(.2,.75,.3,1)';
      n.style.transform = 'translateY(0)';
      setTimeout(() => { if (n.style) { n.style.transition = ''; n.style.transform = ''; } }, 260);
    }
  });
}

function cleanupDrag() {
  if (!drag) return;
  if (drag.raf) cancelAnimationFrame(drag.raf);
  if (drag.ghost) drag.ghost.remove();
  if (drag.ph) drag.ph.remove();
  drag.container.classList.remove('dragging');
  document.body.style.userSelect = '';
  document.body.style.cursor = '';
  window.removeEventListener('pointermove', drag.move);
  window.removeEventListener('pointerup', drag.up);
  window.removeEventListener('pointercancel', drag.up);
  drag = null;
  state.dragging = false;
}

async function onDragUp(e) {
  if (!drag) return;
  if (!drag.active) { cleanupDrag(); return; }

  const { ph, ghost, seq, container } = drag;
  const phRect = ph.getBoundingClientRect();

  /* 目标：占位前一条 → after；否则下一条 → before */
  let prevNode = ph.previousElementSibling;
  while (prevNode && !prevNode.matches('.msg[data-seq]')) prevNode = prevNode.previousElementSibling;
  let nextNode = ph.nextElementSibling;
  while (nextNode && !nextNode.matches('.msg[data-seq]')) nextNode = nextNode.nextElementSibling;

  let targetSeq = null;
  let position = 'before';
  if (prevNode) { targetSeq = Number(prevNode.dataset.seq); position = 'after'; }
  else if (nextNode) { targetSeq = Number(nextNode.dataset.seq); position = 'before'; }

  /* ghost 平滑落回占位框 */
  const dy = phRect.top - drag.rect.top;
  ghost.style.transition = 'transform 220ms cubic-bezier(.2,.75,.3,1)';
  requestAnimationFrame(() => { ghost.style.transform = `translate3d(0, ${dy}px, 0)`; });

  const payload = { seq, targetSeq, position, sender: state.me };

  setTimeout(async () => {
    cleanupDrag();
    if (targetSeq === null) { await reloadAll(); return; }
    const out = await api('/api/message/move', payload);
    if (out && out.error) toast(out.error);
    await reloadAll();
  }, 225);
}

function autosize(ta) {
  /* 空输入框按单行高度算：长 placeholder 在窄屏上会折行，把 scrollHeight 撑大 */
  if (!ta.value) {
    const cs = getComputedStyle(ta);
    const lh = parseFloat(cs.lineHeight) || 18;
    const pad = (parseFloat(cs.paddingTop) || 0) + (parseFloat(cs.paddingBottom) || 0);
    ta.style.height = Math.max(32, Math.round(lh + pad)) + 'px';
    return;
  }
  ta.style.height = 'auto';
  ta.style.height = Math.min(132, Math.max(32, ta.scrollHeight)) + 'px';
}

/* =========================================================================
 * 6. 窗口管理
 * ========================================================================= */
/* ---------- 分页拖动排序（模仿 boluo 的 PaneDragHandle） ---------- */
let paneDrag = null;

function paneIndexAt(x, dragId) {
  const others = state.windows.filter((w) => w.id !== dragId);
  for (let i = 0; i < others.length; i += 1) {
    const w = winMap.get(others[i].id);
    if (!w) continue;
    const r = w.el.getBoundingClientRect();
    if (x < r.left + r.width / 2) return i;
  }
  return others.length;
}

function startPaneDrag(e, win) {
  if (state.windows.length < 2) return;
  e.preventDefault();
  paneDrag = { id: win.cfg.id };
  win.el.classList.add('pane-dragging');
  window.addEventListener('pointermove', onPaneDragMove);
  window.addEventListener('pointerup', onPaneDragUp, { once: true });
}

function onPaneDragMove(e) {
  if (!paneDrag) return;
  $$('.win').forEach((n) => n.classList.remove('pane-drop-before'));
  const others = state.windows.filter((w) => w.id !== paneDrag.id);
  const target = others[paneIndexAt(e.clientX, paneDrag.id)];
  if (target) {
    const w = winMap.get(target.id);
    if (w) w.el.classList.add('pane-drop-before');
  }
}

function onPaneDragUp(e) {
  if (!paneDrag) return;
  const id = paneDrag.id;
  paneDrag = null;
  window.removeEventListener('pointermove', onPaneDragMove);
  $$('.win').forEach((n) => n.classList.remove('pane-drop-before', 'pane-dragging'));

  const moved = state.windows.find((w) => w.id === id);
  if (!moved) return;
  const others = state.windows.filter((w) => w.id !== id);
  others.splice(paneIndexAt(e.clientX, id), 0, moved);

  if (others.map((w) => w.id).join() === state.windows.map((w) => w.id).join()) return;
  state.windows = others;
  syncWindows();
}

function focusPane(id) {
  if (state.focused === id) return;
  state.focused = id;
  for (const [wid, w] of winMap) w.el.classList.toggle('focused', wid === id);
  renderSidebar();
  renderTopbar();
  saveSession();
}

function newPane(channelId) {
  if (state.windows.length >= MAX_PANES) { toast(`最多 ${MAX_PANES} 页`); return null; }
  const w = {
    id: uuid(),
    channel: channelId || focusedChannel(),
    identity: focusedWin() ? focusedWin().identity : (myChars()[0] ? myChars()[0].id : ''),
    kind: 'auto',
    vis: 'all',
    audience: [],
    search: '',
  };
  state.windows.push(w);
  state.focused = w.id;
  syncWindows();
  return w;
}

/* 频道行上的「+」：新开一页看这个频道 */
function openPaneForChannel(chId) {
  newPane(chId);
}

function addWindow() {
  if (state.windows.length >= MAX_PANES) { toast(`最多 ${MAX_PANES} 页`); return; }
  /* 优先挑一个还没有被任何分页显示的频道 */
  const shown = new Set(state.windows.map((w) => w.channel));
  const free = state.room.channels.find((c) => !shown.has(c.id));
  newPane(free ? free.id : focusedChannel());
}

function closeWindow(id) {
  if (state.windows.length <= 1) { toast('至少保留一个分页'); return; }
  state.windows = state.windows.filter((w) => w.id !== id);
  if (state.focused === id) state.focused = state.windows[0] ? state.windows[0].id : null;
  syncWindows();
}

/* ---------------- 成员面板 + GM 笔记 ---------------- */
function openMembers() {
  $('#drawer').classList.remove('open');
  renderMembers();
  $('#members').classList.add('open');
  document.body.classList.add('drawer-open');
}

function renderMembers() {
  const body = $('#members-body');
  if (!body) return;
  const dm = state.room.dm;

  const lastAt = new Map();
  for (const m of state.messages) {
    if (!m.sender || !m.created_at) continue;
    const t = new Date(m.created_at).getTime();
    if (Number.isNaN(t)) continue;
    if (!lastAt.has(m.sender) || lastAt.get(m.sender) < t) lastAt.set(m.sender, t);
  }
  const ago = (ts) => {
    if (!ts) return '未发言';
    const s = Math.max(0, Math.round((Date.now() - ts) / 1000));
    if (s < 60) return '刚刚';
    if (s < 3600) return `${Math.floor(s / 60)} 分钟前`;
    if (s < 86400) return `${Math.floor(s / 3600)} 小时前`;
    return `${Math.floor(s / 86400)} 天前`;
  };

  const groups = new Map();
  for (const c of state.characters) {
    const k = c.owner || '无主';
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(c);
  }

  let html = `<div class="mem-dm">
      <span style="color:var(--dim2)">主持人</span>
      <b>${esc(dm ? (dm.name || displayId(dm.clientId)) : '未认领')}</b>
      ${dm ? '<span class="badge gm" style="margin-left:auto">GM</span>' : ''}
    </div>`;

  html += [...groups.entries()].map(([owner, chars]) => `
    <div class="mem-group">
      <div class="mem-pname">${esc(owner)}${owner === state.me ? '（我）' : ''}
        <span>${chars.length} 个角色 · ${esc(ago(lastAt.get(owner)))}</span></div>
      ${chars.map((c) => `
        <div class="mem-char" data-mchar="${esc(c.id)}">
          ${avatarHtml(c)}
          <div class="mc-body">
            <div class="mc-name">${esc(c.name)}</div>
            <div class="mc-meta">${buffName(c.buff) || '未选 BUFF'} · HP ${c.hp}/${c.maxHp} · SAN ${c.san == null ? 3 : c.san}</div>
          </div>
        </div>`).join('')}
    </div>`).join('');

  if (isDm()) {
    html += `<div class="gm-notes">
      <div class="gt">GM 笔记<span style="color:var(--dim2);font-size:10px">只有你能看到</span></div>
      <textarea id="gm-notes-ta" placeholder="NPC、伏笔、暗中血量、暗骰记录……">${esc(state.room.gmNotes || '')}</textarea>
      <div class="gn-foot"><span id="gm-notes-tip" style="font-size:10.5px;color:var(--dim2);margin-right:auto"></span>
        <button class="primary" id="gm-notes-save">保存</button></div>
    </div>`;
  }

  body.innerHTML = html;

  body.querySelectorAll('[data-mchar]').forEach((n) => {
    n.addEventListener('click', () => openCharModal(n.dataset.mchar));
  });

  const save = body.querySelector('#gm-notes-save');
  if (save) {
    save.addEventListener('click', async () => {
      const ta = body.querySelector('#gm-notes-ta');
      const r = await api('/api/gm/notes', { text: ta.value, clientId: state.me });
      if (r.error) { toast(r.error); return; }
      state.room.gmNotes = r.gmNotes;
      const tip = body.querySelector('#gm-notes-tip');
      if (tip) { tip.textContent = '已保存'; setTimeout(() => { if (tip) tip.textContent = ''; }, 1500); }
    });
  }
}

let charModalId = null;

    <label class="buff-opt${c.buff === b.id ? ' on' : ''}">

        </div>
        <div class="field">
          <label>序章 BUFF</label>
          <div class="hint" style="margin-top:2px">${esc((state.ref.buffs || []).find((b) => b.id === c.buff)?.name || '未选择')}</div>

      <span>账号来自怪啖论坛，不可修改</span>
    </div>
    ${isDm() && editable ? `<label class="npc-toggle"><input type="checkbox" name="isNpc" ${c.isNpc ? 'checked' : ''}>
      <span>标记为 NPC 卡（只有主持人能用它发言，玩家不会看到）</span></label>` : ''}

    <div class="sec-title">序章 BUFF <span class="cbt-pick-hint">四选一，决定判定加成与 HP 上限</span></div>
    <div class="buff-list">${buffHtml}</div>
    <div class="hint" style="margin-top:6px">一切默认掷 1d6。切换 BUFF 会自动调整 HP 上限。</div>

    <div class="sec-title">数值</div>
    <div class="row2">
      <div class="field"><label>当前 HP</label><input type="number" name="hp" value="${c.hp}" ${editable ? '' : 'disabled'} /></div>
      <div class="field"><label>最大 HP</label><input type="number" name="maxHp" value="${c.maxHp}" min="1" ${editable ? '' : 'disabled'} /></div>
      <div class="field"><label>SAN</label><input type="number" name="san" value="${c.san == null ? 3 : c.san}" min="0" ${editable ? '' : 'disabled'} /></div>
    </div>

    <div class="sec-title">备注</div>
    <textarea name="notes" rows="3" style="width:100%;resize:vertical" ${editable ? '' : 'disabled'}>${esc(c.notes)}</textarea>
  `;

  const foot = $('#modal-foot');
  if (existing) {
    foot.innerHTML = `${editable ? `<button class="danger" data-mact="del">删除</button>` : ''}
      <span class="sp"></span>
      <button data-mact="close">关闭</button>
      ${editable ? '<button class="primary" data-mact="save">保存</button>' : ''}`;
  } else {
    foot.innerHTML = `<span class="sp"></span><button data-mact="close">取消</button><button class="primary" data-mact="save">创建</button>`;
  }

  $('#modal').hidden = false;
  const nameInput = $('#modal-body [name="name"]');
  if (editable && nameInput) setTimeout(() => nameInput.focus(), 30);
}

function readCharForm() {
  const body = $('#modal-body');
  const val = (n) => body.querySelector(`[name="${n}"]`);
  return {
    name: (val('name')?.value || '').trim(),
    buff: (body.querySelector('input[name="buff"]:checked') || {}).value || '',
    hp: Number(val('hp')?.value) || 0,
    maxHp: Number(val('maxHp')?.value) || 1,
    san: Number(val('san')?.value) || 0,
    notes: val('notes')?.value || '',
    isNpc: Boolean(val('isNpc') && val('isNpc').checked),
  };
}

async function saveChar() {
  const fields = readCharForm();
  if (!fields.name) { toast('请填写名字'); return; }

  const data = charModalId
    ? await api('/api/character/update', Object.assign({ id: charModalId, clientId: state.me }, fields))
    : await api('/api/character', Object.assign({ clientId: state.me }, fields));

  if (data.error) { toast(data.error); return; }
  closeModal();
  await reloadAll();
  toast(charModalId ? '已保存' : '角色卡已创建');
}

async function deleteChar() {
  if (!charModalId) return;
  if (!confirm('删除这张角色卡？此操作不可撤销。')) return;
  const data = await api('/api/character/delete', { id: charModalId, clientId: state.me });
  if (data.error) { toast(data.error); return; }
  closeModal();
  await reloadAll();
  toast('已删除');
}

function closeModal() {
  $('#modal').hidden = true;
  charModalId = null;
}

/* 攻击：先选目标，掷 1d6 伤害直接扣它的 HP */
function openAttackTarget(charId) {
  const cb = state.room.combat;
  if (!cb || !cb.active || !cb.order.length) { toast('没有进行中的战斗'); return; }

  const list = cb.order.filter((o) => o.refId !== charId);
  if (!list.length) { toast('战斗里没有可攻击的目标'); return; }

  $('#modal-title').textContent = '选择攻击目标';
  $('#modal-sub').textContent = '掷 1d6 伤害，直接扣除目标 HP';
  $('#modal-body').dataset.mode = 'attack-target';
  $('#modal-body').innerHTML = `<div class="atk-targets">
    ${list.map((o) => `<button data-atk-target="${esc(o.id)}">
      <span class="at-name">${esc(o.name)}</span>
      <span class="at-ac">HP ${o.hp}/${o.maxHp}</span>
    </button>`).join('')}
  </div>`;
  $('#modal-foot').innerHTML = '<span class="sp"></span><button data-mact="close">取消</button>';
  $('#modal').hidden = false;

  const fire = async (orderId) => {
    closeModal();
    const data = await api('/api/attack', {
      characterId: charId,
      targetId: orderId,
      clientId: state.me,
      channel: focusedChannel(),
    });
    if (data.error) { toast(data.error); return; }
    await reloadAll();
  };

  $('#modal-body').onclick = (e) => {
    const b = e.target.closest('[data-atk-target]');
    if (b) { fire(b.dataset.atkTarget); return; }
    if (e.target.closest('[data-mact="close"]')) closeModal();
  };
}

  return `<div class="atk-row"><button data-attack="${esc(o.refId)}" title="掷 1d6 伤害，选目标后直接扣 HP">攻击 1d6</button></div>`;

      <h5><b>游戏怎么进行</b></h5>
      <p>主持人介绍、推动剧情，指定场景、交代背景。例如：「雨夜，你们站在一栋废弃公寓楼下。」</p>
      <p>你用角色扮演回应。默认的「自动」模式沿用 QQ 群发言规则：引号里是角色说话，# 或 * 后接动作描述，（）括号里是玩家本人说的话。</p>
      <p>比如：“嗷呜！我要吃人！”#吃人 （不是她真吃啊），在自动模式下会被网站自动识别，如果没自动识别符号与符号之间可以适当加一些空格方便识别。</p>
      <p>主持人判断要不要掷骰：太简单的事直接成，有悬念才掷。战斗是最常掷骰的地方，后面细讲。</p>
      <p>掷骰、出结果、接着往下走。掷顺了顺利，掷砸了出岔子，而岔子本身也是故事的一部分。</p>
      <h4><b>二 怎么使用跑团网站</b></h4>
      <ul><li>注册论坛账号，并保持在登录状态。</li><li>从论坛小工具，或直接访问 trpg.怪啖论坛.cn 进入跑团网站。</li><li>在左侧找到本次主持人用的频道进去；不知道用哪个频道，在群里问一声。</li><li>选中你的角色卡，开始扮演。</li><li>想用「诡异」的卡，点右上角切换，选 unknown，在里面找到你的诡异角色卡。</li></ul>
      <h4><b>三 骰子怎么用</b></h4>
      <h5><b>什么是“1d6”</b></h5>
      <p>这是骰子的缩写。d 前面的数字是几个骰子，后面是骰子类型。</p>
      <table class="doc-tbl"><tr><td>写法</td><td>什么意思</td><td>结果范围</td></tr><tr><td>1d6</td><td>掷一个 6 面骰</td><td>1 到 6</td></tr><tr><td>2d6</td><td>掷两个 6 面骰，加起来</td><td>2 到 12</td></tr><tr><td>1d6+3</td><td>一个 6 面骰，再加 3</td><td>4 到 9</td></tr></table>
      <h5><b>掷骰面板</b></h5>
      <p>掷骰只有自由掷骰一种。面板上全是点选，不用打字：左边选骰子面数（d6 / d12 / d20，默认 d6），中间选掷几个（默认 1 个），右边选 DC。默认就是 1d6。</p>
      <p>DC 是可选的：选了就自动判成功/失败，选「不判 DC」就只报点数，由主持人自己看。</p>
      <h5><b>优势与劣势</b></h5>
      <p>面板上有优、常、劣三个键。什么时候用优势由主持人定。</p>
      <p>优势是掷两颗 d6 取高的，情况对你有利。劣势是掷两颗取低的，情况对你不利。常就是正常掷一颗。</p>
      <h4><b>四 角色卡</b></h4>
      <h5><b>关键数值</b></h5>
      <p>我们的数值有 HP 和 SAN。没别的了，是的，就是那么简单。HP 默认 8，SAN 默认 3。</p>
      <table class="doc-tbl"><tr><td>数值</td><td>默认</td><td>作用</td></tr><tr><td>HP（血量）</td><td>8</td><td>归零就倒地濒死，最重要的一个数</td></tr><tr><td>SAN（理智）</td><td>3</td><td>剧情杀相关，归零会被催眠</td></tr></table>
      <h5><b>序章buff</b></h5>
      <p>序章的时候玩家进行了数值的选择</p>
      <p>【战斗专精】：战斗相关判定 DC-2</p>
      <p>【专心调查】：线索调查相关判定 DC-2，HP＋1</p>
      <p>【均衡主义】：战斗和调查判定 DC 均-1，HP＋1</p>
      <p>【赌徒】：任何判定都不加点数，纯靠运气。但可强制逆转一次判定失败，HP＋2</p>
      <h4><b>五 怎么打架</b></h4>
      <h5><b>开战由主持人发起</b></h5>
      <p>主持人在战斗面板里勾选参战的人、加怪物，然后点开始。系统给所有人掷先攻，排出行动顺序。</p>
      <h5><b>拼点</b></h5>
      <p>主持人发起拼点邀请。参与后和系统比大小。跟玩家PVP对决就是双方比大小。</p>
      <h5><b>DC 判定</b></h5>
      <p>扔个骰，有些事件是 DC 判定，DC的数值就是判定线，只看你过不过线，DC越高越难过线，DC越低越容易。结果写「成功」或「失败」。网站的掷骰面板可以选填 DC，填了就自动判成功/失败，不填就只报点数，交给主持人判断。</p>
      <h5><b>猜拳</b></h5>
      <p>三个选项「重击」「突袭」「防御」，类似石头剪刀布：重击 &gt; 防御 &gt; 突袭 &gt; 重击。</p>
      <p>为了方便理解，按钮仍是「石头」「布」「剪刀」，系统随机出，直接定胜负。克制的一方扣除1点HP。</p>
      <h5><b>攻击</b></h5>
      <p>判定点数=6 大成功可直接产生2点伤害。点数&gt;4扣一滴血。</p>
      <h5><b>掉血与濒死</b></h5>
      <p>主持人在面板上点「−2」「−1」「+1」「+2」调整血量，你的角色卡同步。HP 归零后，侧栏冒出濒死标记，旁边有掷死亡豁免的按钮。</p>
      <table class="doc-tbl"><tr><td>掷出</td><td>结果</td></tr><tr><td>4 或以上</td><td>记 1 次成功</td></tr><tr><td>3 或以下</td><td>记 1 次失败</td></tr><tr><td>自然 6</td><td>回 1 点血，直接醒来</td></tr><tr><td>自然 1</td><td>记 2 次失败</td></tr></table>
      <p>3次成功就以1滴血复活；3次失败就死亡。死亡判定没成功，允许其他玩家用技能救（无加成DC=5）。</p>
      <h5><b>长休短休</b></h5>
      <p>只有主持人能安排：短休让每人掷 1d6 回血，已经濒死的人救不回来。长休让全队 HP 直接回满。</p>
      <h4><b>六 主持人</b></h4>
      <h5><b>认领主持人</b></h5>
      <p>在侧栏主持人区点认领主持人。认领后，那些只有主持人能用的按钮才会出现。你也可以释放主持人，让别人来。支线结束后记得及时释放呀。</p>
      <h5><b>主持战斗</b></h5>
      <p>选参战者：默认勾选本频道发过言的角色，其余手动勾。</p>
      <p>加怪物：可以手填，也可以用模板填。</p>
      <p>下一轮：下一回合。一般来说一回合一个人只能行动一次，“赌徒”buff是例外，可以重新骰一次。</p>
      <p>拼点与猜拳邀请：勾了谁就邀请谁，玩家自己掷，你也能代掷。</p>
      <p>随机选人：报名的人里面随机选幸运儿。</p>
      <p>只有主持人能开战、推进、结束。</p>
      <p>看完还有不懂的，直接在聊天里问主持人。这游戏本来就是靠说话推动的。</p>
    </div>`;
  $('#modal-foot').innerHTML = '<span class="sp"></span><button data-mact="close">关闭</button>';
  $('#modal').hidden = false;
}

/* =========================================================================
 * 10. 事件绑定
 * ========================================================================= */
function bindGlobal() {
  /* 侧栏 */
  $('#side').addEventListener('click', async (e) => {
    const t = e.target;

    const act = t.closest('[data-act]');
    if (act) {
      if (act.dataset.act === 'claim-dm') {
        const data = await api('/api/dm', { clientId: state.me, name: displayId(state.me) });
        if (data.error) toast(data.error);
        await reloadAll();
      } else if (act.dataset.act === 'release-dm') {
        await api('/api/dm', { clientId: state.me, release: true });
        await reloadAll();
      } else if (act.dataset.act === 'roll-log') {
        openRollLog();
      } else if (act.dataset.act === 'rest-long' || act.dataset.act === 'rest-short') {
        const long = act.dataset.act === 'rest-long';
        if (!confirm(long ? '全队长休：所有角色 HP 回满？' : '全队短休：每人掷 1d6 回血？')) return;
        const data = await api('/api/rest', { type: long ? 'long' : 'short', clientId: state.me, channel: focusedChannel() });
        if (data.error) { toast(data.error); return; }
        await reloadAll();
        toast(long ? '长休完成，全队 HP 已回满' : '短休完成');
      } else if (act.dataset.act === 'scene') {
        if (!isDm()) { toast('只有主持人能插入场景'); return; }
        const name = prompt('场景名称（例如：雨夜码头 · 深夜）');
        if (!name) return;
        const r = await api('/api/message', {
          kind: 'system', text: name, scene: true, sender: state.me,
          channel: focusedChannel(), visibility: 'all',
        });
        if (r.error) { toast(r.error); return; }
        await poll();
      } else if (act.dataset.act === 'toggle-reorder') {
        if (!isDm()) { toast('只有主持人可以调整消息顺序'); return; }
        if (state.dragging && typeof cleanupDrag === 'function') cleanupDrag();
        state.reorderMode = !state.reorderMode;
        renderAll();
        toast(state.reorderMode ? '调整模式已开启：拖住消息上下移动' : '已退出调整模式');
      }
      return;
    }

    const renameBtn = t.closest('[data-rename]');
    if (renameBtn) { e.stopPropagation(); beginRenameChannel(renameBtn.dataset.rename); return; }

    const delBtn = t.closest('[data-delch]');
    if (delBtn) {
      e.stopPropagation();
      const ch = state.room.channels.find((c) => c.id === delBtn.dataset.delch);
      if (!ch) return;
      if (state.room.channels.length <= 1) { toast('至少要保留一个频道'); return; }
      if (!confirm(`删除频道〔${ch.name}〕？\n其中的消息会并入第一个频道，不会丢失。`)) return;
      const data = await api('/api/channel/delete', { id: ch.id, clientId: state.me });
      if (data.error) { toast(data.error); return; }
      const fb = data.fallback || state.room.channels[0].id;
      for (const w of state.windows) if (w.channel === ch.id) w.channel = fb;
      await reloadAll();
      return;
    }

    const openCh = t.closest('[data-opench]');
    if (openCh) { e.stopPropagation(); openPaneForChannel(openCh.dataset.opench); return; }

    const chRow = t.closest('[data-ch]');
    if (chRow) {
      // 点频道 = 让当前聚焦的分页切到这个频道（boluo 的行为）
      const w = focusedWin();
      if (w) w.channel = chRow.dataset.ch;
      saveSession();
      renderAll();
      return;
    }

    const deathBtn = t.closest('[data-death]');
    if (deathBtn) {
      e.stopPropagation();
      deathBtn.disabled = true;
      const data = await api('/api/death-save', { id: deathBtn.dataset.death, clientId: state.me, channel: focusedChannel() });
      if (data.error) { toast(data.error); deathBtn.disabled = false; return; }
      await reloadAll();
      if (data.dead) toast('死亡豁免失败三次，这张卡已死亡');
      else if (data.stable) toast('已稳定');
      else if (data.revived) toast('自然 6！恢复意识');
      return;
    }

    const rescueBtn = t.closest('[data-rescue]');
    if (rescueBtn) {
      e.stopPropagation();
      const meChar = state.characters.find((c) => c.id === state.cfg.identity);
      const rescuerName = meChar ? meChar.name : (state.forumPlayer || state.me);
      rescueBtn.disabled = true;
      const data = await api('/api/rescue', {
        targetId: rescueBtn.dataset.rescue,
        rescuerName,
        clientId: state.me,
        channel: focusedChannel(),
      });
      if (data.error) { toast(data.error); rescueBtn.disabled = false; return; }
      await reloadAll();
      toast(data.success ? '施救成功，救回 1 点 HP' : `施救失败（掷出 ${data.roll}，需 5+）`);
      return;
    }

    const charRow = t.closest('[data-char]');
    if (charRow) { openCharModal(charRow.dataset.char); return; }
  });

  $('#ch-add').addEventListener('click', async () => {
    const name = prompt('新频道名称', '新频道');
    if (name === null) return;
    const data = await api('/api/channel/create', { name: name.trim() || '新频道', clientId: state.me });
    if (data.error) { toast(data.error); return; }
    if (data.channel) {
      const w = focusedWin();
      if (w) w.channel = data.channel.id;
    }
    await reloadAll();
  });

  $('#char-add').addEventListener('click', () => openCharModal(null));
  const npcAddBtn = $('#npc-add');
  if (npcAddBtn) {
    npcAddBtn.addEventListener('click', () => openCharModal(null, { isNpc: true }));
  }

  /** 手机上侧栏是独立抽屉，打开任何面板前先收起来，避免盖住 */
  const closeSide = () => {
    const t = document.getElementById('navtoggle');
    if (t) t.checked = false;
  };

  $('#btn-members').addEventListener('click', () => { closeSide(); openMembers(); });
  const closeMembers = () => {
    $('#members').classList.remove('open');
    document.body.classList.remove('drawer-open');
  };
  $('#members-close').addEventListener('click', closeMembers);
  const mBackBtn = $('#members-back');
  if (mBackBtn) mBackBtn.addEventListener('click', closeMembers);

  $('#top-combat').addEventListener('click', async (e) => {
    if (!e.target.closest('#cs-next')) return;
    const data = await api('/api/combat/next', { channel: focusedChannel(), clientId: state.me });
    if (data.error) { toast(data.error); return; }
    await reloadAll();
  });

  $('#btn-combat').addEventListener('click', () => {
    closeSide();
    $('#members').classList.remove('open');
    renderCombat();
    $('#drawer').classList.add('open');
    /* 手机上让消息区给底部抽屉让位，并把最新消息滚进可见区 */
    document.body.classList.add('drawer-open');
    setTimeout(() => {
      for (const [, w] of winMap) { if (w && typeof w.scrollToBottom === 'function') w.scrollToBottom(); }
    }, 220);
  });
  const closeDrawer = () => {
    $('#drawer').classList.remove('open');
    document.body.classList.remove('drawer-open');
  };
  $('#drawer-close').addEventListener('click', closeDrawer);
  const backBtn = $('#drawer-back');
  if (backBtn) backBtn.addEventListener('click', closeDrawer);
  $('#btn-log').addEventListener('click', exportLog);
  $('#btn-help').addEventListener('click', openHelp);
  $('#btn-announce').addEventListener('click', openAnnounceEditor);
  $('#btn-addwin').addEventListener('click', addWindow);

  /* 模态 */
  $('#modal-x').addEventListener('click', closeModal);
  $('#modal').addEventListener('click', (e) => { if (e.target.id === 'modal') closeModal(); });
  $('#modal-foot').addEventListener('click', (e) => {
    const b = e.target.closest('[data-mact]');
    if (!b) return;
    const act = b.dataset.mact;
    if (act === 'close') closeModal();
    else if (act === 'save') saveChar();
    else if (act === 'del') deleteChar();
  });

  /* 战斗面板 */
  $('#combat-body').addEventListener('click', async (e) => {
    const t = e.target;

    const rm = t.closest('[data-mrm]');
    if (rm) { drawerMonsters.splice(Number(rm.dataset.mrm), 1); renderCombat(); return; }

    if (t.closest('#mon-add')) { drawerMonsters.push({ name: '', hp: '', attack: '' }); renderCombat(); return; }

    const tpl = t.closest('[data-tpl]');
    if (tpl) {
      const T = {
        grunt: { name: '普通信徒', hp: 2, attack: '0' },
        elite: { name: '狂热信徒', hp: 3, attack: '1d6' },
        boss: { name: '伪梦神', hp: 10, attack: '4d6' },
      }[tpl.dataset.tpl];
      if (T) {
        /* 如果只有一行空框，直接填它，不额外加行 */
        const blank = drawerMonsters.length === 1
          && !String(drawerMonsters[0].name || '').trim()
          && !String(drawerMonsters[0].hp || '').trim();
        const item = { name: T.name, hp: T.hp, attack: T.attack };
        if (blank) drawerMonsters[0] = item;
        else drawerMonsters.push(item);
        renderCombat();
      }
      return;
    }

    if (t.closest('#cbt-start')) {
      const monsters = drawerMonsters
        .filter((m) => String(m.name || '').trim())
        .map((m) => ({ name: m.name.trim(), hp: Number(m.hp) || 2, attack: String(m.attack || '').trim() }));
      const participants = $$('#combat-body [data-pid]:checked').map((x) => x.dataset.pid);
      if (!participants.length) { toast('先勾选参战角色'); return; }
      await combatAction('/api/combat/start', { monsters, participants, plotKill: Boolean((state.room.combat || {}).plotKill) });
      battlePicks = null;
      drawerMonsters = [];
      return;
    }

    if (t.closest('#lot-go')) {
      const payload = {
        channel: focusedChannel(),
        clientId: state.me,
        title: String((document.querySelector('#lot-title') || {}).value || '').trim() || '随机抽选',
        limit: Number((document.querySelector('#lot-limit') || {}).value) || 0,
      };
      if (turnPicks.size) payload.orderIds = [...turnPicks];
      const data = await api('/api/lottery/open', payload);
      if (data.error) { toast(data.error); return; }
      await reloadAll();
      toast('报名已发起，玩家可点卡片报名');
      return;
    }

    if (t.closest('#rps-go')) {
      const payload = { channel: focusedChannel(), clientId: state.me };
      if (turnPicks.size) payload.orderIds = [...turnPicks];
      const data = await api('/api/rps/invite', payload);
      if (data.error) { toast(data.error); return; }
      await reloadAll();
      toast('猜拳邀请已发出');
      return;
    }

    if (t.closest('#ct-go')) {
      const payload = {
        channel: focusedChannel(),
        clientId: state.me,
        label: String((document.querySelector('#ct-label') || {}).value || '').trim() || '拼点',
        sysMod: Number((document.querySelector('#ct-sysmod') || {}).value) || 0,
      };
      if (turnPicks.size) payload.orderIds = [...turnPicks];
      const data = await api('/api/contest/invite', payload);
      if (data.error) { toast(data.error); return; }
      await reloadAll();
      toast('拼点邀请已发出，等玩家自己掷');
      return;
    }

    const atk = t.closest('[data-attack]');
    if (atk) {
      openAttackTarget(atk.dataset.attack);
      return;
    }

    if (t.closest('#cbt-next-round')) {
      if (!turnPicks.size && !confirm('还没勾选本轮行动者，直接进入下一轮？')) return;
      turnPicks.clear();
      await combatAction('/api/combat/next-round', {});
      return;
    }

    if (t.closest('#cbt-next')) { await combatAction('/api/combat/next', {}); return; }
    if (t.closest('#cbt-end')) { await combatAction('/api/combat/end', {}); return; }

    const dmg = t.closest('[data-cbt-dmg]');
    if (dmg) { await combatAction('/api/combat/patch', { targetId: dmg.dataset.id, delta: Number(dmg.dataset.cbtDmg) }); return; }

    const crm = t.closest('[data-cbt-rm]');
    if (crm) {
      if (!confirm('把这个目标移出战斗？')) return;
      await combatAction('/api/combat/patch', { targetId: crm.dataset.cbtRm, remove: true });
      return;
    }
  });

  $('#combat-body').addEventListener('change', async (e) => {
    const pk = e.target.closest('#pk-toggle');
    if (pk) {
      await combatAction('/api/combat/plotkill', { enabled: pk.checked });
      return;
    }
    const tp = e.target.closest('[data-tpick]');
    if (tp) {
      if (tp.checked) turnPicks.add(tp.dataset.tpick);
      else turnPicks.delete(tp.dataset.tpick);
      renderTopbar();
      const go = document.querySelector('#ct-go');
      if (go) go.textContent = turnPicks.size ? `邀请勾选的 ${turnPicks.size} 人` : '发起拼点邀请';
      return;
    }

    const box = e.target.closest('[data-pid]');
    if (!box) return;
    if (!battlePicks) {
      battlePicks = new Set(state.characters.filter((c) => {
        const ch = focusedChannel();
        return state.messages.some((m) => channelOf(m) === ch && m.meta && m.meta.characterId === c.id);
      }).map((c) => c.id));
    }
    if (box.checked) battlePicks.add(box.dataset.pid);
    else battlePicks.delete(box.dataset.pid);
    const lb = box.closest('.cbt-pick');
    if (lb) lb.classList.toggle('on', box.checked);
  });

  $('#combat-body').addEventListener('input', (e) => {
    const inp = e.target.closest('[data-mi]');
    if (!inp) return;
    const i = Number(inp.dataset.mi);
    const k = inp.dataset.k;
    if (!drawerMonsters[i]) return;
    /* 攻击骰是「1d6 / 4d6」这种写法，保持字符串；名字同理 */
    drawerMonsters[i][k] = (k === 'name' || k === 'attack') ? inp.value : Number(inp.value) || 0;
  });

  /* 全局键盘 */
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if (!$('#modal').hidden) { closeModal(); return; }
      if ($('#drawer').classList.contains('open')) $('#drawer').classList.remove('open');
      if ($('#members').classList.contains('open')) $('#members').classList.remove('open');
    }
    /* 防止拖拽时误触 */
    if (state.dragging && e.key === 'Escape') cleanupDrag();
  });

  window.addEventListener('beforeunload', () => { /* 占位 */ });

  /* ---------- 账号 ---------- */
  /* 消息右键 / 长按菜单的点击与关闭 */
  $('#msg-menu').addEventListener('click', async (e) => {
    const b = e.target.closest('[data-mact]');
    if (!b) return;
    const act = b.dataset.mact;
    const { win, seq } = quickMenuCtx;
    closeQuickMenu();
    const m = state.messages.find((x) => Number(x.seq) === Number(seq));
    if (!m) return;
    if (act === 'copy') {
      const ok = await copyText(m.text);
      toast(ok ? '已复制这条消息' : '复制失败，请手动选字复制');
    } else if (act === 'quote') {
      if (win) win.setReplyBySeq(seq);
    } else if (act === 'like') {
      toggleReaction(seq, '👍');
    }
  });
  $('#av-menu').addEventListener('click', (e) => {
    const b = e.target.closest('[data-avact]');
    if (!b) return;
    const act = b.dataset.avact;
    const { charId, win } = avMenuCtx;
    closeAvMenu();
    const c = state.characters.find((x) => x.id === charId);
    if (!c) { toast('找不到这张角色卡'); return; }

    if (act === 'stats') {
      openCharModal(charId);
    } else if (act === 'forum') {
      /* 论坛同步来的卡 id 是 gd-<论坛用户id>，用后半段跳个人主页 */
      const fid = String(charId).startsWith('gd-') ? String(charId).slice(3) : '';
      if (!fid) { toast('这张卡不是论坛同步来的，没有论坛资料'); return; }
      window.open('https://xn--szrw0ciynt60c.cn/profile.html?id=' + encodeURIComponent(fid), '_blank', 'noopener');
    } else if (act === 'mention') {
      const w = win || winMap.get(state.focused);
      if (!w) { toast('先点开一个发言窗口'); return; }
      insertMention(w, c.name);
    }
  });

  const closeAllMenus = () => { closeQuickMenu(); closeAvMenu(); };
  document.addEventListener('pointerdown', (e) => {
    const mm = $('#msg-menu');
    if (mm && !mm.hidden && !e.target.closest('#msg-menu')) closeQuickMenu();
    const am = $('#av-menu');
    if (am && !am.hidden && !e.target.closest('#av-menu')) closeAvMenu();
    /* 表情面板：点外面收起 */
    if (!e.target.closest('.emoji-pop') && !e.target.closest('.w-emoji')) {
      document.querySelectorAll('.emoji-pop').forEach((p) => { p.hidden = true; });
    }
  }, true);
  window.addEventListener('scroll', closeAllMenus, true);
  window.addEventListener('resize', closeAllMenus);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeAllMenus(); });

  $('#btn-switch').addEventListener('click', () => {
    sessionStorage.removeItem(ACCOUNT_KEY);
    /* 标记为「手动切换」，这样刷新后不会被论坛身份自动顶回去 */
    sessionStorage.setItem(MANUAL_KEY, '1');
    location.reload();
  });

  $('#picker-list').addEventListener('click', (e) => {
    const row = e.target.closest('.pk-row');
    if (!row) return;
    pickerSel = row.dataset.name;
    const ni = $('#picker-new'); if (ni) ni.value = '';
    renderPicker();
  });
  /* 双击 = 少点一次，直接进入 */
  $('#picker-list').addEventListener('dblclick', (e) => {
    const row = e.target.closest('.pk-row');
    if (row) chooseAccount(row.dataset.name);
  });
  /* 手动切换后，选人面板里可以直接回到论坛身份 */
  $('#picker').addEventListener('click', (e) => {
    if (e.target.closest('#pk-forum')) chooseAccount(state.forumPlayer);
  });
  $('#picker-q').addEventListener('input', renderPicker);
  $('#picker-go').addEventListener('click', () => {
    const n = pickerSel || ($('#picker-new').value || '').trim();
    if (n) chooseAccount(n);
  });
  $('#picker-new').addEventListener('input', () => { pickerSel = ''; renderPicker(); });
  $('#picker-new').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); chooseAccount($('#picker-new').value); }
  });

  /* ---------- 角色卡筛选 / 搜索 / 同步 ---------- */
  $('#char-filter').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-f]');
    if (!b) return;
    state.charFilter = b.dataset.f;
    renderCharList();
  });
  $('#char-q').addEventListener('input', (e) => {
    state.charQuery = e.target.value;
    renderCharList();
  });
  $('#char-sync').addEventListener('click', async () => {
    const btn = $('#char-sync');
    btn.disabled = true;
    const r = await api('/api/forum/sync', {});
    btn.disabled = false;
    if (r.error) { toast(r.error); return; }
    await reloadAll();
    toast(`论坛卡：新增 ${r.created} · 更新 ${r.refreshed} · 合计 ${r.cards}`);
  });
}

async function beginRenameChannel(id) {
  const row = $(`.ch-row[data-ch="${CSS.escape(id)}"]`);
  const ch = state.room.channels.find((c) => c.id === id);
  if (!row || !ch) return;

  row.innerHTML = `<span class="dot"></span><input value="${esc(ch.name)}" maxlength="20" />`;
  const inp = row.querySelector('input');
  inp.focus();
  inp.select();
  let done = false;

  const commit = async (save) => {
    if (done) return;
    done = true;
    if (save && inp.value.trim() && inp.value.trim() !== ch.name) {
      const data = await api('/api/channel/rename', { id, name: inp.value.trim(), clientId: state.me });
      if (data.error) toast(data.error);
      await reloadAll();
    } else {
      renderAll();
    }
  };

  inp.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); commit(true); }
    if (e.key === 'Escape') { e.preventDefault(); commit(false); }
  });
  inp.addEventListener('blur', () => commit(true));
}

/* =========================================================================
 * 11. 启动
 * ========================================================================= */
async function boot() {
  const sess = loadSession();
  if (Array.isArray(sess.windows) && sess.windows.length) {
    state.windows = sess.windows.map((w) => ({
      id: w.id || uuid(),
      channel: w.channel || 'main',
      identity: w.identity || '',
      kind: ['auto', 'ic', 'emote', 'ooc'].includes(w.kind) ? w.kind : 'auto',
      vis: ['all', 'dm', 'direct'].includes(w.vis) ? w.vis : 'all',
      audience: Array.isArray(w.audience) ? w.audience : [],
      search: '',
    }));
    state.focused = sess.focused || (state.windows[0] && state.windows[0].id) || null;
  } else {
    state.windows = [];
  }

  state.me = currentAccount();
  bindGlobal();

  const data = await api(`/api/state?since=0&me=${encodeURIComponent(state.me)}`);
  if (data.error) {
    $('#windows').innerHTML = '<div class="thread-empty" style="margin:auto">无法连接服务端，请确认 node server.js 正在运行</div>';
    return;
  }
  applySnapshot(data);
  loadEmojis();

  /* 论坛登录态自动进入；点过「切换」之后尊重手动选的账号 */
  if (data.forumPlayer && sessionStorage.getItem(MANUAL_KEY) !== '1') {
    if (state.me !== data.forumPlayer) {
      setAccount(data.forumPlayer);
      state.me = data.forumPlayer;
      await reloadAll();
      toast(`已以「${state.me}」进入`);
    }
    startRoom();
    return;
  }

  if (!state.me) { openPicker(); return; }

  startRoom();
}

function startRoom() {
  state.booted = true;
  $('#picker').hidden = true;
  renderAll();
  if (!pollTimer) pollTimer = setInterval(poll, 1500);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });
}

async function chooseAccount(name) {
  const n = String(name || '').trim();
  if (!n) { toast('请输入玩家名'); return; }
  setAccount(n);
  /* 选回自己的论坛身份 -> 以后不再强制手动选 */
  if (state.forumPlayer && n === state.forumPlayer) sessionStorage.removeItem(MANUAL_KEY);
  state.me = n;
  await reloadAll();
  startRoom();
  toast(`已以「${n}」进入`);
}

/* ---------------- 账号选择 ---------------- */
let pickerSel = '';

function updatePickerGo() {
  const btn = $('#picker-go');
  if (!btn) return;
  const typed = ($('#picker-new') ? $('#picker-new').value : '').trim();
  if (pickerSel) { btn.textContent = `进入「${pickerSel}」`; btn.disabled = false; }
  else if (typed) { btn.textContent = `以「${typed}」进入`; btn.disabled = false; }
  else { btn.textContent = '进入'; btn.disabled = true; }
}

function openPicker() {
  pickerSel = '';
  $('#picker').hidden = false;
  renderPicker();
  setTimeout(() => { const q = $('#picker-q'); if (q) q.focus(); }, 60);
}

function renderPicker() {
  const qEl = $('#picker-q');
  const q = (qEl ? qEl.value : '').trim().toLowerCase();

  const map = new Map();
  for (const c of state.characters) {
    const key = c.owner || '（无主）';
    if (!map.has(key)) map.set(key, []);
    map.get(key).push(c);
  }

  const sub = $('#picker-sub');
  if (state.forumPlayer) {
    sub.innerHTML = `${map.size} 位玩家 · ${state.characters.length} 张卡 · `
      + `<button class="pk-forum" id="pk-forum">用论坛身份「${esc(state.forumPlayer)}」进入</button>`;
  } else {
    sub.textContent = state.characters.length
      ? `${map.size} 位玩家 · ${state.characters.length} 张角色卡`
      : '还没有角色卡';
  }

  const entries = [...map.entries()].filter(([name]) => !q || name.toLowerCase().includes(q));

  if (!entries.length) {
    $('#picker-list').innerHTML = `<div class="empty" style="padding:10px 4px">${state.characters.length ? '没有匹配的玩家名' : '先在下面输入一个玩家名'}</div>`;
    updatePickerGo();
    return;
  }

  $('#picker-list').innerHTML = entries.map(([name, arr]) => `
    <button class="pk-row${name === pickerSel ? ' on' : ''}" data-name="${esc(name)}">
      <span class="pk-avs">${arr.slice(0, 3).map((c) => avatarHtml(c)).join('')}</span>
      <span class="pk-n">${esc(name)}</span>
      <span class="pk-c">${arr.length} 个角色</span>
    </button>`).join('');

  updatePickerGo();
}

boot();
</script>
