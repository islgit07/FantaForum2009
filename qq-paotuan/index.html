<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>跑团桌 · 怪啖规则</title>
<style>
  :root{
    --bg:#0c0f12;
    --panel:#121619;
    --panel2:#161b20;
    --panel3:#1b2127;
    --line:#232a31;
    --line2:#2e3742;
    --text:#dde3ea;
    --dim:#828d9b;
    --dim2:#5f6a77;
    --blue:#6aa8ff;
    --cyan:#7fd1c0;
    --amber:#d8a657;
    --red:#d9737a;
    --green:#8fd6a4;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    /* 骰子面 */
    --die-bg:#1b222a; --die-line:#333d48; --die-text:#dbe4ee;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--text);overflow:hidden;
    font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  button{
    font:inherit;color:var(--text);background:var(--panel3);border:1px solid var(--line);
    border-radius:5px;padding:4px 9px;cursor:pointer;line-height:1.4;
  }
  button:hover{border-color:var(--line2);background:#202730}
  button:active{transform:translateY(.5px)}
  button:disabled{opacity:.4;cursor:not-allowed}
  button.ghost{background:transparent;border-color:transparent;color:var(--dim)}
  button.ghost:hover{color:var(--text);background:rgba(255,255,255,.04)}
  button.primary{background:#1d2b3c;border-color:#33506e;color:#cfe3ff}
  button.primary:hover{background:#22334a}
  button.danger:hover{color:var(--red);border-color:rgba(217,115,122,.45)}
  input,select,textarea{
    font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);
    border-radius:5px;padding:4px 7px;outline:none;
  }
  input:focus,select:focus,textarea:focus{border-color:#3a4c60;background:#131820}
  input::placeholder,textarea::placeholder{color:var(--dim2)}
  select{cursor:pointer}
  svg{display:block}
  ::-webkit-scrollbar{width:7px;height:7px}
  ::-webkit-scrollbar-thumb{background:#2a323a;border-radius:5px;border:2px solid var(--bg)}
  ::-webkit-scrollbar-thumb:hover{background:#374151}
  ::-webkit-scrollbar-track{background:transparent}

  /* ---------- 布局 ---------- */
  #app{display:flex;height:100vh;align-items:stretch}

  aside.side{
    width:262px;flex:0 0 262px;background:var(--panel);border-right:1px solid var(--line);
    display:flex;flex-direction:column;min-height:0;
  }
  .brand{
    display:flex;align-items:center;gap:8px;padding:12px 14px 10px;border-bottom:1px solid var(--line);
  }
  .brand b{font-size:13.5px;letter-spacing:.06em;font-weight:600}
  .brand .mode{
    margin-left:auto;font-size:10.5px;color:var(--dim2);border:1px solid var(--line);
    padding:0 5px;border-radius:3px;line-height:17px;
  }
  .side-scroll{flex:1;overflow-y:auto;padding:6px 0 10px;min-height:0}
  .grp{padding:10px 12px 4px}
  .grp-head{display:flex;align-items:center;gap:6px;margin-bottom:7px}
  .grp-head h3{
    margin:0;font-size:11px;font-weight:600;letter-spacing:.1em;color:var(--dim2);
    text-transform:uppercase;
  }
  .grp-head .sp{margin-left:auto;display:flex;gap:4px}
  .grp-head button{padding:1px 5px;background:transparent;border-color:transparent;color:var(--dim)}
  .grp-head button:hover{color:var(--text);background:rgba(255,255,255,.05)}

  .side-foot{
    border-top:1px solid var(--line);padding:8px;display:flex;gap:6px;flex-wrap:wrap;
  }
  .side-foot button{flex:1;min-width:calc(50% - 3px);font-size:12px;padding:6px 4px}

  /* ---------- 频道 ---------- */
  .ch-row{
    display:flex;align-items:center;gap:6px;padding:5px 7px;border-radius:5px;cursor:pointer;
    border:1px solid transparent;font-size:13px;
  }
  .ch-row:hover{background:rgba(255,255,255,.035)}
  .ch-row.on{background:#1a222b;border-color:var(--line2)}
  .ch-row .dot{width:5px;height:5px;border-radius:50%;background:var(--dim2);flex:0 0 auto}
  .ch-row.on .dot{background:var(--blue)}
  .ch-row .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ch-row .cnt{font-size:10.5px;color:var(--dim2);font-variant-numeric:tabular-nums}
  .ch-row .unread{width:5px;height:5px;border-radius:50%;background:var(--blue);flex:0 0 auto;margin-right:1px}
  .ch-row .ops{display:none;gap:2px}
  .ch-row:hover .ops{display:flex}
  .ch-row .ops button{padding:0 3px;background:transparent;border-color:transparent;color:var(--dim2)}
  .ch-row .ops button:hover{color:var(--text)}
  .ch-row input{flex:1;padding:1px 5px;font-size:12.5px}

  /* ---------- 角色 ---------- */
  .char-tools{display:flex;gap:5px;margin:0 8px 6px;align-items:center}
  .char-tools .seg{flex:0 0 auto}
  .char-tools input{flex:1;min-width:0;height:24px;font-size:11.5px;padding:1px 6px}

  .cav{
    position:relative;display:flex;align-items:center;justify-content:center;
    background:#1d2329;border:1px solid var(--line);border-radius:6px;overflow:hidden;flex:0 0 auto;
  }
  .cav b{font-size:12px;font-weight:600;color:var(--dim)}
  .cav img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .cav-lg{width:58px;height:58px;border-radius:8px}
  .cav-lg b{font-size:20px}

  .cgroup{display:flex;align-items:center;gap:6px;padding:7px 9px 2px;font-size:10.5px;color:var(--dim2);letter-spacing:.03em}
  .cgroup span{margin-left:auto;font-size:9.5px}
  .char-row{display:flex;gap:8px;padding:6px 8px;border-radius:6px;border:1px solid transparent;cursor:pointer;margin-bottom:2px}
  .char-row:hover{background:rgba(255,255,255,.035)}
  .char-row .cav{width:30px;height:30px}
  .char-row .cav b{font-size:12px}
  .cbody{flex:1;min-width:0}
  .char-top{display:flex;align-items:baseline;gap:6px}
  .char-name{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:130px}
  .char-sub{margin-left:auto;font-size:10px;color:var(--dim2);flex:0 0 auto}
  .char-meta{display:flex;align-items:center;gap:4px;margin-top:2px;font-size:10px;color:var(--dim2);white-space:nowrap;overflow:hidden}
  .char-player{color:#8b98a8;overflow:hidden;text-overflow:ellipsis;max-width:104px}
  .char-meta .cdot{color:#39424e}
  .cbar{margin-top:4px}
  .pending{font-size:9.5px;color:#8a7a55;border:1px solid rgba(216,166,87,.25);border-radius:3px;padding:0 3px}

  .hpbar{flex:1;height:3px;background:#1e252d;border-radius:2px;overflow:hidden}
  .hpbar i{display:block;height:100%;background:#4c7a5c;border-radius:2px;transition:width .2s}
  .hpbar i.low{background:#8a5a3c}
  .hpbar i.crit{background:#8c4148}
  .own-tag{font-size:9.5px;color:var(--dim2);border:1px solid var(--line);border-radius:3px;padding:0 3px}
  .cond-row{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}
  .cond-row span{font-size:9.5px;color:#c9a86a;border:1px solid rgba(216,166,87,.26);border-radius:3px;padding:0 4px;line-height:15px;white-space:nowrap}
  .empty{font-size:11.5px;color:var(--dim2);padding:2px 8px 6px}

  /* ---------- 账号选择 ---------- */
  .pk-list{max-height:46vh;overflow-y:auto;margin-top:2px}
  .pk-row{
    display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:7px 9px;
    background:transparent;border:1px solid transparent;border-radius:6px;cursor:pointer;
  }
  .pk-row:hover{background:rgba(255,255,255,.045);border-color:var(--line)}
  .pk-row.on{background:#22303f;border-color:#3d6a99}
  .pk-n{font-size:13.5px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pk-c{font-size:10.5px;color:var(--dim2);flex:0 0 auto}
  .pk-avs{display:flex;flex:0 0 auto}
  .pk-avs .cav{width:22px;height:22px;border-radius:4px;margin-left:-6px;border-color:#0c0f12}
  .pk-avs .cav:first-child{margin-left:0}

  /* ---------- 房间公告 ---------- */
  .announce{
    display:flex;gap:9px;align-items:flex-start;padding:7px 12px;flex:0 0 auto;
    background:rgba(216,166,87,.075);border-bottom:1px solid rgba(216,166,87,.25);
  }
  .announce[hidden]{display:none}
  .an-icon{flex:0 0 auto;color:var(--amber);margin-top:2px}
  .an-body{flex:1;min-width:0}
  .an-text{
    font-size:12.5px;line-height:1.6;color:#e6d3ae;white-space:pre-wrap;word-break:break-word;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer;
  }
  .announce.open .an-text{-webkit-line-clamp:unset;display:block}
  .an-meta{font-size:10px;color:#8a7a55;margin-top:2px}
  .an-edit{flex:0 0 auto;font-size:11px;padding:1px 7px;background:transparent;border-color:rgba(216,166,87,.35);color:#d8b26a}
  .an-edit:hover{background:rgba(216,166,87,.12)}

  /* ---------- 主区 ---------- */
  main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
  .topbar{
    display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);
    background:var(--panel);flex:0 0 auto;
  }
  .topbar .tch{font-size:13px;font-weight:600}
  .topbar .tch span{color:var(--dim2);font-weight:400;margin-left:6px;font-size:11.5px}
  .cbt-strip{
    display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--dim);
    border-left:1px solid var(--line);padding-left:10px;
  }
  .cbt-strip b{color:var(--amber);font-weight:600}
  .cs-sep{color:var(--dim2)}
  .cs-turn{
    color:var(--amber);font-weight:600;
    animation:turnPulse 1.3s ease-in-out infinite;
  }
  @keyframes turnPulse{0%,100%{opacity:1}50%{opacity:.45}}
  .cs-wait{color:var(--dim)}
  .hp-tag{
    font-family:var(--mono);font-size:10px;line-height:14px;padding:0 4px;
    border-radius:3px;border:1px solid var(--line);color:var(--dim);flex:0 0 auto;
  }
  .hp-tag.low{color:var(--amber);border-color:rgba(216,166,87,.42)}
  .hp-tag.crit{color:var(--red);border-color:rgba(217,115,122,.45);background:rgba(217,115,122,.1)}
  .t-pick{accent-color:var(--amber);margin:0 4px 0 0;flex:0 0 auto}
  .atk-targets{display:flex;flex-direction:column;gap:6px}
  .atk-targets button{
    display:flex;justify-content:space-between;align-items:center;
    padding:9px 12px;border-radius:7px;cursor:pointer;text-align:left;
    border:1px solid var(--line);background:rgba(127,127,127,.06);color:var(--text);
  }
  .atk-targets button:hover{border-color:var(--line2);background:rgba(127,127,127,.13)}
  .at-name{font-size:13px}
  .at-ac{font-size:11px;color:var(--dim2);font-family:var(--mono)}
  .mon-tpl{display:flex;align-items:center;gap:5px;margin:0 0 6px;font-size:11px;color:var(--dim2);flex-wrap:wrap}
  .mon-tpl button{
    padding:2px 8px;font-size:11px;border-radius:5px;cursor:pointer;
    border:1px solid var(--line);background:rgba(127,127,127,.06);color:var(--dim);
  }
  .mon-tpl button:hover{border-color:var(--line2);color:var(--text)}
  .dc-quick{display:flex;gap:3px;flex:0 0 auto}
  .dc-quick button{
    padding:0 5px;height:26px;font-size:11px;border-radius:4px;cursor:pointer;
    border:1px solid var(--line);background:rgba(127,127,127,.06);color:var(--dim);
  }
  .dc-quick button:hover{border-color:var(--line2);color:var(--text)}
  .dc-quick button.hot{border-color:rgba(216,166,87,.45);color:var(--amber)}
  .ci-list{display:flex;flex-direction:column;gap:3px;margin:5px 0}
  .ci-row{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:11.5px;color:var(--dim)}
  .ci-row.done{opacity:.6}
  .rps-btns{display:flex;gap:6px;margin-top:7px;width:100%}
  .rps-btns button{
    flex:1;padding:9px 0;font-size:13px;font-weight:600;border-radius:7px;cursor:pointer;
    border:1px solid var(--line2);background:rgba(127,127,127,.1);color:var(--text);
  }
  .rps-btns button:hover{border-color:var(--line2);background:rgba(127,127,127,.13)}
  .rps-hand{font-size:17px;line-height:1}
  .rps-line{align-items:center;gap:5px}
  .ci-foot{display:flex;flex-direction:column;align-items:stretch;gap:6px;margin-top:7px}
  .ci-join{
    width:100%;padding:8px 0;font-size:13px;font-weight:600;letter-spacing:.02em;text-align:center;
    border-radius:7px;cursor:pointer;
    border:1px solid rgba(106,168,255,.6);background:rgba(106,168,255,.22);color:var(--blue);
  }
  .ci-join:hover{background:rgba(106,168,255,.34);border-color:rgba(106,168,255,.8)}
  .ci-join:disabled{opacity:.55;cursor:default}
  .lot-join{
    padding:4px 12px;font-size:12px;font-weight:600;border-radius:6px;cursor:pointer;white-space:nowrap;
    border:1px solid rgba(143,214,164,.55);background:rgba(143,214,164,.16);color:var(--green);
  }
  .lot-join:hover{background:rgba(143,214,164,.3);border-color:rgba(143,214,164,.8)}
  .lot-join:disabled{opacity:.55;cursor:default}
  .lot-close{
    padding:7px 0;font-size:12.5px;font-weight:600;border-radius:7px;cursor:pointer;width:100%;
    border:1px solid rgba(216,166,87,.6);background:rgba(216,166,87,.16);color:var(--amber);
  }
  .lot-close:hover{background:rgba(216,166,87,.3)}
  .lot-close:disabled{opacity:.55;cursor:default}
  .lot-win{
    display:flex;align-items:center;gap:8px;margin:6px 0 2px;padding:8px 10px;border-radius:7px;
    border:1px solid rgba(216,166,87,.55);background:rgba(216,166,87,.12);
  }
  .lot-win .lw-name{font-size:16px;font-weight:700;color:var(--amber)}
  .lot-win .lw-tag{font-size:11px;color:var(--dim2)}
  .lot-tally{font-size:11px;color:var(--dim2)}
  .atk-k{font-size:10.5px;color:var(--dim2);flex:0 0 auto;width:26px}
  .atk-row{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
  .atk-row button{
    padding:2px 9px;font-size:11.5px;border-radius:5px;cursor:pointer;
    border:1px solid rgba(216,166,87,.45);background:rgba(216,166,87,.1);color:var(--amber);
  }
  .atk-row button:hover{background:rgba(216,166,87,.2)}
  .weapon-list{margin-bottom:4px}
  .ct-box{border:1px solid rgba(216,166,87,.25);background:rgba(216,166,87,.045);border-radius:6px;padding:8px;margin-bottom:4px}
  .ct-box select,.ct-box input{font-size:12px}
  .ct-mode button{flex:1;font-size:11.5px}
  /* 拼点结果表 */
  .ct-table{width:100%;border-collapse:collapse;font-size:11.5px;margin-top:2px}
  .ct-table td{padding:2px 5px;border-bottom:1px solid var(--line)}
  .ct-table tr:last-child td{border-bottom:0}
  .ct-table td.num{font-family:var(--mono);white-space:nowrap}
  .ct-table td.ct-vs{color:var(--dim2);font-size:10px;text-align:center;width:22px}
  .ct-table tr.lose td{opacity:.72}
  .cbt-pick-hint{font-size:10px;color:var(--dim2);font-weight:400;letter-spacing:0}
  .cbt-picks{display:flex;flex-wrap:wrap;gap:4px;max-height:140px;overflow:auto;margin-bottom:10px}
  .cbt-pick{
    display:flex;align-items:center;gap:4px;padding:2px 7px;border-radius:5px;
    border:1px solid var(--line);font-size:11.5px;color:var(--dim);cursor:pointer;
  }
  .cbt-pick.on{color:var(--blue);border-color:rgba(106,168,255,.5);background:rgba(106,168,255,.1)}
  .cbt-pick input{accent-color:var(--blue);margin:0}
  .cs-hp{font-family:var(--mono);font-size:10.5px;color:var(--dim2);margin-left:2px}
  .cs-next{
    margin-left:4px;padding:1px 8px;font-size:11px;border-radius:5px;line-height:17px;
    border:1px solid rgba(216,166,87,.5);background:rgba(216,166,87,.12);color:var(--amber);cursor:pointer;
  }
  .cs-next:hover{background:rgba(216,166,87,.2)}
  .topbar .sp{margin-left:auto;display:flex;align-items:center;gap:8px}
  .me-tag{font-size:11px;color:var(--dim2);font-family:var(--mono)}

  #windows{flex:1;display:flex;gap:8px;padding:8px;min-height:0;overflow-x:auto;overflow-y:hidden}

  /* ---------- 窗口 ---------- */
  .win{
    flex:1 1 320px;min-width:288px;display:flex;flex-direction:column;min-height:0;
    background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;
  }
  .win-head{
    display:flex;align-items:center;gap:6px;padding:5px 7px;
    border-bottom:1px solid var(--line);background:var(--panel2);flex:0 0 auto;
  }
  .wh-id{display:flex;align-items:center;gap:6px;min-width:0;width:100%}
  .w-grip{
    flex:0 0 auto;display:flex;align-items:center;justify-content:center;padding:0 1px;
    background:transparent;border-color:transparent;color:#39434f;cursor:grab;height:22px;
  }
  .w-grip:hover{color:var(--dim)}
  .w-grip:active{cursor:grabbing}
  .win.pane-dragging{opacity:.5}
  .win.pane-drop-before{box-shadow:-3px 0 0 0 var(--blue)}
  .w-ch{
    flex:1;min-width:0;font-size:12.5px;font-weight:600;color:#c2ccd8;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .w-ch span{color:var(--dim2);font-weight:400;margin-right:3px}
  .win.focused{border-color:#2f4254}
  .win.focused .win-head{background:#1a2027}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:5px;overflow:hidden;flex:0 0 auto}
  .seg button{
    border:0;border-radius:0;background:transparent;padding:3px 7px;font-size:11.5px;
    color:var(--dim);line-height:1.5;
  }
  .seg button:hover{background:rgba(255,255,255,.045);color:var(--text)}
  .seg button + button{border-left:1px solid var(--line)}
  .seg button.on{background:#22303f;color:#cfe3ff}
  .seg button.on[data-kind="emote"]{background:#1d3331;color:var(--cyan)}
  .w-search{flex:0 1 72px;min-width:42px;height:23px;font-size:11px;padding:1px 6px}
  .w-close{padding:3px 4px;background:transparent;border-color:transparent;color:var(--dim2);flex:0 0 auto}
  .w-close:hover{color:var(--text)}

  /* 输入区工具条：说话身份 + 类型 + 可见性 */
  .compose-bar{display:flex;align-items:center;gap:9px}
  .compose-bar .w-av{display:flex;flex:0 0 auto}
  .compose-bar .cav{width:40px;height:40px;border-radius:8px;border-color:#2b3644}
  .compose-bar .cav b{font-size:16px;color:#7f8b99}
  .cb-right{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
  .compose-bar .w-id{
    width:100%;height:25px;font-size:12.5px;font-weight:600;padding:1px 5px;
    background:#171c22;border-color:#282f38;color:#d5dde7;
  }
  .cb-tools{display:flex;gap:5px;flex-wrap:wrap}

  .msgs-wrap{position:relative;flex:1;min-height:0;display:flex}
  .msgs{
    flex:1;width:100%;min-height:0;overflow-y:auto;padding:8px 8px 10px;display:flex;flex-direction:column;gap:5px;
    overflow-anchor:none;
  }
  .w-gobottom{
    position:absolute;right:12px;bottom:10px;width:26px;height:26px;border-radius:50%;display:none;
    align-items:center;justify-content:center;background:var(--panel3);border:1px solid var(--line2);
    color:var(--dim);box-shadow:0 6px 16px rgba(0,0,0,.45);padding:0;
  }
  .w-gobottom.show{display:flex}
  .w-gobottom:hover{color:var(--text)}

  /* 连续同人消息：不重复头像和名字 */
  .msg.cont{padding-left:43px;padding-top:2px}
  .msg.cont::before{
    content:attr(data-time);position:absolute;left:1px;top:4px;font-size:9.5px;color:#46505c;
    opacity:0;transition:opacity .12s;font-variant-numeric:tabular-nums;
  }
  .msg.cont:hover::before{opacity:1}

  /* 消息悬浮操作 */
  .msg-ops{
    position:absolute;top:3px;right:5px;display:none;gap:1px;align-items:center;
    background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:0 1px;
  }
  .msg:hover .msg-ops{display:flex}
  .msg-ops button{padding:1px 4px;background:transparent;border:0;border-radius:3px;color:var(--dim2);font-size:10.5px;line-height:16px}
  .msg-ops button:hover{color:var(--text);background:rgba(255,255,255,.07)}
  .msg-ops button.danger:hover{color:var(--red)}

  .edit-mark{font-size:9.5px;color:var(--dim2);margin-left:4px}

  /* 消息更多菜单 */
  .msg-menu{
    position:fixed;z-index:80;min-width:158px;background:var(--panel3);border:1px solid var(--line2);
    border-radius:6px;padding:4px;box-shadow:0 14px 34px rgba(0,0,0,.55);display:flex;flex-direction:column;gap:1px;
  }
  .msg-menu .info{padding:1px 8px 6px;font-size:10.5px;color:var(--dim2);line-height:1.6}
  .msg-menu .mi{padding:5px 8px;border-radius:4px;background:transparent;border:0;color:var(--text);font-size:12.5px;text-align:left}
  .msg-menu .mi:hover{background:rgba(255,255,255,.07)}
  .msg-menu .mi.danger{color:var(--red)}

  /* 折叠 */
  .fold-hint{display:none;font-size:11px;color:var(--dim2);margin-top:2px}
  .msg.folded:not(.unfolded) .m-body,
  .msg.folded:not(.unfolded) .quote,
  .msg.folded:not(.unfolded) .dice,
  .msg.folded:not(.unfolded) .edit-mark{display:none}
  .msg.folded:not(.unfolded) .fold-hint{display:block}
  .msg.folded:not(.unfolded){opacity:.72}
  .fold-hint button{padding:0 5px;font-size:10.5px;background:transparent;border-color:var(--line);color:var(--dim)}

  /* 草稿历史 */
  .hist-pop{
    position:absolute;left:7px;right:7px;bottom:calc(100% + 4px);background:var(--panel3);
    border:1px solid var(--line2);border-radius:7px;padding:5px;max-height:230px;overflow:auto;
    box-shadow:0 12px 32px rgba(0,0,0,.55);z-index:30;
  }
  .hist-pop[hidden]{display:none}
  .hist-head{display:flex;align-items:center;font-size:10.5px;color:var(--dim2);padding:1px 4px 5px;letter-spacing:.04em}
  .hist-head button{margin-left:auto;font-size:10.5px;padding:0 5px;background:transparent;border-color:transparent;color:var(--dim2)}
  .hist-head button:hover{color:var(--text)}
  .hist-item{
    display:block;width:100%;text-align:left;padding:5px 6px;border-radius:4px;background:transparent;border:0;
    color:#c6d1de;font-size:12px;line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .hist-item:hover{background:rgba(255,255,255,.06)}
  .hist-item .ht{color:var(--dim2);font-size:10px;margin-left:6px}

  /* 成员面板 */
  .mem-dm{
    display:flex;align-items:center;gap:6px;padding:6px 2px 8px;font-size:12.5px;color:#e6cd9f;
    border-bottom:1px solid var(--line);margin-bottom:8px;
  }
  .mem-group{margin-bottom:10px}
  .mem-pname{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--dim2);letter-spacing:.04em;margin:0 2px 3px}
  .mem-pname span{margin-left:auto;font-size:9.5px}
  .mem-char{display:flex;gap:8px;align-items:center;padding:4px 5px;border-radius:5px;cursor:pointer}
  .mem-char:hover{background:rgba(255,255,255,.04)}
  .mem-char .cav{width:26px;height:26px;border-radius:5px}
  .mem-char .cav b{font-size:11px}
  .mc-body{min-width:0}
  .mc-name{font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mc-meta{font-size:10px;color:var(--dim2)}
  /* ---------- 掷骰复盘 ---------- */
  .npc-add{
    font-size:9.5px!important;letter-spacing:.04em;color:var(--amber)!important;
    border-color:rgba(216,166,87,.45)!important;padding:0 6px;height:18px;line-height:16px;
  }
  .death-row{
    display:flex;align-items:center;gap:6px;margin-top:4px;font-size:10.5px;color:var(--red);
  }
  .death-row.dead{color:var(--dim2)}
  .death-row.stable{color:var(--blue)}
  .death-tag{
    padding:0 4px;border-radius:3px;border:1px solid rgba(217,115,122,.5);
    background:rgba(217,115,122,.12);font-size:9.5px;line-height:14px;
  }
  .death-dots{font-family:var(--mono);letter-spacing:1px;color:var(--dim)}
  .death-row button{font-size:10px;padding:0 6px;height:17px;border-radius:4px}
  .npc-tag{
    font-size:9.5px;line-height:14px;padding:0 4px;border-radius:3px;margin-left:5px;
    border:1px solid rgba(216,166,87,.45);color:var(--amber);vertical-align:1px;
  }
  .cgroup.npc-group{color:var(--amber)}
  /* 表情回应 */
  .reactions{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
  .react{
    display:inline-flex;align-items:center;gap:3px;padding:1px 6px;border-radius:9px;
    border:1px solid var(--line);background:rgba(127,127,127,.06);
    font-size:11px;color:var(--dim);cursor:pointer;line-height:16px;
  }
  .react:hover{border-color:var(--line2)}
  .react.mine{border-color:rgba(106,168,255,.5);background:rgba(106,168,255,.14);color:var(--blue)}
  /* 场景分隔 */
  .msg.k-scene{background:transparent;border:0;padding:10px 0}
  .scene-line{display:flex;align-items:center;gap:12px;color:var(--amber);font-size:12.5px;letter-spacing:.12em}
  .scene-line::before,.scene-line::after{
    content:"";flex:1;height:1px;
    background:linear-gradient(90deg,transparent,rgba(216,166,87,.55),transparent);
  }
  .scene-line span{white-space:nowrap}
  .npc-toggle{display:flex;align-items:center;gap:7px;margin:7px 0 2px;font-size:12px;color:var(--dim);cursor:pointer}
  .npc-toggle input{accent-color:var(--amber)}
  .rl-head{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
  .rl-head button{padding:3px 10px;font-size:11.5px;border-radius:5px;border:1px solid var(--line);background:transparent;color:var(--dim)}
  .rl-head button.on{color:var(--text);border-color:var(--line2);background:rgba(127,127,127,.1)}
  .rl-table{width:100%;border-collapse:collapse;font-size:12px}
  .rl-table th{text-align:left;color:var(--dim2);font-weight:500;font-size:11px;padding:4px 6px;border-bottom:1px solid var(--line)}
  .rl-table td{padding:4px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
  .rl-table td.num{font-family:var(--mono);font-weight:700}
  .gm-notes{margin-top:10px;border-top:1px solid var(--line);padding-top:9px}
  .gm-notes .gt{font-size:10.5px;color:var(--dim2);letter-spacing:.08em;margin-bottom:5px;display:flex;align-items:center;gap:6px}
  .gm-notes textarea{width:100%;min-height:120px;resize:vertical;font-size:12.5px;line-height:1.65}
  .gm-notes .gn-foot{display:flex;justify-content:flex-end;margin-top:5px;gap:5px}

  /* 正在输入 */
  .typing{flex:0 0 auto;height:17px;padding:0 10px;font-size:11px;color:var(--dim2);display:flex;align-items:center;gap:5px}
  .typing[hidden]{display:none}
  .typing .cav{width:14px;height:14px;border-radius:3px;border:0}
  .typing .cav b{font-size:8px}

  /* 回复引用 */
  .quote{
    display:flex;gap:4px;align-items:baseline;font-size:11px;line-height:1.5;color:var(--dim2);
    border-left:2px solid var(--line2);padding:0 0 0 6px;margin-bottom:3px;cursor:pointer;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .quote:hover{color:var(--dim)}
  .quote b{color:#9fb0c4;font-weight:600;flex:0 0 auto}
  .quote span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .msg.flash{animation:flash 900ms ease}
  @keyframes flash{0%{background:rgba(106,168,255,.22)}100%{background:transparent}}
  .reply-bar{
    display:flex;gap:5px;align-items:baseline;padding:4px 7px;border-radius:5px;
    background:#1a2027;border:1px solid var(--line);font-size:11px;color:var(--dim2);
  }
  .reply-bar[hidden]{display:none}
  .reply-bar b{color:#9fb0c4;flex:0 0 auto}
  .reply-bar .rb-text{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .reply-bar button{padding:0 4px;font-size:11px;background:transparent;border-color:transparent;color:var(--dim2)}
  .msg.editing{border-color:var(--line2)}
  .edit-box{display:flex;flex-direction:column;gap:5px;margin-top:2px}
  .edit-ta{width:100%;min-height:54px;max-height:220px;resize:vertical;font-size:13px;line-height:1.55}
  .edit-acts{display:flex;gap:5px;justify-content:flex-end}
  .edit-acts button{font-size:11.5px;padding:2px 9px}
  .thread-empty{margin:auto;text-align:center;color:var(--dim2);font-size:12px;line-height:1.9;padding:20px 10px}
  .thread-empty kbd{
    font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-radius:3px;
    padding:0 3px;color:var(--dim);
  }

  /* ---------- 消息 ---------- */
  .msg{
    padding:6px 9px 7px;border-radius:7px;border:1px solid transparent;position:relative;
    flex:0 0 auto;cursor:default;display:flex;gap:8px;align-items:flex-start;
  }
  .msg.k-system{display:block;text-align:center}
  .msg .m-main{flex:1;min-width:0}
  .cav-msg{width:26px;height:26px;border-radius:5px;margin-top:1px}
  .cav-msg b{font-size:11px}
  .msg .m-head{display:flex;align-items:baseline;gap:6px;margin-bottom:1px;font-size:11.5px;color:var(--dim);line-height:1.5}
  .msg .who{color:#aeb9c7;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .msg .mt{margin-left:auto;color:var(--dim2);font-size:10px;font-variant-numeric:tabular-nums;flex:0 0 auto}
  .msg .m-body{white-space:pre-wrap;word-break:break-word;font-size:13.5px;line-height:1.62}
  .badge{
    font-size:9.5px;padding:0 4px;border-radius:3px;border:1px solid var(--line);
    color:var(--dim);line-height:15px;flex:0 0 auto;font-weight:400;
  }
  .badge.dm{color:var(--amber);border-color:rgba(216,166,87,.35)}
  .badge.gm{color:#12161a;background:var(--amber);border-color:var(--amber);font-weight:600}
  .msg.gm{border-left:3px solid var(--amber);background:rgba(216,166,87,.06)}
  .msg.gm .who{color:#e6cd9f}
  .msg.gm.whisper{border-left-color:var(--amber)}
  .badge.w{color:var(--amber);border-color:rgba(216,166,87,.3)}

  .k-ic{background:rgba(106,168,255,.055);border-color:rgba(106,168,255,.13)}
  .k-ic .m-body{color:#dbe7f7}

  /* 动作：青色斜体 + » */
  .k-emote{background:rgba(127,209,192,.05);border-color:rgba(127,209,192,.12)}
  .k-emote .m-body{color:var(--cyan);font-style:italic}
  .k-emote .m-body::before{content:"» ";font-style:normal;opacity:.75}

  /* 皮下：与系统提示同一形态——居中细字「玩家名：内容」，不可回复、不可操作 */
  .msg.k-ooc{padding:1px 6px;border:0;background:transparent;display:block;border-radius:0}
  .sys-ooc{
    text-align:center;font-size:11.5px;color:#7e8b9a;line-height:1.75;
    white-space:pre-wrap;word-break:break-word;font-style:italic;
  }
  .sys-ooc b{color:#96a4b4;font-weight:600;font-style:normal}
  .sys-ooc b.gm{color:#cfaa6b}
  .sys-ooc .ooc-vis{color:#8a7a55;font-size:10.5px;font-style:normal;margin-left:2px}
  .sys-ooc .dice-inline{font-style:normal}

  /* ---------- 掷骰消息：独立卡片风，和普通对话明显区分 ---------- */
  .msg.k-roll{
    background:linear-gradient(135deg,rgba(106,168,255,.075),rgba(106,168,255,.015));
    border:1px solid rgba(106,168,255,.22);
    border-radius:10px;
    padding:7px 9px;
  }
  .msg.k-roll:hover{border-color:rgba(106,168,255,.4)}
  .msg.k-roll .who{font-family:inherit}
  .msg.k-roll .dice-card{
    background:rgba(255,255,255,.03);
    border-color:rgba(106,168,255,.18);
    margin-top:3px;
  }
  /* 主持人掷骰：跟着主持人金色走 */
  .msg.k-roll.gm{
    background:linear-gradient(135deg,rgba(216,166,87,.1),rgba(216,166,87,.02));
    border-color:rgba(216,166,87,.3);
  }
  .msg.k-roll.gm .dice-card{background:rgba(216,166,87,.045);border-color:rgba(216,166,87,.2)}
  /* 大成功 / 大失败 */
  .msg.k-roll.crit{
    background:linear-gradient(135deg,rgba(216,166,87,.16),rgba(216,166,87,.03));
    border-color:rgba(216,166,87,.55);
    box-shadow:0 0 0 1px rgba(216,166,87,.12),0 2px 14px rgba(216,166,87,.14);
  }
  .msg.k-roll.fumble{
    background:linear-gradient(135deg,rgba(217,115,122,.14),rgba(217,115,122,.02));
    border-color:rgba(217,115,122,.5);
  }
  .k-combat{background:rgba(216,166,87,.045);border-color:rgba(216,166,87,.16)}
  .k-combat .m-body{font-size:12.5px;color:#d7c4a0}
  .msg.whisper{border-style:dashed;border-color:rgba(216,166,87,.4);background:rgba(216,166,87,.05)}
  .k-system{padding:2px 6px;border:0;background:transparent}
  .sys{
    text-align:center;font-size:11.5px;color:var(--dim2);padding:2px 6px;line-height:1.6;
    white-space:pre-wrap;word-break:break-word;
  }
  .dice{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;align-items:center;font-family:var(--mono);font-size:11px;color:var(--dim)}
  .chip{border:1px solid var(--line);border-radius:3px;padding:0 5px;font-size:10px;color:var(--dim);line-height:16px;white-space:nowrap}
  .chip.ok{color:var(--green);border-color:rgba(143,214,164,.32)}
  .chip.bad{color:var(--red);border-color:rgba(217,115,122,.32)}
  .chip.nat{color:var(--amber);border-color:rgba(216,166,87,.4)}
  .chip.dc{color:#a8b8cc}

  /* ---------- 掷骰卡片 ---------- */
  .dice-card{
    margin-top:5px;padding:7px 9px;border-radius:8px;max-width:100%;
    background:rgba(127,127,127,.055);border:1px solid var(--line);
    display:flex;flex-direction:column;gap:5px;
  }
  .dc-head{display:flex;align-items:center;gap:5px;flex-wrap:wrap;font-size:11.5px;color:var(--dim)}
  .dc-label{font-family:inherit;font-weight:600;color:var(--text);opacity:.92}
  .dc-line{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
  .dc-line.dropped{opacity:.45}
  .die-face{
    min-width:26px;height:26px;padding:0 5px;border-radius:6px;
    display:inline-flex;align-items:center;justify-content:center;
    font-family:var(--mono);font-size:14px;font-weight:700;line-height:1;
    background:var(--die-bg);border:1px solid var(--die-line);color:var(--die-text);
  }
  .die-face.dropped{opacity:.42;text-decoration:line-through}
  .die-face.crit{border-color:var(--amber);color:var(--amber)}
  .die-face.fumble{border-color:var(--red);color:var(--red)}
  .dice-op{font-family:var(--mono);font-size:12px;color:var(--dim)}
  .dice-op i{font-style:normal;font-size:10px;opacity:.75;margin-left:1px}
  .dice-eq{font-family:var(--mono);color:var(--dim2)}
  .dice-plus{font-family:var(--mono);font-size:12px;color:var(--dim2);flex:0 0 auto}
  .dice-sum{font-family:var(--mono);font-size:18px;font-weight:700;color:var(--text);line-height:1}
  .dice-sum.ok{color:var(--green)}
  .dice-sum.bad{color:var(--red)}
  .dice-sum.crit{color:var(--amber)}
  .dice-sum.fumble{color:var(--red)}

  /* @ 艾特高亮 */
  .mention{
    color:var(--blue);background:rgba(106,168,255,.13);
    border-radius:4px;padding:0 3px;font-weight:600;
  }

  .msg-ph{
    flex:0 0 auto;border:1px dashed rgba(106,168,255,.45);border-radius:7px;
    background:rgba(106,168,255,.045);
  }
  .msg.ghost{
    background:var(--panel2);border-color:var(--line2);border-radius:7px;
    box-shadow:0 14px 34px rgba(0,0,0,.55),0 0 0 1px rgba(106,168,255,.25);
    opacity:.97;
  }
  .msgs.dragging .msg{cursor:grabbing}

  /* ---------- 调整模式（仅主持人） ---------- */
  .win.reorder .msgs .msg[data-seq]{cursor:grab}
  .win.reorder .msgs .msg[data-seq]:hover{outline:1px dashed rgba(140,150,165,.6);outline-offset:-1px;border-radius:6px}
  .win.reorder .msgs{border-color:rgba(214,158,46,.45)}
  .reorder-btn.on{background:rgba(214,158,46,.16);border-color:rgba(214,158,46,.55);color:inherit}

  /* 选人面板里「用论坛身份进入」 */
  #picker-sub .pk-forum{border:0;background:none;padding:0;margin-left:4px;color:var(--blue);font:inherit;cursor:pointer;text-decoration:underline}

  /* ---------- 消息右键 / 长按菜单 ---------- */
  .msg-menu{
    position:fixed;z-index:90;min-width:108px;padding:4px;
    background:var(--panel);border:1px solid var(--line);border-radius:8px;
    box-shadow:0 10px 28px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:2px;
  }
  .msg-menu[hidden]{display:none}
  .msg-menu button{
    text-align:left;padding:8px 12px;border:0;border-radius:6px;background:transparent;
    color:var(--text);font-size:13px;cursor:pointer;
  }
  .msg-menu button:hover{background:var(--qqhover)}
  /* 连续相同消息合并后的 +N 徽标 */
  .plus-badge{
    display:inline-block;margin:5px 0 0 4px;padding:0 7px;height:18px;line-height:18px;
    border-radius:9px;border:1px solid rgba(90,150,220,.5);
    background:rgba(90,150,220,.14);color:var(--blue);
    font-size:11px;font-weight:600;cursor:pointer;vertical-align:middle;
  }
  /* 挂在消息框外面：圆形，贴在气泡右外侧并垂直居中 */
  .msg .m-body{position:relative}
  .m-body .plus-badge{
    position:absolute;left:calc(100% + 7px);top:50%;transform:translateY(-50%);
    width:24px;height:24px;padding:0;margin:0;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:9.5px;line-height:1;letter-spacing:-.02em;white-space:nowrap;
  }


  /* ---------- 输入区 ---------- */
  .compose{position:relative;display:flex;flex-direction:column;gap:5px;padding:7px;border-top:1px solid var(--line);background:var(--panel2);flex:0 0 auto}
  .compose-row{display:flex;gap:6px;align-items:flex-end}
  .compose textarea{
    flex:1;resize:none;min-height:32px;max-height:132px;padding:6px 8px;font-size:13px;line-height:1.55;
    background:var(--panel);border-radius:6px;
  }

  .w-preview{
    border:1px solid var(--line);border-radius:6px;background:#11161b;padding:5px 7px;
    display:flex;flex-direction:column;gap:3px;max-height:108px;overflow-y:auto;
  }
  .w-preview[hidden]{display:none}
  .pv-head{font-size:10px;color:var(--dim2);letter-spacing:.04em}
  .pv-item{display:flex;gap:6px;align-items:baseline;font-size:12px;line-height:1.5;min-width:0}
  .pv-tag{flex:0 0 auto;font-size:9.5px;border:1px solid var(--line);border-radius:3px;padding:0 3px;color:var(--dim2);line-height:15px}
  .pv-item.ic .pv-tag{color:var(--blue);border-color:rgba(106,168,255,.3)}
  .pv-item.emote .pv-tag{color:var(--cyan);border-color:rgba(127,209,192,.3)}
  .pv-item.ooc .pv-tag{color:#9fb1c6;border-color:rgba(125,145,175,.35)}
  .pv-txt{color:#c6d1de;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .pv-item.emote .pv-txt{color:var(--cyan);font-style:italic}
  .pv-item.ooc .pv-txt{color:#9fb1c6;font-style:italic}

  .dice-inline{
    display:inline-flex;align-items:center;gap:3px;vertical-align:middle;
    margin:0 2px;padding:1px 6px 1px 4px;border-radius:6px;white-space:nowrap;
    font-family:var(--mono);font-size:12px;color:var(--text);
    background:rgba(127,127,127,.06);border:1px solid var(--line);
  }
  /* 行内骰子沿用掷骰消息卡片的骰面 / 等号 / 总点数样式，只是缩小一号 */
  .dice-inline .die-face{min-width:20px;height:20px;padding:0 4px;font-size:12px;border-radius:5px}
  .dice-inline .dice-eq,.dice-inline .dice-plus{font-size:11px;color:var(--dim2)}
  .dice-inline .dice-sum{font-size:14px}
  .dice-inline .dic-expr{color:var(--dim);font-size:11.5px}
  .compose .w-send{padding:6px 10px;height:32px;background:#1d2b3c;border-color:#33506e;color:#cfe3ff;flex:0 0 auto}
  .compose .w-send:hover{background:#22334a}
  .compose .w-hist{padding:0 9px;height:32px;flex:0 0 auto;color:var(--dim);background:transparent}
  .compose .w-hist:hover{color:var(--text)}
  .compose .w-dice{padding:0 9px;height:32px;flex:0 0 auto;color:var(--dim);background:transparent}
  .compose .w-dice:hover{color:var(--amber);border-color:rgba(216,166,87,.4)}
  .compose .w-dice.on{color:var(--amber);border-color:rgba(216,166,87,.45);background:rgba(216,166,87,.08)}
  /* 回车行为开关：默认「回车发送」 */
  .compose .w-enter{padding:0 8px;height:32px;flex:0 0 auto;color:var(--dim);background:transparent;font-size:11.5px;white-space:nowrap}
  .compose .w-enter:hover{color:var(--text)}
  .compose .w-enter.on{color:#cfe3ff;border-color:rgba(90,150,220,.5);background:rgba(90,150,220,.12)}

  .roll-bar{border-top:1px solid var(--line);background:var(--panel2);padding:6px 7px 7px;display:flex;flex-direction:column;gap:5px}
  .roll-bar[hidden]{display:none}
  .rb-row{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
  .rb-row[hidden]{display:none}
  .rb-row input{height:25px;font-size:12px;padding:2px 6px;min-width:0}
  .rb-row select{height:25px;font-size:12px;padding:2px 4px;flex:1 1 110px;min-width:90px}
  /* 掷骰条：面数 / 个数 / DC 全是选，不用打字 */
  .rb-dice{gap:4px}
  .rb-face button{padding:3px 9px;font-size:11.5px;min-width:32px}
  .rb-row select.rb-count{flex:0 0 58px;width:58px;min-width:0;padding:2px 2px;text-align:center}
  .rb-row select.rb-dc2{flex:0 0 78px;width:78px;min-width:0;padding:2px 2px}
  .rb-go2{margin-left:auto;background:#25303d;border-color:#3a4a5d;color:#cfe3ff;font-size:12px;padding:2px 12px;height:25px;flex:0 0 auto}
  .rb-go2:hover{background:#2c3a4a}
  .rb-go2:disabled{opacity:.35}
  /* 主持人「一起投」：勾选多个角色卡 */
  .rm-h{font-size:10.5px;color:var(--dim2);flex:0 0 auto;padding-top:4px;letter-spacing:.05em}
  .badge.dark{color:#c9a3e8;border-color:rgba(201,163,232,.45)}
  .dice-card.dark{border-style:dashed;color:var(--dim)}
  .dark-hint{font-size:11px;color:var(--dim2)}
  .rb-go{margin-left:auto;background:#25303d;border-color:#3a4a5d;color:#cfe3ff;font-size:12px;padding:2px 11px;height:25px}
  .rb-go:hover{background:#2c3a4a}
  .rb-go:disabled{opacity:.35}
  .rb-target{font-size:11px;color:var(--dim2);margin-left:auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60%}
  .rb-title{font-size:12px;color:var(--text);letter-spacing:.06em}
  .rb-target.warn{color:var(--amber)}

  /* ---------- 表情面板（数据来自论坛） ---------- */
  .emoji-pop{
    position:absolute;left:7px;right:7px;bottom:calc(100% + 4px);background:var(--panel3);
    border:1px solid var(--line2);border-radius:7px;padding:6px;max-height:250px;overflow:auto;
    box-shadow:0 10px 30px rgba(0,0,0,.5);z-index:31;
  }
  .emoji-pop[hidden]{display:none}
  .emoji-tabs{display:flex;gap:4px;flex-wrap:wrap;padding:0 0 6px;position:sticky;top:0;background:var(--panel3);z-index:1}
  .emoji-tabs button{padding:2px 8px;font-size:11px;border-radius:5px;background:transparent;color:var(--dim);border:1px solid transparent}
  .emoji-tabs button.on{color:var(--text);border-color:var(--line2);background:rgba(127,127,127,.12)}
  .emoji-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:4px}
  .emoji-cell{display:flex;align-items:center;justify-content:center;padding:3px;border:1px solid transparent;border-radius:6px;background:transparent;cursor:pointer}
  .emoji-cell:hover{background:rgba(127,127,127,.12);border-color:var(--line)}
  .emoji-cell img{width:32px;height:32px;object-fit:contain;display:block}
  .compose .w-emoji{padding:0 8px;height:32px;flex:0 0 auto;color:var(--dim);background:transparent;font-size:15px;line-height:1}
  .compose .w-emoji:hover{color:var(--text)}
  /* 消息正文里的表情 */
  .m-body .emoji{width:28px;height:28px;object-fit:contain;vertical-align:-7px;margin:0 1px}
  .aud-pop{
    position:absolute;left:7px;right:7px;bottom:calc(100% + 4px);background:var(--panel3);
    border:1px solid var(--line2);border-radius:7px;padding:6px;max-height:210px;overflow:auto;
    box-shadow:0 10px 30px rgba(0,0,0,.5);z-index:30;
  }
  .aud-pop .pop-h{font-size:10.5px;color:var(--dim2);padding:1px 4px 5px;letter-spacing:.06em}
  .aud-pop label{display:flex;align-items:center;gap:7px;padding:4px 5px;border-radius:4px;font-size:12.5px;cursor:pointer}
  .aud-pop label:hover{background:rgba(255,255,255,.04)}
  .aud-pop input{accent-color:var(--blue);width:13px;height:13px}

  /* ---------- 抽屉 ---------- */
  .drawer{
    position:fixed;top:0;right:0;bottom:0;width:352px;max-width:92vw;background:var(--panel);
    border-left:1px solid var(--line);transform:translateX(101%);transition:transform .17s ease;
    z-index:40;display:flex;flex-direction:column;box-shadow:-6px 0 18px rgba(0,0,0,.14);
  }
  .drawer.open{transform:none}
  .drawer .d-head{
    display:flex;align-items:center;gap:8px;padding:11px 12px;border-bottom:1px solid var(--line);
  }
  .drawer .d-head h2{margin:0;font-size:13px;font-weight:600;letter-spacing:.03em}
  .drawer .d-head button{margin-left:auto;padding:2px 5px;background:transparent;border-color:transparent;color:var(--dim)}
  .drawer .d-head .d-back{
    margin:0;padding:2px 8px;font-size:12px;color:var(--dim);line-height:18px;
    border:1px solid var(--line);border-radius:5px;background:transparent;
  }
  .drawer .d-head .d-back:hover{color:var(--text);border-color:var(--line2)}
  .drawer .d-body{flex:1;overflow-y:auto;padding:10px 12px 16px}

  .cbt-row{border:1px solid var(--line);border-radius:7px;padding:7px 8px;margin-bottom:6px;background:var(--panel2)}
  .cbt-row.cur{border-color:rgba(216,166,87,.45);background:rgba(216,166,87,.06)}
  .cbt-top{display:flex;align-items:baseline;gap:6px}
  .cbt-name{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cbt-init{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--dim)}
  .cbt-hp{display:flex;align-items:center;gap:4px;margin-top:6px;font-size:11px;color:var(--dim)}
  .cbt-hp .num{font-family:var(--mono);flex:1;font-size:11.5px}
  .cbt-hp button{padding:0 5px;font-size:11px;line-height:19px;min-width:26px;text-align:center}
  .mono{font-family:var(--mono)}
  .hint{font-size:11.5px;color:var(--dim2);line-height:1.7}
  .field{display:flex;flex-direction:column;gap:3px;margin-bottom:7px}
  .field label{font-size:10.5px;color:var(--dim2);letter-spacing:.04em}
  .field input,.field select,.field textarea{font-size:13px}
  .row2{display:flex;gap:7px}
  .row2 > *{flex:1;min-width:0}
  .btn-row{display:flex;gap:6px;margin:9px 0}
  .btn-row button{flex:1}

  /* ---------- 模态 ---------- */
  .modal{position:fixed;inset:0;background:rgba(4,6,8,.6);backdrop-filter:blur(2px);z-index:60;display:flex;align-items:center;justify-content:center;padding:18px}
  .modal[hidden]{display:none}
  .modal .box{
    width:min(720px,94vw);max-height:90vh;display:flex;flex-direction:column;background:var(--panel);
    border:1px solid var(--line2);border-radius:10px;box-shadow:0 24px 70px rgba(0,0,0,.6);overflow:hidden;
  }
  .box-head{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
  .box-head h2{margin:0;font-size:14px;font-weight:600}
  .box-head .sub{font-size:11px;color:var(--dim2);font-family:var(--mono)}
  .box-head button{margin-left:auto;padding:2px 6px;background:transparent;border-color:transparent;color:var(--dim)}
  .box-body{padding:12px 14px;overflow-y:auto;flex:1;min-height:0}
  .box-foot{padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:7px;align-items:center}
  .box-foot .sp{flex:1}

  .sec-title{font-size:10.5px;letter-spacing:.1em;color:var(--dim2);text-transform:uppercase;margin:14px 0 7px}
  .sec-title:first-child{margin-top:0}
  .cedit{display:flex;gap:12px;align-items:flex-start;margin-bottom:4px}
  .cedit-av{flex:0 0 auto}
  .cedit-fields{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
  .revive-btn{padding:3px 10px;font-size:11.5px;border-radius:5px;cursor:pointer;
    border:1px solid rgba(216,166,87,.6);background:rgba(216,166,87,.15);color:var(--amber)}
  .revive-btn:hover{background:rgba(216,166,87,.3)}
  .revive-btn:disabled{opacity:.5;cursor:default}
  .buff-list{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
  .buff-opt{display:flex;flex-direction:column;gap:2px;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--panel2);cursor:pointer;transition:.15s}
  .buff-opt:hover{border-color:rgba(143,214,164,.5)}
  .buff-opt.on{border-color:var(--green);background:rgba(143,214,164,.1)}
  .buff-opt input{position:absolute;opacity:0;width:0;height:0}
  .buff-opt .bo-name{font-size:13px;font-weight:600;color:var(--text)}
  .buff-opt.on .bo-name{color:var(--green)}
  .buff-opt .bo-desc{font-size:11px;color:var(--dim2);line-height:1.5}
  .abil-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
  .abil{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 5px;text-align:center}
  .abil .an{font-size:10px;color:var(--dim2);letter-spacing:.05em}
  .abil input{width:100%;text-align:center;font-family:var(--mono);font-size:15px;padding:2px 0;margin:3px 0 2px;background:transparent;border:0;border-bottom:1px solid var(--line)}
  .abil .am{font-family:var(--mono);font-size:11px;color:var(--blue)}
  .pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:2px 10px}
  .pick-grid label{display:flex;align-items:center;gap:6px;font-size:12px;padding:3px 4px;border-radius:4px;cursor:pointer;color:#c2ccd8}
  .pick-grid label:hover{background:rgba(255,255,255,.04)}
  .pick-grid input{width:13px;height:13px;accent-color:var(--blue);flex:0 0 auto}
  .sgroup{margin-bottom:8px}
  .sgroup .st{font-size:10.5px;color:var(--dim2);margin:0 0 3px 4px}

  .doc{font-size:13px;line-height:1.85;color:#c6d0de}
  .doc p{margin:0 0 9px}
  .doc h4{margin:14px 0 6px;font-size:12px;color:var(--text);letter-spacing:.04em}
  .doc ul{margin:0 0 9px;padding-left:18px}
  .doc li{margin-bottom:4px}
  .doc code{font-family:var(--mono);font-size:11.5px;background:rgba(255,255,255,.05);padding:0 3px;border-radius:3px}
  .doc h5{margin:10px 0 5px;font-size:12.5px;color:var(--text);font-weight:600}
  .doc-tbl{border-collapse:collapse;width:100%;margin:0 0 11px;font-size:12.5px}
  .doc-tbl td{border:1px solid rgba(255,255,255,.13);padding:5px 9px;vertical-align:top}
  .doc-tbl tr:first-child td{background:rgba(255,255,255,.06);font-weight:600;color:var(--text)}

  .toast{
    position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);z-index:90;
    background:#20262d;border:1px solid var(--line2);color:var(--text);font-size:12.5px;
    padding:7px 13px;border-radius:6px;box-shadow:0 12px 30px rgba(0,0,0,.5);
    opacity:0;transition:opacity .16s,transform .16s;pointer-events:none;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}

/* ============================================================
   QQ 浅色主题覆盖层（仿腾讯 QQ / QQ NT）
   仅重定义调色板 + 覆盖关键表面；布局/尺寸/交互沿用原有 CSS
   ============================================================ */
:root{
  --bg:#f3f4f6;              /* 页面底 */
  --panel:#ffffff;          /* 主面板 */
  --panel2:#f7f8fa;         /* 次级面 */
  --panel3:#eef1f5;         /* 三级/悬浮底 */
  --line:#e6e8eb;           /* 描边 */
  --line2:#d7dbe1;          /* 强描边 */
  --text:#1f2329;           /* 正文 */
  --dim:#8a9099;            /* 次要 */
  --dim2:#aab0b8;           /* 更次 */
  --blue:#12b7f5;           /* QQ 蓝 */
  --blue-d:#0a9fd8;
  --cyan:#2fb59a;           /* 动作（保留你满意的青绿） */
  --amber:#c8862a;          /* 主持人 */
  --red:#e05a63;
  --green:#2fb673;
  --die-bg:#ffffff; --die-line:#cfd8e2; --die-text:#26303b;
  --qqsurface:#fff;
  --qqhover:rgba(0,0,0,.045);
  --qqactive:#e7f4fd;
}

/* ---- 基础控件 ---- */
body{background:var(--bg);color:var(--text)}
button{background:var(--panel3);border-color:var(--line);color:var(--text)}
button:hover{border-color:var(--line2);background:#e4e8ee}
button.ghost{color:var(--dim)}
button.ghost:hover{color:var(--text);background:var(--qqhover)}
button.primary{background:var(--blue);border-color:var(--blue);color:#fff}
button.primary:hover{background:var(--blue-d);border-color:var(--blue-d)}
input,select,textarea{background:#fff;border-color:#dfe3e8;color:var(--text)}
input:focus,select:focus,textarea:focus{border-color:var(--blue);background:#fff}
::-webkit-scrollbar-thumb{background:#dfe3e8;border:2px solid transparent}
::-webkit-scrollbar-thumb:hover{background:#cbd2da}

/* ---- 侧栏 ---- */
aside.side{background:var(--panel);border-right-color:var(--line)}
.brand{border-bottom-color:var(--line)}
.brand svg path{stroke:var(--blue)}
.brand .mode{border-color:var(--line);color:var(--dim)}
.side-foot{border-top-color:var(--line)}
.grp-head h3{color:var(--dim)}
.grp-head button:hover{background:var(--qqhover)}

/* 频道会话列表（仿 QQ 会话项） */
.ch-row{color:#2b2f36}
.ch-row:hover{background:var(--qqhover)}
.ch-row.on{background:var(--qqactive);border-color:#bfe6fb}
.ch-row.on .dot{background:var(--blue)}
.ch-row .dot{background:#c4cad2}
.ch-row .unread{background:var(--red)}
.ch-row .ops button:hover{background:rgba(0,0,0,.06)}

/* 角色卡行 */
.char-row:hover{background:var(--qqhover)}
.char-name{color:#22262c}
.cav{background:#e9eef4;border-color:#dbe2ea}
.cav b{color:#8a95a1}
.hpbar{background:#eceff3}
.hpbar i{background:var(--green)}
.hpbar i.low{background:#e0a23a}
.hpbar i.crit{background:var(--red)}
.pending{color:#b07d22;border-color:rgba(200,134,42,.4)}
.cond-row span{color:#b07d22;border-color:rgba(200,134,42,.35)}
.char-player{color:#6b7580}

/* 账号选择 */
.pk-row:hover{background:var(--qqhover);border-color:var(--line)}
.pk-row.on{background:#eaf2fb;border-color:#9cc0e6}
.pk-avs .cav{border-color:#fff}

/* ---- 公告 ---- */
.announce{background:#fff8e9;border-bottom-color:#ffe6bd}
.an-text{color:#7a5a1e}
.an-meta{color:#a9852f}
.an-icon{color:var(--amber)}
.an-edit{color:#b07d22;border-color:rgba(200,134,42,.5)}
.an-edit:hover{background:rgba(200,134,42,.12)}

/* ---- 顶栏 ---- */
main{background:var(--bg)}
.topbar{background:var(--panel);border-bottom-color:var(--line)}
.topbar .tch{color:#22262c}
.cbt-strip{border-left-color:var(--line)}
.cbt-strip b{color:var(--amber)}

/* ---- 窗口（仿 QQ 群会话窗） ---- */
.win{background:var(--panel);border-color:var(--line);box-shadow:0 1px 3px rgba(0,0,0,.05)}
.win-head{background:#f6f8fa;border-bottom-color:var(--line)}
.w-ch{color:#2b2f36}
.w-grip{color:#c1c8d0}
.w-grip:hover{color:var(--dim)}
.win.focused{border-color:var(--blue)}
.win.focused .win-head{background:#eef6fd}
.win.pane-drop-before{box-shadow:-3px 0 0 0 var(--blue)}
.seg{border-color:var(--line)}
.seg button{color:var(--dim)}
.seg button:hover{background:var(--qqhover);color:var(--text)}
.seg button + button{border-left-color:var(--line)}
.seg button.on{background:var(--blue);color:#fff}
.seg button.on[data-kind="emote"]{background:var(--cyan);color:#fff}
.w-close:hover{color:var(--red)}

/* ---- 消息区：QQ 气泡 ---- */
.msgs{background:var(--bg)}
.msg{border-color:transparent;background:transparent;padding:5px 9px}
.msg .who{color:#3a4250}
.msg .mt{color:var(--dim2)}
.msg .m-body{color:#1f2329}
.msg.cont{padding-left:44px}
.msg.cont::before{color:#bcc3cc}
.cav-msg{border-radius:6px;border:1px solid #e2e7ee}
.msg-ops{background:#fff;border-color:var(--line);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.msg-ops button{color:var(--dim)}
.msg-ops button:hover{color:var(--text);background:var(--qqhover)}

/* 角色发言 = 白色气泡 */
.msg:not(.k-system):not(.k-ooc) .m-body{
  display:inline-block;background:#fff;border:1px solid #eceff3;border-radius:9px;
  padding:7px 11px;box-shadow:0 1px 2px rgba(0,0,0,.05);max-width:100%;
}
/* 动作 = 青绿气泡（保留绿色观感） */
.msg.k-emote .m-body{background:#e9f8f4;border-color:#c7ece3;color:var(--cyan)}
.msg.k-emote .m-body::before{content:"» ";color:var(--cyan)}
/* 骰子 = 中性气泡 */
.msg.k-roll .m-body{background:#f2f4f7;border-color:#e4e8ed;color:#5a636e}
/* 亮色主题下的掷骰卡片 */
.msg.k-roll{background:linear-gradient(135deg,rgba(18,183,245,.07),rgba(18,183,245,.015));border-color:rgba(18,183,245,.26)}
.msg.k-roll .dice-card{background:rgba(0,0,0,.028);border-color:rgba(18,183,245,.18)}
.msg.k-roll.gm{background:linear-gradient(135deg,rgba(200,134,42,.09),rgba(200,134,42,.02));border-color:rgba(200,134,42,.32)}
.msg.k-roll.crit{border-color:rgba(200,134,42,.6)}
.msg.k-roll.fumble{border-color:rgba(224,90,99,.55)}
/* 战斗 = 淡金气泡 */
.msg.k-combat .m-body{background:#fbf3e3;border-color:#f0e0c0;color:#8a6a25}

/* 主持人消息凸显 */
.msg.gm{border-left:3px solid var(--amber);background:rgba(200,134,42,.05)}
.msg.gm .who{color:#a5701c;font-weight:700}
.msg.gm .m-body{background:#fffdf7;border-color:#f0e4c8}

/* 私密（私聊/定向）虚线 */
.msg.whisper{border:1px dashed #e0b96a;background:rgba(200,134,42,.04)}
.msg.whisper .m-body{border-color:#ecd9ae}

/* 系统 / 皮下：QQ 风格居中细字 */
.msg.k-system .sys{color:#9aa1ab}
.msg.k-ooc{background:transparent}
.sys-ooc{color:#8a919c}
.sys-ooc b{color:#6b7580}
.sys-ooc b.gm{color:#b07d22}
.ooc-vis{color:#b07d22}

/* 回复引用 */
.quote{color:#8a919c;border-left-color:var(--line2)}
.quote:hover{color:var(--blue)}
.quote b{color:#5a636e}
.reply-bar{background:#eef6fd;border-color:#cfe8fb;color:var(--dim)}
.reply-bar b{color:#5a636e}
.msg.flash{animation:flash 900ms ease}
@keyframes flash{0%{background:rgba(18,183,245,.16)}100%{background:transparent}}
.msg.editing{border-color:var(--blue)}
.thread-empty{color:var(--dim2)}
.thread-empty kbd{border-color:var(--line);color:var(--dim);background:#f2f4f7}

/* 折叠 */
.fold-hint{color:#a5701c}
.fold-hint button{color:#a5701c;border-color:rgba(200,134,42,.4)}

/* 行内骰芯片 */
.dice-inline{background:rgba(127,127,127,.05);border-color:var(--line);color:var(--text)}
.chip{border-color:var(--line);color:var(--dim);background:#f4f6f8}
.chip.ok{color:#1f9c5a;border-color:#bfe6d1;background:#eefaf3}
.chip.bad{color:#cf4a53;border-color:#f0c8cb;background:#fdefef}
.chip.nat{color:#a5701c;border-color:#ecd9ae;background:#fbf3e3}
.chip.dc{color:#5a636e;border-color:var(--line)}

/* 拖拽占位/幽灵 */
.msg-ph{border-color:rgba(18,183,245,.5);background:rgba(18,183,245,.06)}
.msg.ghost{background:#fff;border-color:var(--blue);box-shadow:0 12px 30px rgba(0,0,0,.18)}

/* ---- 输入区 ---- */
.compose{background:#f7f8fa;border-top-color:var(--line)}
.compose textarea{background:#fff;border-color:#dfe3e8;color:var(--text)}
.compose .w-send{background:var(--blue);border-color:var(--blue);color:#fff}
.compose .w-send:hover{background:var(--blue-d)}
.compose .w-hist,.compose .w-dice{color:var(--dim)}
.compose .w-dice:hover,.compose .w-dice.on{color:var(--amber);border-color:rgba(200,134,42,.5);background:rgba(200,134,42,.1)}
.compose-bar .w-id{background:#fff;border-color:#dfe3e8;color:var(--text)}
.compose-bar .cav{border-color:#dfe3e8;background:#eef1f5}
.w-preview{background:#eef2f6;border-color:var(--line)}
.pv-tag{border-color:var(--line);color:var(--dim)}
.pv-item.ic .pv-tag{color:var(--blue);border-color:rgba(18,183,245,.4)}
.pv-item.emote .pv-tag{color:var(--cyan);border-color:rgba(47,181,154,.4)}
.pv-txt{color:#3a4250}
.pv-item.emote .pv-txt{color:var(--cyan)}
.roll-bar{background:#f7f8fa;border-top-color:var(--line)}
.rb-go{background:var(--blue);border-color:var(--blue);color:#fff}
.rb-go:hover{background:var(--blue-d)}
.rb-go2{background:var(--blue);border-color:var(--blue);color:#fff}
.rb-go2:hover{background:var(--blue-d)}
.w-gobottom{background:#fff;border-color:var(--line2);color:var(--dim);box-shadow:0 4px 12px rgba(0,0,0,.12)}
.typing{color:var(--dim)}
.hist-pop,.aud-pop{background:#fff;border-color:var(--line2);box-shadow:0 10px 28px rgba(0,0,0,.15)}
.hist-item{color:#3a4250}
.hist-item:hover{background:var(--qqhover)}
.aud-pop label:hover{background:var(--qqhover)}
.aud-pop input{accent-color:var(--blue)}
.msg-menu{background:#fff;border-color:var(--line2);box-shadow:0 12px 30px rgba(0,0,0,.16)}
.msg-menu .mi{color:var(--text)}
.msg-menu .mi:hover{background:var(--qqhover)}
.msg-menu .mi.danger{color:var(--red)}

/* ---- 抽屉 / 模态 ---- */
.drawer{background:var(--panel);border-left-color:var(--line)}
.drawer .d-head{border-bottom-color:var(--line)}
.modal{background:rgba(0,0,0,.35)}
.modal .box{background:var(--panel);border-color:var(--line2);box-shadow:0 24px 60px rgba(0,0,0,.22)}
.box-head{border-bottom-color:var(--line)}
.box-foot{border-top-color:var(--line)}
.field input,.field select,.field textarea{background:#fff;border-color:#dfe3e8;color:var(--text)}
.btn-row button{flex:1}
.cbt-row{background:#f7f8fa;border-color:var(--line)}
.cbt-row.cur{border-color:rgba(200,134,42,.5);background:#fbf5e8}
.cbt-name{color:#22262c}
.cbt-hp button{background:#fff;border-color:#dfe3e8}
.abil{background:#f7f8fa;border-color:var(--line)}
.abil input{border-bottom-color:#cfd6df;color:var(--text)}
.abil .am{color:var(--blue)}
.pick-grid label{color:#2b3138}
.pick-grid label:hover{background:var(--qqhover)}
.pick-grid input{accent-color:var(--blue)}
.mem-dm{color:#a5701c;border-bottom-color:var(--line)}
.mem-char:hover{background:var(--qqhover)}
.gm-notes{border-top-color:var(--line)}
.gm-notes textarea{background:#fff;border-color:#dfe3e8;color:var(--text)}
.mc-name{color:#2b3138}
.doc{color:#3a4250}
.doc code{background:#eef1f5;color:#4a5560}
.doc h5{color:#2a3340}
.doc-tbl td{border-color:#d9dee6}
.doc-tbl tr:first-child td{background:#f2f4f8;color:#2a3340}
.hint{color:var(--dim2)}
.toast{background:#2b2f36;border-color:#3a3f47;color:#fff}
.badge{border-color:var(--line);color:var(--dim)}
.badge.gm{background:var(--amber);color:#fff;border-color:var(--amber)}
.badge.dm{color:var(--amber);border-color:rgba(200,134,42,.4)}
.badge.w{color:var(--amber);border-color:rgba(200,134,42,.4)}
.own-tag{border-color:var(--line);color:var(--dim)}
.cgroup{color:var(--dim2)}
.empty{color:var(--dim2)}

/* JS 内联写死的深色文字（无 class 钩子），用属性选择器兜底修正 */
[style*="#aeb9c7"]{color:#5a636e !important}
[style*="#39424e"]{color:#c2c8d0 !important}


/* ---------- QQ 细节微调 ---------- */
/* 输入区呼吸感 */
.compose{gap:8px;padding:9px}
.compose-bar{gap:10px}
.cb-tools{margin-top:2px}
.compose textarea{min-height:34px}
/* 私聊/定向：虚线更柔和，改成细实线+浅底，避免突兀 */
.msg.whisper{border:0;background:#fbf7ee}
.msg.whisper .m-body{background:#fffdf8;border:1px solid #efe4c9}
.msg.whisper .badge.w{color:#a5701c;border-color:rgba(200,134,42,.4)}
/* 顶部分页标签与消息区分隔更清晰 */
.win-head{padding:7px 8px}
/* 未读红点：QQ 式小圆点贴右，数字不撑破对齐 */
.ch-row .cnt{margin-right:2px}
.ch-row .unread{margin-right:4px}
/* 角色属性颜色在白底稍微加深，避免单薄 */
.char-meta,.char-meta .cdot{color:#7a838f}
/* 顶栏按钮更像 QQ：淡蓝文字 */
.topbar .sp button.ghost{color:#5f7688}
.topbar .sp button.ghost:hover{color:var(--blue);background:var(--qqactive)}
/* 选中会话左侧加一条 QQ 式蓝色指示条 */
.ch-row{position:relative}
.ch-row.on::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:0 3px 3px 0;background:var(--blue)}
/* 消息悬浮操作按钮圆角更柔 */
.msg-ops{border-radius:6px}
/* toast 用 QQ 蓝灰 */
.toast{background:#33373d;border-color:#3d4148}


/* ================= 手机版适配（≤860px）================= */
.ham{display:none;align-items:center;justify-content:center;width:32px;height:32px;border-radius:7px;color:#33383f;flex:0 0 auto}
.navscrim{display:none}
.navtoggle{position:fixed;top:-9999px;left:-9999px}
@media(max-width:860px){
  html,body{height:100%}
  #app{height:100dvh;flex-direction:column}
  .ham{display:inline-flex}
  aside.side{position:fixed;top:0;left:0;bottom:0;width:min(84vw,320px);flex:none;transform:translateX(-100%);transition:transform .22s ease;z-index:60;box-shadow:2px 0 18px rgba(0,0,0,.25);border-right:1px solid var(--line)}
  #navtoggle:checked ~ #app aside.side{transform:none}
  #navtoggle:checked ~ #app .navscrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:55}
  main{width:100%}
  .topbar{flex-wrap:wrap;gap:8px;padding:8px}
  /* 手机上分页操作很不方便，隐藏「新分页」入口 */
  #btn-addwin{display:none}
  .topbar .sp{gap:6px}
  #windows{padding:0;gap:0;overflow:hidden;flex:1;min-height:0}
  #windows .win{display:none;flex:none}
  #windows .win.focused{display:flex;width:100%;height:100%;border-radius:0;border:0;border-top:1px solid var(--line)}
  .msgs{padding:8px 8px 12px}
  .msg{padding:5px 7px}
  /* 长按消息不弹系统菜单/不选字，改用自定义菜单 */
  .msg{-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
  .msg:not(.k-system):not(.k-ooc) .m-body{max-width:82%}
  .compose{padding:5px 6px 7px;gap:4px}
  /* 手机上把输入区压扁：隐藏头像、类型/可见性并成一行可横向滑动 */
  .compose-bar{gap:6px}
  /* 保留当前角色卡头像；放大到 34px，仍在 cb-right 的高度内 */
  .compose-bar .w-av{display:flex}
  .compose-bar .cav{width:34px;height:34px;border-radius:8px}
  .compose-bar .cav b{font-size:14px}
  .compose-bar .w-id{height:26px;font-size:12.5px}
  .cb-right{gap:3px}
  .cb-tools{flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;gap:4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .cb-tools::-webkit-scrollbar{display:none}
  .cb-tools .seg{flex:0 0 auto}
  .cb-tools .seg button{padding:4px 7px;font-size:12px;line-height:1.3}
  .compose-row{gap:5px}
  .compose-row .w-hist{display:none}
  .compose textarea{min-height:32px;font-size:15px;padding:5px 7px}
  .compose .w-send{padding:6px 11px;height:32px}
  .compose .w-enter{padding:0 6px;height:32px;font-size:11px}
  .compose .w-dice{padding:0 7px;height:32px}
  input,select,textarea,button{font-size:14px}
  button{padding:6px 10px}
  .side-foot button{padding:8px 6px}
  .modal{padding:0}
  .modal .box{width:100%;max-width:100%;height:100dvh;max-height:none;border-radius:0;border:0}
  .box-head,.box-body,.box-foot{padding-left:14px;padding-right:14px}
  /* 手机端：抽屉改成底部半屏，上面还能看到聊天 */
  .drawer{
    top:auto;bottom:0;left:0;right:0;width:100%;max-width:100%;height:64vh;
    border-left:0;border-top:1px solid var(--line);border-radius:14px 14px 0 0;
    transform:translateY(101%);box-shadow:0 -8px 24px rgba(0,0,0,.18);
  }
  .drawer.open{transform:none}
  .drawer{z-index:65}
  .drawer .d-head{padding-top:14px;position:relative}
  .drawer .d-head .d-back{
    padding:5px 12px;font-size:13px;color:var(--text);
    background:rgba(127,127,127,.1);border-color:var(--line2);border-radius:7px;
  }
  .drawer .d-head::before{
    content:"";position:absolute;top:6px;left:50%;transform:translateX(-50%);
    width:38px;height:4px;border-radius:2px;background:var(--line2);
  }
  .buff-list{grid-template-columns:1fr}
  .abil-grid{grid-template-columns:repeat(3,1fr)}
  /* 底部抽屉打开时，消息区留出同样的高度，最新消息不会被挡 */
  body.drawer-open .msgs{padding-bottom:65vh}
  /* 战斗中顶栏保留轮次信息，只是压缩 */
  .cbt-strip{display:flex;gap:4px;font-size:10.5px;padding-left:8px;max-width:52vw;overflow:hidden}
  .cbt-strip b{font-size:10.5px}
  .cbt-strip .cs-hp{display:none}
  .cbt-strip .cs-next{padding:0 6px;font-size:10px;line-height:15px;margin-left:2px}
  .me-tag{display:none}
}


/* hide-mode-badge */
.brand .mode{display:none!important}
</style>
</head>
<body>
<input type="checkbox" id="navtoggle" class="navtoggle"><div id="app"><label for="navtoggle" class="navscrim"></label>
  <aside class="side" id="side">
    <div class="brand">
      <svg viewBox="0 0 20 20" width="17" height="17" aria-hidden="true">
        <path d="M10 2l6.5 3.2v5.1c0 3.6-2.7 6.6-6.5 7.7-3.8-1.1-6.5-4.1-6.5-7.7V5.2L10 2z"
              fill="none" stroke="#6aa8ff" stroke-width="1.3" stroke-linejoin="round"/>
        <path d="M10 6.4v5.2M7.4 9h5.2" stroke="#6aa8ff" stroke-width="1.3" stroke-linecap="round"/>

            <button id="char-sync" title="从怪啖论坛同步角色卡"></button>

  <main>
    <div class="topbar"><label for="navtoggle" class="ham" aria-label="菜单"><svg viewBox="0 0 20 20" width="18" height="18"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></label>
      <div class="tch" id="top-channel">主频道</div>

</div>

<aside class="drawer" id="drawer">
  <div class="d-head">
    <button id="drawer-back" class="d-back" title="退出战斗页面">← 返回</button>

    <button id="drawer-close" title="关闭"></button>

  <div class="d-body" id="combat-body"></div>
</aside>

<div class="modal" id="modal" hidden>
  <div class="box">
    <div class="box-head">
      <h2 id="modal-title">角色卡</h2>
      <span class="sub" id="modal-sub"></span>
      <button id="modal-x" title="关闭"></button>

    <h2>成员</h2>
    <button id="members-close" title="关闭"></button>
  </div>
  <div class="d-body" id="members-body"></div>
</aside>

<div class="modal" id="picker" hidden>
  <div class="box" style="width:min(470px,94vw)">
    <div class="box-head">
      <h2>选择账号</h2>
      <span class="sub" id="picker-sub">玩家名即账号</span>
