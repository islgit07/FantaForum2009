</div>

<script>
'use strict';

/* =========================================================================
 * 0. 图标（内联 SVG，不使用 emoji）
 * ========================================================================= */
const ICON = {
  plus: '<svg viewBox="0 0 16 16" width="12" height="12"><path d="M8 3.2v9.6M3.2 8h9.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>',
  x: '<svg viewBox="0 0 16 16" width="12" height="12"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>',
  pen: '<svg viewBox="0 0 16 16" width="11" height="11"><path d="M11.4 2.6l2 2L5.9 12.1l-2.6.7.7-2.6 7.4-7.6z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>',
  trash: '<svg viewBox="0 0 16 16" width="11" height="11"><path d="M3.5 4.5h9M6 4.5V3h4v1.5M5 4.5l.5 8h5l.5-8" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  refresh: '<svg viewBox="0 0 16 16" width="11" height="11"><path d="M13 8a5 5 0 1 1-1.4-3.5M13 2.4V5.2h-2.6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  down: '<svg viewBox="0 0 16 16" width="12" height="12"><path d="M8 3.5v9M4 8.8l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  clock: '<svg viewBox="0 0 16 16" width="13" height="13"><circle cx="8" cy="8" r="5.6" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M8 4.8V8l2.2 1.4" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>',
  pin: '<svg viewBox="0 0 16 16" width="13" height="13"><path d="M3 6.2v3.6l7 3V3.2l-7 3zM3 6.2H2.2a1 1 0 0 0-1 1v1.6a1 1 0 0 0 1 1H3M12 6.6c.9 0 .9 2.8 0 2.8" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/></svg>',
  grip: '<svg viewBox="0 0 10 14" width="10" height="14"><g fill="currentColor"><circle cx="2.5" cy="3" r="1"/><circle cx="7.5" cy="3" r="1"/><circle cx="2.5" cy="7" r="1"/><circle cx="7.5" cy="7" r="1"/><circle cx="2.5" cy="11" r="1"/><circle cx="7.5" cy="11" r="1"/></g></svg>',
  dice: '<svg viewBox="0 0 16 16" width="14" height="14"><rect x="2.4" y="2.4" width="11.2" height="11.2" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.2"/><circle cx="5.9" cy="5.9" r="1" fill="currentColor"/><circle cx="10.1" cy="10.1" r="1" fill="currentColor"/><circle cx="10.1" cy="5.9" r=".85" fill="currentColor"/><circle cx="5.9" cy="10.1" r=".85" fill="currentColor"/></svg>',
};

/* =========================================================================
 * 1. 工具
 * ========================================================================= */
const $ = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  })[c]);
}

function displayId(id) {
  const s = String(id || '').trim();
  return s || '匿名';
}

function fmtDateTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return '';
  return d.toLocaleString('zh-CN', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false });
}

function fmtTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return '';
  return d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', hour12: false });
}

function uuid() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID().replace(/-/g, '').slice(0, 12);
  const b = new Uint8Array(6);
  (window.crypto || {}).getRandomValues ? crypto.getRandomValues(b) : b.forEach((_, i) => { b[i] = Math.floor(Math.random() * 256); });
  return Array.from(b).map((x) => x.toString(16).padStart(2, '0')).join('');
}

let toastTimer = null;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

async function api(path, body) {
  try {
    const res = await fetch(path, body === undefined ? {} : {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await res.json();
    return data || {};
  } catch (e) {
    return { error: '无法连接服务端' };
  }
}

/* =========================================================================
 * 2. 状态
 * ========================================================================= */
const state = {
  me: '',
  characters: [],
  messages: [],
  room: { dm: null, combat: { active: false, round: 0, turn: 0, order: [] }, channels: [{ id: 'main', name: '主频道' }] },
  ref: { abilities: [], skills: [], classes: [], conditions: [], buffs: [] },
  windows: [],
  focused: null,
  typing: [],
  lastSeq: 0,
  dragging: false,
  /* 只有主持人能开：开启后才能上下拖动消息调整顺序 */
  reorderMode: false,
  editing: null,
  booted: false,
  charFilter: 'mine',
  charQuery: '',
  /* 论坛登录态带来的玩家名（经 nginx 的 X-Forum-Player） */
  forumPlayer: '',
  /* 论坛表情（和论坛共用一份数据） */
  emoji: { groups: [], emojis: [] },
  emojiGroup: null,
  /* 长按弹菜单后短暂忽略 click，避免误触消息里的按钮 */
  ignoreClickUntil: 0,
};

const SKEY = 'dnd.room.session';
const ACCOUNT_KEY = 'dnd.account';
/* 用户点过「切换」：这次会话要手动选账号，不要被论坛身份覆盖 */
const MANUAL_KEY = 'dnd.manual';

function loadSession() {
  try {
    const raw = sessionStorage.getItem(SKEY);
    if (!raw) return {};
    return JSON.parse(raw) || {};
  } catch { return {}; }
}

function saveSession() {
  try {
    sessionStorage.setItem(SKEY, JSON.stringify({
      focused: state.focused,
      windows: state.windows.map((w) => ({ id: w.id, channel: w.channel, identity: w.identity, kind: w.kind, vis: w.vis, audience: w.audience, search: '' })),
    }));
  } catch { /* ignore */ }
}

function currentAccount() {
  return sessionStorage.getItem(ACCOUNT_KEY) || '';
}

function setAccount(name) {
  sessionStorage.setItem(ACCOUNT_KEY, name);
}

/* 草稿与草稿历史（localStorage，换标签/刷新都还在） */
function draftKey(paneId, ch) {
  return `dnd.draft.${state.me}|${paneId}|${ch}`;
}

function loadDraft(paneId, ch) {
  try { return window.localStorage.getItem(draftKey(paneId, ch)) || ''; } catch { return ''; }
}

function saveDraft(paneId, ch, text) {
  try {
    const k = draftKey(paneId, ch);
    if (text && text.trim()) window.localStorage.setItem(k, text);
    else window.localStorage.removeItem(k);
  } catch { /* ignore */ }
}

function loadDraftHistory() {
  try { return JSON.parse(window.localStorage.getItem('dnd.drafts.' + state.me) || '[]') || []; } catch { return []; }
}

function saveDraftHistory(list) {
  try { window.localStorage.setItem('dnd.drafts.' + state.me, JSON.stringify(list.slice(0, 40))); } catch { /* ignore */ }
}

function pushDraftHistory(text) {
  const t = String(text || '').trim();
  if (!t) return;
  const list = loadDraftHistory();
  if (list[0] && list[0].text === t) return;
  list.unshift({ text: t, at: Date.now() });
  saveDraftHistory(list);
}

/* 频道已读位置（本地，仅用于未读小红点） */
function readMap() {
  try {
    return JSON.parse(window.sessionStorage.getItem('dnd.read.' + (state.me || '')) || '{}') || {};
  } catch { return {}; }
}

function saveReadMap(map) {
  try {
    window.sessionStorage.setItem('dnd.read.' + (state.me || ''), JSON.stringify(map));
  } catch { /* ignore */ }
}

/* 派生 */
const isDm = () => Boolean(state.room.dm && state.room.dm.clientId === state.me);
const myChars = () => state.characters.filter((c) => c.ownerClientId === state.me);
const MAX_PANES = 4;
const maxWindows = () => MAX_PANES;
const focusedWin = () => state.windows.find((w) => w.id === state.focused) || state.windows[0] || null;
const focusedChannel = () => {
  const w = focusedWin();
  return w && w.channel ? w.channel : (state.room.channels[0] ? state.room.channels[0].id : 'main');
};
const dmId = () => (state.room.dm ? state.room.dm.clientId : null);
const channelOf = (m) => (m && m.channel ? m.channel : 'main');

/* =========================================================================
 * 3. 数据同步
 * ========================================================================= */
function applySnapshot(data) {
  if (!data || data.error) return;
  state.characters = Array.isArray(data.characters) ? data.characters : [];
  state.messages = Array.isArray(data.messages) ? data.messages : [];
  state.room = data.state || state.room;
  state.ref = {
    abilities: data.abilities || [],
    skills: data.skills || [],
    classes: data.classes || [],
    conditions: data.conditions || [],
    buffs: data.buffs || [],
  };
  state.typing = Array.isArray(data.typing) ? data.typing : [];
  state.forumPlayer = String(data.forumPlayer || state.forumPlayer || '');
  state.lastSeq = state.messages.reduce((mx, m) => Math.max(mx, m.seq || 0), 0);
  if (data.maxSeq) state.lastSeq = Math.max(state.lastSeq, Number(data.maxSeq) || 0);
  $('#mode-tag').textContent = data.mode === 'db' ? '数据库' : '内存';
}

async function reloadAll() {
  const data = await api(`/api/state?since=0&me=${encodeURIComponent(state.me)}`);
  applySnapshot(data);
  renderAll();
}

let pollTimer = null;

async function poll() {
  if (state.dragging || !state.booted) return;
  try {
    const data = await api(`/api/state?since=${state.lastSeq}&me=${encodeURIComponent(state.me)}`);
    if (!data || data.error) return;
    let changed = false;

    if (Array.isArray(data.messages) && data.messages.length) {
      const have = new Set(state.messages.map((m) => m.seq));
      for (const m of data.messages) {
        if (!have.has(m.seq)) { state.messages.push(m); changed = true; }
      }
    }
    if (data.maxSeq && Number(data.maxSeq) > state.lastSeq) {
      state.lastSeq = Number(data.maxSeq);
    }

    if (JSON.stringify(data.state) !== JSON.stringify(state.room)) {
      state.room = data.state;
      changed = true;
    }
    if (JSON.stringify(data.characters) !== JSON.stringify(state.characters)) {
      state.characters = data.characters || [];
      changed = true;
    }
    if (JSON.stringify(data.typing || []) !== JSON.stringify(state.typing || [])) {
      state.typing = data.typing || [];
      changed = true;
    }
    if (changed) renderAll(true);
  } catch { /* 网络抖动忽略 */ }
}

/* =========================================================================
 * 4. 渲染：侧栏 / 顶栏
 * ========================================================================= */
function renderSidebar() {
  /* --- 主持人 --- */
  const dmBox = $('#dm-box');
  const dm = state.room.dm;
  if (!dm) {
    dmBox.innerHTML = '<button class="primary" data-act="claim-dm" style="width:100%">认领主持人</button>'
      + '<div class="hint" style="margin-top:6px">无人担任，先认领即可开始主持</div>';
  } else if (isDm()) {
    dmBox.innerHTML = `<div style="display:flex;align-items:center;gap:8px;font-size:13px">
        <span style="color:var(--amber)">你是主持人</span>
        <button class="ghost" data-act="release-dm" style="margin-left:auto;font-size:11.5px">释放</button>
      </div>`
      + `<button class="ghost reorder-btn${state.reorderMode ? ' on' : ''}" data-act="toggle-reorder" style="width:100%;margin-top:6px;font-size:11.5px">`
      + `${state.reorderMode ? '退出调整模式' : '调整消息顺序'}</button>`
      + `<div style="display:flex;gap:6px;margin-top:6px">
        <button class="ghost" data-act="rest-short" style="flex:1;font-size:11.5px">短休</button>
        <button class="ghost" data-act="rest-long" style="flex:1;font-size:11.5px">长休</button>
      </div>`
      + `<button class="ghost" data-act="roll-log" style="width:100%;margin-top:6px;font-size:11.5px">掷骰复盘</button>`
      + `<button class="ghost" data-act="scene" style="width:100%;margin-top:6px;font-size:11.5px">插入场景标记</button>`
      + (state.reorderMode ? '<div class="hint" style="margin-top:4px">拖住消息上下移动即可改顺序，再次点击退出</div>' : '');
  } else {
    dmBox.innerHTML = `<div style="display:flex;align-items:center;gap:8px;font-size:13px">
        <span style="color:var(--dim)">主持人</span>
        <span>${esc(dm.name || displayId(dm.clientId))}</span>
        <span class="own-tag" style="margin-left:auto">${esc(displayId(dm.clientId))}</span>
      </div>`;
  }

  /* --- 频道 --- */
  const chList = $('#ch-list');
  const counts = new Map();
  for (const m of state.messages) counts.set(channelOf(m), (counts.get(channelOf(m)) || 0) + 1);

  const read = readMap();
  const maxSeqOf = (id) => state.messages.reduce((mx, m) => (channelOf(m) === id ? Math.max(mx, m.seq || 0) : mx), 0);
  const shown = new Set(state.windows.map((w) => w.channel));
  let readDirty = false;
  for (const c of shown) {
    const mx = maxSeqOf(c);
    if ((read[c] || 0) !== mx) { read[c] = mx; readDirty = true; }
  }
  if (readDirty) saveReadMap(read);

  const curCh = focusedChannel();
  const isUnread = (id) => !shown.has(id)
    && state.messages.some((m) => channelOf(m) === id && (m.seq || 0) > (read[id] || 0) && m.sender !== state.me);

  chList.innerHTML = state.room.channels.map((c) => {
    const on = c.id === curCh ? ' on' : '';
    return `<div class="ch-row${on}" data-ch="${esc(c.id)}">
      <span class="dot"></span>
      <span class="nm">${esc(c.name)}</span>
      ${isUnread(c.id) ? '<span class="unread"></span>' : ''}
      <span class="cnt">${counts.get(c.id) || 0}</span>
      <span class="ops">
        <button data-opench="${esc(c.id)}" title="在新分页打开">${ICON.plus}</button>
        <button data-rename="${esc(c.id)}" title="改名">${ICON.pen}</button>
        <button data-delch="${esc(c.id)}" title="删除">${ICON.trash}</button>
      </span>
    </div>`;
  }).join('');
  $('#ch-add').innerHTML = ICON.plus;

  /* --- 角色卡 --- */
  renderCharList();
  $('#char-add').innerHTML = ICON.plus;
  $('#char-sync').innerHTML = ICON.refresh;
}

/* 角色配色：同一张卡永远同一个颜色，靠 id 哈希稳定分配 */
const CHAR_COLORS = ['#6aa8ff', '#7fd1c0', '#d8a657', '#d9737a', '#a78bfa', '#f4a261', '#8fd6a4', '#e5a7c9'];

function charColor(c) {
  if (!c) return '';
  if (c.color) return String(c.color);
  const key = String(c.id || c.name || '');
  let h = 0;
  for (let i = 0; i < key.length; i += 1) h = (h * 31 + key.charCodeAt(i)) >>> 0;
  return CHAR_COLORS[h % CHAR_COLORS.length];
}

function msgCharColor(m) {
  const cid = (m.meta && m.meta.characterId) || '';
  const c = cid
    ? state.characters.find((x) => x.id === cid)
    : state.characters.find((x) => x.name === m.author);
  return c ? charColor(c) : '';
}

function avatarHtml(c, extraClass) {
  const letter = esc(String(c.name || '?').trim().slice(0, 1) || '?');
  const img = c.avatar ? `<img src="${esc(c.avatar)}" alt="" onerror="this.remove()">` : '';
  /* data-av 存角色卡 id：右键/点击头像时用来弹「数值 / 论坛资料 / @」 */
  const av = c.avId ? ` data-av="${esc(c.avId)}"` : '';
  return `<span class="cav${extraClass ? ' ' + extraClass : ''}"${av}><b>${letter}</b>${img}</span>`;
}

/* 濒死 / 死亡 / 稳定 的展示（只看角色卡自己的 HP 和死亡豁免状态） */
function deathRow(c) {
  const ds = c.deathSaves || {};
  const dots = (n) => '●'.repeat(Math.max(0, Math.min(3, n || 0))) + '○'.repeat(Math.max(0, 3 - (n || 0)));
  if (ds.dead) return '<div class="death-row dead">已死亡 · 等待复活</div>';
  if (Number(c.hp) > 0) {
    return ds.stable ? '<div class="death-row stable">已稳定</div>' : '';
  }
  return `<div class="death-row">
    <span class="death-tag">濒死</span>
    <span class="death-dots" title="成功 / 失败">${dots(ds.s)} ${dots(ds.f)}</span>
    <button data-death="${esc(c.id)}">掷死亡豁免</button>
    <button class="ghost" data-rescue="${esc(c.id)}" title="无加成 DC=5，掷 1d6>=5 救回 1 HP">施救</button>
  </div>`;
}

function buffName(id) {
  const b = (state.ref.buffs || []).find((x) => x.id === id);
  return b ? b.name : '';
}

function charRowHtml(c) {
  const ready = Boolean(c.buff);
  const maxHp = Math.max(1, c.maxHp || 1);
  const pct = Math.max(0, Math.min(100, ((c.hp || 0) / maxHp) * 100));
  const low = pct <= 50 ? ' low' : '';
  const crit = pct <= 25 ? ' crit' : '';

  const npcTag = c.isNpc ? '<span class="npc-tag">NPC</span>' : '';
  const sub = (ready ? esc(buffName(c.buff)) : '<span class="pending">未选 BUFF</span>') + npcTag;
  const sanVal = c.san == null ? 3 : c.san;
  const meta = `<span class="mono">HP ${c.hp}/${c.maxHp}</span><span class="cdot">·</span><span class="mono" title="SAN 归零会被催眠">SAN ${sanVal}</span>`;

  return `<div class="char-row" data-char="${esc(c.id)}">
    ${avatarHtml(c)}
    <div class="cbody">
      <div class="char-top">
        <span class="char-name" style="color:${charColor(c)}">${esc(c.name)}</span>
        <span class="char-sub">${sub}</span>
      </div>
      <div class="char-meta">
        <span class="char-player">${esc(c.owner || '无主')}</span>
        <span class="cdot">·</span>
        ${meta}
      </div>
      ${ready ? `<div class="cbar"><span class="hpbar"><i class="${(low + crit).trim()}" style="width:${pct}%"></i></span></div>` : ''}
      ${deathRow(c)}
    </div>
  </div>`;
}

/* 拉取论坛表情（服务端直接读论坛 db.json，图片走 /emoji/ 转发，数据与论坛共享） */
async function loadEmojis() {
  try {
    const r = await api('/api/emojis');
    if (r && !r.error) {
      state.emoji = { groups: r.groups || [], emojis: r.emojis || [] };
      state.emojiGroup = null;
    }
  } catch { /* 表情拿不到不影响主流程 */ }
}

function emojiById(id) {
  return (state.emoji.emojis || []).find((x) => Number(x.id) === Number(id)) || null;
}

function emojiImg(id) {
  const e = emojiById(id);
  const name = e ? esc(e.name) : '';
  return `<img class="emoji" src="/emoji/${Number(id)}${e ? e.ext : '.webp'}" alt="${name}" title="${name}" onerror="this.remove()">`;
}

/* 把文本里的 [emoji:12] 换成表情图片 */
function withEmojis(html) {
  if (html.indexOf('[emoji:') < 0) return html;
  return html.replace(/\[emoji:(\d+)\]/g, (m0, id) => emojiImg(id));
}

/* 视觉相同、编码不同的玩家名（例如 ⭕️ 带不带变体选择符 FE0F）归到同一组，
   否则同一个人在列表里会被拆成两个分组 */
function ownerKey(name) {
  return String(name || '').normalize('NFKC').replace(/[\uFE0E\uFE0F]/g, '').trim();
}

function renderCharList() {
  const cl = $('#char-list');
  if (!cl) return;

  const q = (state.charQuery || '').trim().toLowerCase();
  const mine = state.characters.filter((c) => c.ownerClientId === state.me);
  let list = state.charFilter === 'mine' ? mine : state.characters;
  /* NPC 卡只有主持人能看到 */
  if (!isDm()) list = list.filter((c) => !c.isNpc);

  if (q) {
    list = list.filter((c) => String(c.name || '').toLowerCase().includes(q) || String(c.owner || '').toLowerCase().includes(q));
  }

  $$('#char-filter button').forEach((b) => b.classList.toggle('on', b.dataset.f === state.charFilter));
  const qInput = $('#char-q');
  if (qInput && qInput !== document.activeElement) qInput.value = state.charQuery;

  const mineBtn = $('#char-filter [data-f="mine"]');
  if (mineBtn) mineBtn.textContent = `我的 ${mine.length}`;
  const allBtn = $('#char-filter [data-f="all"]');
  if (allBtn) allBtn.textContent = `全部 ${state.characters.length}`;

  if (!list.length) {
    if (q) cl.innerHTML = '<div class="empty">没有匹配的角色</div>';
    else if (state.charFilter === 'mine') {
      cl.innerHTML = `<div class="empty">你名下还没有角色卡${state.characters.length ? '，切到「全部」可以看所有人的' : '，点 + 新建一张'}</div>`;
    } else cl.innerHTML = '<div class="empty">暂无角色卡</div>';
    return;
  }

  let html = '';
  const npcs = list.filter((c) => c.isNpc);
  const normals = list.filter((c) => !c.isNpc);
  if (npcs.length) {
    html += `<div class="cgroup npc-group">NPC<span>${npcs.length}</span></div>`;
    html += npcs.map(charRowHtml).join('');
  }

  if (state.charFilter === 'all' && !q) {
    const groups = new Map();
    for (const c of normals) {
      const raw = c.owner || '无主';
      const key = ownerKey(raw);
      if (!groups.has(key)) groups.set(key, { name: raw, arr: [] });
      groups.get(key).arr.push(c);
    }
    for (const { name, arr } of groups.values()) {
      html += `<div class="cgroup">${esc(name)}<span>${arr.length}</span></div>`;
      html += arr.map(charRowHtml).join('');
    }
  } else {
    html += normals.map(charRowHtml).join('');
  }
  cl.innerHTML = html;
}

function renderTopbar() {
  const fc = focusedChannel();
  const ch = state.room.channels.find((c) => c.id === fc);
  $('#top-channel').innerHTML = `${esc(ch ? ch.name : '主频道')}<span>${state.messages.filter((m) => channelOf(m) === fc).length} 条</span>`;
  $('#top-me').textContent = displayId(state.me) + (isDm() ? ' · 主持人' : '');
  const anBtn = $('#btn-announce');
  if (anBtn) anBtn.hidden = !isDm();
  const npcBtn = $('#npc-add');
  if (npcBtn) npcBtn.hidden = !isDm();

  const strip = $('#top-combat');
  const cb = state.room.combat;
  if (cb && cb.active && cb.order.length) {
    const cur = cb.order[Math.min(cb.turn, cb.order.length - 1)];
    const picked = [...turnPicks]
      .map((id) => cb.order.find((o) => o.id === id))
      .filter(Boolean);
    const whoText = picked.length
      ? (picked.length > 3
        ? `${picked.slice(0, 3).map((o) => o.name).join('、')} 等 ${picked.length} 人`
        : picked.map((o) => o.name).join('、'))
      : (cur ? cur.name : '—');

    strip.hidden = false;

    if (isDm()) {
      /* 主持人看：本轮轮到谁 + 推进按钮 */
      strip.innerHTML = `第 <b>${cb.round}</b> 轮 <span class="cs-sep">·</span> `
        + `<b>${esc(whoText)}</b>`
        + (cur && cur.maxHp ? `<span class="cs-hp">${cur.hp}/${cur.maxHp}</span>` : '')
        + '<button class="cs-next" id="cs-next">下一位 →</button>';
    } else {
      /* 玩家看：自己的排队位置 */
      const myIdx = cb.order.findIndex((o) => o.kind === 'pc' && o.ownerClientId === state.me);
      const curIdx = Math.min(cb.turn, cb.order.length - 1);
      let mine = '';

      if (myIdx < 0) {
        mine = `<span class="cs-wait">旁观中</span>`;
      } else if (myIdx === curIdx || turnPicks.has(cb.order[myIdx].id)) {
        mine = '<span class="cs-turn">轮到你！</span>';
      } else if (myIdx > curIdx) {
        const ahead = cb.order.slice(curIdx + 1, myIdx + 1).filter((o) => o.kind === 'pc').length;
        mine = `<span class="cs-wait">排队中 · 前面还有 <b>${ahead}</b> 人</span>`;
      } else {
        mine = '<span class="cs-wait">你已经行动过了</span>';
      }
      const myEntry = cb.order.find((o) => o.kind === 'pc' && o.ownerClientId === state.me);
      if (myEntry && myEntry.hypnotized) mine = '<span class="cs-wait">你被催眠了，无法行动</span>';

      strip.innerHTML = `第 <b>${cb.round}</b> 轮 <span class="cs-sep">·</span> ${mine}`;
    }
  } else {
    strip.hidden = true;
  }

  $('#btn-addwin').disabled = state.windows.length >= maxWindows();
}

/* =========================================================================
 * 5. 渲染：窗口
 * ========================================================================= */
const winMap = new Map();

/* ---------- 回车行为：默认回车发送，可切换成回车换行 ---------- */
const SEND_ENTER_KEY = 'dnd.sendOnEnter';
function sendOnEnter() {
  try { return localStorage.getItem(SEND_ENTER_KEY) !== '0'; } catch (e) { return true; }
}
function syncEnterButtons() {
  for (const [, w] of winMap) { if (w && typeof w.syncEnterBtn === 'function') w.syncEnterBtn(); }
}
function setSendOnEnter(on) {
  try { localStorage.setItem(SEND_ENTER_KEY, on ? '1' : '0'); } catch (e) { /* ignore */ }
  syncEnterButtons();
}

function renderAll(preserve) {
  if (state.dragging) return;
  renderSidebar();
  renderTopbar();
  renderAnnouncement();
  syncWindows(preserve);
  renderCombat();
}

/* ---------------- 房间公告 ---------------- */
function renderAnnouncement() {
  const box = $('#announce');
  if (!box) return;

  const a = state.room.announcement;
  if (!a || !a.text) { box.hidden = true; box.innerHTML = ''; return; }

  const wasOpen = box.classList.contains('open');
  box.hidden = false;
  box.innerHTML = `
    <span class="an-icon">${ICON.pin}</span>

/** 主持人掷骰复盘：本场所有掷骰，可按结果筛选 */
function openRollLog() {
  if (!isDm()) { toast('只有主持人能看复盘'); return; }

  const all = state.messages
    .filter((m) => m.kind === 'roll' && m.meta && (m.meta.type === 'check' || m.meta.type === 'dice'))
    .slice()
    .sort((a, b) => Number(a.seq) - Number(b.seq));

  $('#modal-title').textContent = '掷骰复盘';
  $('#modal-sub').textContent = `本场共 ${all.length} 次掷骰`;

  let filter = 'all';
  const render = () => {
    const list = all.filter((m) => {
      const meta = m.meta || {};
      if (filter === 'ok') return meta.success === true;
      if (filter === 'bad') return meta.success === false;
      if (filter === 'nat') return Boolean(meta.nat6 || meta.nat1);
      return true;
    });

    const rows = list.map((m) => {
      const meta = m.meta || {};
      const kind = meta.type === 'check' ? (meta.label || '掷骰') : (meta.expr || '掷骰');
      const total = meta.total == null ? '—' : meta.total;
      let tag = '';
      if (meta.type === 'check') {
        if (meta.nat6) tag = '<span class="chip nat">大成功</span>';
        else if (meta.nat1) tag = '<span class="chip nat">大失败</span>';
        else if (meta.success === true) tag = '<span class="chip ok">成功</span>';
        else if (meta.success === false) tag = '<span class="chip bad">失败</span>';
      }
      if (meta.dark) tag += ' <span class="chip">暗骰</span>';
      const dc = meta.dc == null ? '' : `DC ${meta.dc}`;
      return `<tr><td>${fmtTime(m.created_at)}</td><td>${esc(m.author || '—')}</td>`
        + `<td>${esc(kind)}</td><td class="num">${total}</td><td>${esc(dc)}</td><td>${tag}</td></tr>`;
    }).join('');

    $('#modal-body').innerHTML = `<div class="rl-head">
        <button data-rl="all" class="${filter === 'all' ? 'on' : ''}">全部 ${all.length}</button>
        <button data-rl="ok" class="${filter === 'ok' ? 'on' : ''}">成功</button>
        <button data-rl="bad" class="${filter === 'bad' ? 'on' : ''}">失败</button>
        <button data-rl="nat" class="${filter === 'nat' ? 'on' : ''}">大成功 / 大失败</button>
      </div>
      <table class="rl-table">
        <thead><tr><th>时间</th><th>角色</th><th>类型</th><th>结果</th><th>DC</th><th></th></tr></thead>
        <tbody>${rows || '<tr><td colspan="6" class="hint">没有符合条件的记录</td></tr>'}</tbody>
      </table>`;
  };

  $('#modal-body').dataset.mode = 'rolllog';
  render();
  $('#modal-foot').innerHTML = '<span class="sp"></span><button data-mact="close">关闭</button>';
  $('#modal').hidden = false;

  $('#modal-body').onclick = (e) => {
    const b = e.target.closest('[data-rl]');
    if (!b) return;
    filter = b.dataset.rl;
    render();
  };
}

function openAnnounceEditor() {
  const a = state.room.announcement;
  $('#modal-title').textContent = '房间公告';
  $('#modal-sub').textContent = '所有人都会在每个频道上方看到';
  $('#modal-body').dataset.mode = 'announce';
  $('#modal-body').innerHTML = `<textarea id="an-input" rows="6" style="width:100%;resize:vertical;font-size:13px;line-height:1.6" placeholder="写点什么，比如集合时间、房规、本场须知…">${esc(a ? a.text : '')}</textarea>`;

  $('#modal-foot').innerHTML = `${a ? '<button class="danger" id="an-clear">删除公告</button>' : ''}
    <span class="sp"></span>
    <button data-mact="close">取消</button>
    <button class="primary" id="an-save">保存</button>`;

  $('#modal').hidden = false;
  const ta = $('#an-input');
  setTimeout(() => ta.focus(), 40);

  $('#an-save').onclick = async () => {
    const text = ta.value.trim();
    const r = await api('/api/announcement', { text, clientId: state.me });
    if (r.error) { toast(r.error); return; }
    closeModal();
    await reloadAll();
    toast(text ? '公告已更新' : '公告已清空');

  const clr = $('#an-clear');

    const r = await api('/api/announcement', { text: '', clientId: state.me });
    if (r.error) { toast(r.error); return; }
    closeModal();
    await reloadAll();
    toast('公告已删除');
  };
}

function syncWindows(preserve) {
  const chIds = new Set(state.room.channels.map((c) => c.id));
  const fallbackCh = state.room.channels[0] ? state.room.channels[0].id : 'main';

  for (const w of state.windows) {
    if (!w.channel || !chIds.has(w.channel)) w.channel = fallbackCh;
  }
  /* 角色卡被删/换账号后，身份回落到本人 */
  const validIds = new Set(myChars().map((c) => c.id));
  const firstChar = myChars()[0];
  for (const w of state.windows) {
    if (!validIds.has(w.identity)) w.identity = firstChar ? firstChar.id : '';
  }

  if (state.windows.length > MAX_PANES) state.windows.length = MAX_PANES;
  if (!state.windows.length) {
    state.windows.push({
      id: uuid(), channel: fallbackCh, identity: firstChar ? firstChar.id : '',
      kind: 'auto', vis: 'all', audience: [], search: '',
    });
  }
  if (!state.windows.find((w) => w.id === state.focused)) state.focused = state.windows[0].id;

  const host = $('#windows');
  for (const [id, win] of winMap) {
    if (!state.windows.find((w) => w.id === id)) {
      win.el.remove();
      winMap.delete(id);
    }
  }

  const desired = [];
  for (const cfg of state.windows) {
    let win = winMap.get(cfg.id);
    if (!win) {
      win = new ChatWindow(cfg);
      winMap.set(cfg.id, win);
    } else {
      win.cfg = cfg;
    }
    win.el.classList.toggle('focused', cfg.id === state.focused);
    /* 调整模式标记：CSS 据此显示可拖动的提示 */
    win.el.classList.toggle('reorder', Boolean(state.reorderMode) && isDm());
    desired.push(win);
  }

  /* 顺序没变就完全不碰 DOM。appendChild 会把节点重新挂载，
     手机端正在输入时输入法会被强制收起——别的玩家一发言就掉键盘。 */
  const current = [...host.children];
  const sameOrder = current.length === desired.length
    && desired.every((w, i) => current[i] === w.el);
  if (!sameOrder) {
    for (const w of desired) host.appendChild(w.el);
  }

  for (const w of desired) {
    w.renderHead();
    w.renderThread(preserve);
    w.renderTyping();
  }
  $('#btn-addwin').disabled = state.windows.length >= MAX_PANES;
  saveSession();
}

    this.msgs.addEventListener('scroll', () => this.updateGoBottom());

    el.querySelector('.rb-x').addEventListener('click', () => this.clearReply());

    this.msgs.addEventListener('click', async (e) => {
      /* 长按刚弹过菜单，紧跟的这次 click 丢掉 */
      if (Date.now() < state.ignoreClickUntil) return;

      /* 点/右键头像：查看数值、论坛资料、@ */
      const avEl = e.target.closest('[data-av]');
      if (avEl) {
        e.stopPropagation();
        const r = avEl.getBoundingClientRect();
        openAvMenu(avEl.dataset.av, this, r.left, r.bottom + 4);
        return;
      }

      /* 随机抽选：玩家用角色卡报名 */
      const lotJoin = e.target.closest('[data-lotjoin]');
      if (lotJoin) {
        e.stopPropagation();
        lotJoin.disabled = true;
        lotJoin.textContent = '报名中…';
        const r = await api('/api/lottery/join', {
          seq: Number(lotJoin.dataset.lotjoin),
          cardId: lotJoin.dataset.card,
          clientId: state.me,
        });
        if (r.error) {
          toast(r.error);
          lotJoin.disabled = false;
          lotJoin.textContent = '报名';
          return;
        }
        await reloadAll();
        if (r.result) toast(`满员自动抽取，${r.result.winner.name} 被抽中！`);
        else toast(`报名成功，当前 ${r.count} 人`);
        return;
      }

      /* 随机抽选：主持人截止并随机抽取 */
      const lotClose = e.target.closest('[data-lotclose]');
      if (lotClose) {
        e.stopPropagation();
        lotClose.disabled = true;
        const r = await api('/api/lottery/close', {
          seq: Number(lotClose.dataset.lotclose),
          clientId: state.me,
        });
        if (r.error) { toast(r.error); lotClose.disabled = false; return; }
        await reloadAll();
        toast(`${r.winner.name} 被抽中！`);
        return;
      }

      /* 猜拳：点手势自己出拳 */
      const rpsBtn = e.target.closest('[data-rps]');
      if (rpsBtn) {
        e.stopPropagation();
        rpsBtn.disabled = true;
        const r = await api('/api/rps/join', {
          seq: Number(rpsBtn.dataset.rps),
          clientId: state.me,
          hand: rpsBtn.dataset.hand,
        });
        if (r.error) {
          toast(r.error);
          rpsBtn.disabled = false;
          return;
        }
        await reloadAll();
        toast(r.tie ? '平局' : r.win ? '你赢了！' : '你输了');
        return;
      }

      /* 拼点邀请：点「参加」自己掷一次 */
      const joinBtn = e.target.closest('[data-join]');
      if (joinBtn) {
        e.stopPropagation();
        joinBtn.disabled = true;
        joinBtn.textContent = '掷骰中…';
        const r = await api('/api/contest/join', {
          seq: Number(joinBtn.dataset.join),
          clientId: state.me,
        });
        if (r.error) {
          toast(r.error);
          joinBtn.disabled = false;
          joinBtn.textContent = '这样骰 · 参加';
          return;
        }
        await reloadAll();
        toast(r.dc ? `掷出 ${r.total}，${r.win ? '成功' : '失败'}（DC ${r.dc}）` : `你拼出了 ${r.total}，${r.win ? '胜' : r.tie ? '平' : '负'}`);
        return;
      }

      /* 点「+N」= 自己也跟着发一条 */
      const reactBtn = e.target.closest('[data-react]');
      if (reactBtn) {
        e.stopPropagation();
        const row = reactBtn.closest('.msg[data-seq]');
        if (row) toggleReaction(Number(row.dataset.seq), reactBtn.dataset.react);
        return;
      }

      const plusBtn = e.target.closest('[data-plus]');
      if (plusBtn) {
        e.stopPropagation();
        /* QQ 式「+1」：自己也跟着发一条同样的内容 */
        this.repeatMessage(Number(plusBtn.dataset.plus));
        return;
      }

      const uf = e.target.closest('[data-unfold]');
      if (uf) { e.stopPropagation(); const row = uf.closest('.msg'); if (row) row.classList.add('unfolded'); return; }

      const mo = e.target.closest('[data-mmore]');
      if (mo) { e.stopPropagation(); openMsgMenu(this, Number(mo.dataset.mmore), mo); return; }

      const rp = e.target.closest('[data-mreply]');
      if (rp) { e.stopPropagation(); this.setReplyBySeq(Number(rp.dataset.mreply)); return; }

      const q = e.target.closest('[data-quote]');
      if (q) {
        e.stopPropagation();
        const row = this.msgs.querySelector(`.msg[data-seq="${q.dataset.quote}"]`);
        if (row) {
          row.scrollIntoView({ block: 'center', behavior: 'smooth' });
          row.classList.add('flash');
          setTimeout(() => row.classList.remove('flash'), 1000);
        } else {
          toast('原消息不在这个频道，或已被删除');
        }
        return;
      }

      const ed = e.target.closest('[data-medit]');
      if (ed) { e.stopPropagation(); beginEditMessage(this, Number(ed.dataset.medit)); return; }
      const dl = e.target.closest('[data-mdel]');
      if (dl) { e.stopPropagation(); removeMessage(Number(dl.dataset.mdel)); }
    });

    /* 表情面板 */
    const emojiBtn = el.querySelector('.w-emoji');
    const emojiPop = el.querySelector('.emoji-pop');
    if (emojiBtn && emojiPop) {
      emojiBtn.addEventListener('click', () => {
        emojiPop.hidden = !emojiPop.hidden;
        if (emojiPop.hidden) return;
        if (!state.emoji.emojis.length) loadEmojis().then(() => this.renderEmojiPop());
        this.renderEmojiPop();
      });
      emojiPop.addEventListener('click', (e) => {
        const g = e.target.closest('[data-eg]');
        if (g) { state.emojiGroup = Number(g.dataset.eg); this.renderEmojiPop(); return; }
        const c = e.target.closest('[data-emoji]');
        if (c) this.insertAtCursor(`[emoji:${c.dataset.emoji}]`);
      });
    }

    /* 右键 / 长按任意消息：弹出「复制、引用」 */
    this.msgs.addEventListener('contextmenu', (e) => {
      const avEl = e.target.closest('[data-av]');
      if (avEl) {
        e.preventDefault();
        openAvMenu(avEl.dataset.av, this, e.clientX, e.clientY);
        return;
      }
      const row = e.target.closest('.msg[data-seq]');
      if (!row) return;
      e.preventDefault();
      openQuickMenu(this, Number(row.dataset.seq), e.clientX, e.clientY);
    });

    let lpTimer = 0, lpX = 0, lpY = 0, lpMoved = false, lpSeq = 0;
    this.msgs.addEventListener('pointerdown', (e) => {
      if (e.button !== 0 || !e.isPrimary) return;
      /* 头像有自己的菜单（点击/右键），不参与长按 */
      if (e.target.closest('[data-av]')) return;
      const row = e.target.closest('.msg[data-seq]');
      if (!row) return;
      /* 调整模式要用拖动，别和长按菜单抢 */
      if (state.reorderMode && isDm()) return;
      lpX = e.clientX; lpY = e.clientY; lpMoved = false;
      lpSeq = Number(row.dataset.seq);
      clearTimeout(lpTimer);
      lpTimer = setTimeout(() => { if (!lpMoved) openQuickMenu(this, lpSeq, lpX, lpY); }, 520);
    });
    this.msgs.addEventListener('pointermove', (e) => {
      if (lpMoved) return;
      if (Math.hypot(e.clientX - lpX, e.clientY - lpY) > 9) { lpMoved = true; clearTimeout(lpTimer); }
    });
    const cancelLongPress = () => { clearTimeout(lpTimer); lpMoved = true; };
    this.msgs.addEventListener('pointerup', cancelLongPress);
    this.msgs.addEventListener('pointercancel', cancelLongPress);
    this.msgs.addEventListener('pointerleave', cancelLongPress);

    el.querySelector('.w-send').addEventListener('click', () => this.send());

    /* 掷骰条 */
    const diceBtn = el.querySelector('.w-dice');
    diceBtn.innerHTML = ICON.dice;
    diceBtn.addEventListener('click', () => {
      this.rollBar.hidden = !this.rollBar.hidden;
      diceBtn.classList.toggle('on', !this.rollBar.hidden);
      if (!this.rollBar.hidden) { this.renderRoll(); this.input.blur(); }
      saveSession();
    });

    this.rollBar.addEventListener('click', (e) => {
      const face = e.target.closest('[data-face]');
      if (face) {
        this.roll.face = Number(face.dataset.face) || 6;
        this.renderRoll();
        return;
      }

      const m2 = e.target.closest('[data-rm2]');
      if (m2) { this.roll.diceMode = m2.dataset.rm2; this.renderRoll(); return; }
      if (e.target.closest('.rb-go2')) { this.doDamage(); return; }
    });

    /* 数量 / DC 都是下拉选择，选完记住，不用打字 */
    const cntSel = this.rollBar.querySelector('.rb-count');
    const dcSel = this.rollBar.querySelector('.rb-dc2');
    if (cntSel) {
      cntSel.innerHTML = Array.from({ length: 10 }, (_, i) => i + 1)
        .map((n) => `<option value="${n}">${n} 个</option>`).join('');
      cntSel.addEventListener('change', () => { this.roll.count = Number(cntSel.value) || 1; this.renderRoll(); });
    }
    if (dcSel) {
      dcSel.innerHTML = '<option value="">不判 DC</option>'
        + [1, 2, 3, 4, 5, 6].map((n) => `<option value="${n}">DC ${n}</option>`).join('');
      dcSel.addEventListener('change', () => {
        this.roll.dc = dcSel.value === '' ? null : Number(dcSel.value);
        this.renderRoll();
      });
    }

    /* 输入法组合状态：组合中按回车是选词，不是发送 */
    this._composing = false;
    this._imeUntil = 0;
    this.input.addEventListener('compositionstart', () => { this._composing = true; });
    this.input.addEventListener('compositionend', () => {
      this._composing = false;
      this._imeUntil = Date.now() + 120;
    });
    this.input.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter' || e.shiftKey) return;
      if (this._composing || e.isComposing || e.keyCode === 229 || Date.now() < this._imeUntil) return;
      if (!sendOnEnter()) return;   // 回车换行模式，交给浏览器插换行
      e.preventDefault();
      this.send();
    });

    el.querySelector('.w-enter').addEventListener('click', () => setSendOnEnter(!sendOnEnter()));
    this.syncEnterBtn();
    this.input.addEventListener('input', () => {
      autosize(this.input);
      this.schedulePreview();
      this.pingTyping();
      clearTimeout(this._draftTimer);
      this._draftTimer = setTimeout(() => saveDraft(this.cfg.id, this.cfg.channel, this.input.value), 500);
    });

    el.querySelector('.w-close').innerHTML = ICON.x;
  }

  /** 同步「回车发送 / 回车换行」按钮外观（构造时节点还没进 DOM，不能全局查询） */
  syncEnterBtn() {
    const b = this.el.querySelector('.w-enter');
    if (!b) return;
    const on = sendOnEnter();
    b.classList.toggle('on', on);
    b.textContent = on ? '⏎发送' : '⏎换行';
    b.title = on ? '回车发送 · 点击改为回车换行（Shift+回车仍可换行）' : '回车换行 · 点击改为回车发送';
  }

  /** 表情面板：按论坛分组展示，点一下插入 [emoji:id] */
  renderEmojiPop() {
    const pop = this.el.querySelector('.emoji-pop');
    if (!pop) return;
    const { groups, emojis } = state.emoji;
    if (!emojis.length) {
      pop.innerHTML = '<div class="empty" style="padding:8px 4px;font-size:12px">论坛还没有表情</div>';
      return;
    }
    const gid = state.emojiGroup == null ? (groups[0] ? groups[0].id : null) : state.emojiGroup;
    const tabs = groups.map((g) =>
      `<button data-eg="${g.id}" class="${g.id === gid ? 'on' : ''}">${esc(g.name)}</button>`).join('');
    const list = emojis.filter((e) => gid == null || e.groupId === gid);
    const grid = list.length
      ? list.map((e) => `<button class="emoji-cell" data-emoji="${e.id}" title="${esc(e.name)}">`
          + `<img src="/emoji/${e.id}${e.ext}" alt="${esc(e.name)}" loading="lazy"></button>`).join('')
      : '<div class="empty" style="grid-column:1/-1;padding:6px;font-size:12px">这组还没有表情</div>';
    pop.innerHTML = `<div class="emoji-tabs">${tabs}</div><div class="emoji-grid">${grid}</div>`;
  }

  /** 在光标处插入一段文本（表情、@ 之类） */
  insertAtCursor(text) {
    const ta = this.input;
    const s = ta.selectionStart == null ? ta.value.length : ta.selectionStart;
    const e = ta.selectionEnd == null ? ta.value.length : ta.selectionEnd;
    const v = ta.value;
    ta.value = v.slice(0, s) + text + v.slice(e);
    const pos = s + text.length;
    ta.setSelectionRange(pos, pos);
    autosize(ta);
    this.schedulePreview();
    ta.focus();
  }

  /** 输入区左侧的当前角色卡头像（切换身份要立刻刷新，不能等整页重绘） */
  renderInputAvatar() {
    const av = this.el.querySelector('.w-av');
    if (!av) return;
    const cur = state.characters.find((x) => x.id === this.cfg.identity);
    av.innerHTML = avatarHtml(cur ? { name: cur.name, avatar: cur.avatar, avId: cur.id } : { name: state.me || '?', avatar: '' }, '');
    av.title = cur ? cur.name : (state.me || '');
  }

  renderHead() {
    const ch = state.room.channels.find((c) => c.id === this.cfg.channel);
    const label = this.el.querySelector('.w-ch');
    if (label) label.innerHTML = `<span>#</span>${esc(ch ? ch.name : '频道')}`;

    const sel = this.el.querySelector('.w-id');
    const chars = myChars();
    const opts = chars.map((c) => ({
      v: c.id,
      label: (c.isNpc ? `[NPC] ${c.name}` : c.name) + (buffName(c.buff) ? ` · ${buffName(c.buff)}` : ''),
    }));

    const sig = opts.map((o) => o.v + '|' + o.label).join(',');
    if (this._sig !== sig) {
      this._sig = sig;
      sel.innerHTML = opts.length
        ? opts.map((o) => `<option value="${esc(o.v)}">${esc(o.label)}</option>`).join('')
        : '<option value="">（没有角色卡）</option>';
    }
    if (!opts.find((o) => o.v === this.cfg.identity)) this.cfg.identity = chars[0] ? chars[0].id : '';
    sel.value = this.cfg.identity;

    if (this._lastChannel !== this.cfg.channel) {
      if (this._lastChannel && this.input.value.trim()) {
        saveDraft(this.cfg.id, this._lastChannel, this.input.value);
        pushDraftHistory(this.input.value);
      }
      this._lastChannel = this.cfg.channel;
      this.input.value = loadDraft(this.cfg.id, this.cfg.channel);
      autosize(this.input);
      this.clearReply();
      this.closeHistory();
      this.preview.hidden = true;
    }

    const hasChar = chars.some((c) => c.id === this.cfg.identity);
    this.input.disabled = !hasChar;
    this.input.placeholder = hasChar
      ? '发言…「自动」会识别 #动作 / *动作 / （皮下），也可写 {1d6}'
      : '先在侧栏「角色卡」新建一张，才能发言';
    this.el.querySelector('.w-send').disabled = !hasChar;
    this.el.querySelector('.w-dice').disabled = !hasChar;

    $$('.w-kind button', this.el).forEach((b) => b.classList.toggle('on', b.dataset.kind === this.cfg.kind));
    $$('.w-vis button', this.el).forEach((b) => {
      b.classList.toggle('on', b.dataset.vis === this.cfg.vis);
    });

    if (this.el.querySelector('.w-search') !== document.activeElement) {
      this.el.querySelector('.w-search').value = this.cfg.search || '';
    }

    this.renderInputAvatar();

    this.renderRoll();
  }

  renderRoll() {
    const rb = this.rollBar;
    if (!rb || rb.hidden) return;

    const char = state.characters.find((c) => c.id === this.cfg.identity);

    /* 暗骰 / 定向：只有主持人能选 */
    const secretRow = rb.querySelector('.rb-secret-row');
    if (secretRow) {
      const dm = isDm();
      secretRow.hidden = !dm;
      if (dm) {
        const sel = rb.querySelector('.rb-secret');
        if (sel) {
          const cur = sel.value;
          const players = [...new Set(state.characters.map((c) => c.ownerClientId).filter((p) => p && p !== state.me))];
          sel.innerHTML = '<option value="">公开</option>'
            + '<option value="dark">暗骰（点数只有你看得到）</option>'
            + players.map((p) => `<option value="to:${esc(p)}">定向给 ${esc(displayId(p))}</option>`).join('');
          if ([...sel.options].some((o) => o.value === cur)) sel.value = cur;
        }
      }
    }

    $$('[data-rm2]', rb).forEach((b) => b.classList.toggle('on', b.dataset.rm2 === this.roll.diceMode));
    $$('[data-face]', rb).forEach((b) => b.classList.toggle('on', Number(b.dataset.face) === this.roll.face));

    const cntSel = rb.querySelector('.rb-count');
    if (cntSel) cntSel.value = String(this.roll.count || 1);
    const dcSel = rb.querySelector('.rb-dc2');
    if (dcSel) dcSel.value = this.roll.dc == null ? '' : String(this.roll.dc);

    const target = rb.querySelector('.rb-target');
    if (char) {
      const buff = (state.ref.buffs || []).find((b) => b.id === char.buff);
      target.textContent = `${char.name}${buff ? ' · ' + buff.name : ''}`;
      target.classList.remove('warn');
    } else {
      target.textContent = '身份是「我」，掷骰要先切到角色卡';
      target.classList.add('warn');
    }
    const go2 = rb.querySelector('.rb-go2');
    if (go2) go2.disabled = !char;
  }

  rollVisibility() {
    const vis = this.cfg.vis;
    return {
      visibility: vis,
      audience: vis === 'direct' ? this.cfg.audience.slice() : [],
    };
  }

  /** 主持人在掷骰条上临时选的可见范围：公开 / 暗骰 / 定向某人 */
  secretPayload() {
    const sel = this.rollBar.querySelector('.rb-secret');
    const row = this.rollBar.querySelector('.rb-secret-row');
    if (isDm() && sel && row && !row.hidden) {
      const v = sel.value || '';
      if (v === 'dark') return { visibility: 'all', audience: [], dark: true };
      if (v.startsWith('to:')) return { visibility: 'direct', audience: [v.slice(3)], dark: false };
    }
    return Object.assign({ dark: false }, this.rollVisibility());
  }

  async doDamage() {
    const face = Number(this.roll.face) || 6;
    const count = Math.max(1, Math.min(10, Number(this.roll.count) || 1));
    const expr = `${count}d${face}`;
    const dcRaw = this.roll.dc == null ? '' : String(this.roll.dc);

    const targets = [this.cfg.identity];
    const chars = targets.map((cid) => state.characters.find((c) => c.id === cid)).filter(Boolean);
    if (!chars.length) { toast('先选一张角色卡'); return; }

    let done = 0;
    for (const char of chars) {
      const payload = Object.assign({
        expr,
        dc: dcRaw === '' ? null : Number(dcRaw),
        author: char.name,
        characterId: char.id,
        role: 'pc',
        mode: this.roll.diceMode,
        sender: state.me,
        channel: this.cfg.channel,
      }, this.secretPayload());

      /* eslint-disable no-await-in-loop */
      const r = await api('/api/damage', payload);
      if (r.error) { toast(r.error); continue; }
      done += 1;
    }
    if (!done) return;
    await poll();
    this.scrollToBottom();
  }

  visibleMessages() {
    const q = (this.cfg.search || '').trim().toLowerCase();
    return state.messages
      .filter((m) => channelOf(m) === this.cfg.channel)
      .filter((m) => !q || String(m.text || '').toLowerCase().includes(q) || String(m.author || '').toLowerCase().includes(q))
      .sort(messageSort);
  }

  renderThread(preserve) {
    if (state.dragging) return;
    const editingRow = this.msgs.querySelector('.msg.editing');
    if (editingRow) {
      // 正在编辑这一条就冻结列表；但如果这一页已切到别的频道，就放弃编辑并正常渲染
      const em = state.messages.find((x) => x.seq === Number(editingRow.dataset.seq));
      if (em && channelOf(em) === this.cfg.channel) return;
      state.editing = null;
    }

    const prevTop = this.msgs.scrollTop;
    const prevHeight = this.msgs.scrollHeight;
    const prevClient = this.msgs.clientHeight;
    const atBottom = prevHeight - prevTop - prevClient < 90;

    const list = markRepeats(this.visibleMessages());
    this.msgs.classList.remove('dragging');

    if (!list.length) {
      const q = (this.cfg.search || '').trim();
      this.msgs.innerHTML = `<div class="thread-empty">${q ? '没有匹配的消息' : `这个频道还没有记录<br>选「自动」时 <kbd>#动作</kbd> <kbd>*动作</kbd> <kbd>（皮下）</kbd> 可混写，一条输入按标记拆成多条`}</div>`;
      this.updateGoBottom();
      return;
    }

    let prev = null;
    this.msgs.innerHTML = list.map((m) => {
      const cont = isContinuous(prev, m);
      prev = m;
      return messageHtml(m, cont);
    }).join('');

    if (preserve) {
      if (atBottom) this.msgs.scrollTop = this.msgs.scrollHeight;
      else this.msgs.scrollTop = prevTop;
    } else {
      /* 首次进入 / 切频道：一律定位到最新一条。
         原来消息超过 30 条且最后一条不是自己发的时会停在顶部。 */
      this.msgs.scrollTop = this.msgs.scrollHeight;
      requestAnimationFrame(() => { this.msgs.scrollTop = this.msgs.scrollHeight; });
    }
    this.updateGoBottom();
  }

  scrollToBottom() {
    this.msgs.scrollTop = this.msgs.scrollHeight;
    this.updateGoBottom();
  }

  openHistory() {
    const pop = this.el.querySelector('.hist-pop');
    if (!pop) return;
    const list = loadDraftHistory();

    pop.innerHTML = `<div class="hist-head">草稿历史<button data-hclear>清空</button></div>`
      + (list.length
        ? list.slice(0, 20).map((h, i) =>
            `<button class="hist-item" data-hi="${i}">${esc(h.text)}<span class="ht">${fmtDateTime(new Date(h.at).toISOString())}</span></button>`).join('')
        : '<div class="empty" style="padding:6px 6px 4px">还没有记录</div>');

    pop.hidden = false;

    const clr = pop.querySelector('[data-hclear]');
    if (clr) clr.onclick = () => { saveDraftHistory([]); this.openHistory(); };

    pop.querySelectorAll('[data-hi]').forEach((b) => {
      b.onclick = () => {
        const h = list[Number(b.dataset.hi)];
        if (!h) return;
        this.input.value = h.text;
        autosize(this.input);
        saveDraft(this.cfg.id, this.cfg.channel, h.text);
        this.closeHistory();
        this.input.focus();
      };
    });
  }

  closeHistory() {
    const pop = this.el.querySelector('.hist-pop');
    if (pop) pop.hidden = true;
  }

  renderTyping() {
    const box = this.el.querySelector('.typing');
    if (!box) return;
    const list = (state.typing || []).filter((t) => t.channel === this.cfg.channel && t.sender !== state.me);
    if (!list.length) { box.hidden = true; box.innerHTML = ''; return; }
    box.hidden = false;
    const names = list.slice(0, 3).map((t) => t.author).join('、');
    const av = avatarHtml({ name: list[0].author, avatar: list[0].avatar }, '');
    box.innerHTML = `${av}<span>${esc(names)} 正在输入…</span>`;
  }

  pingTyping() {
    if (!this.input.value.trim()) return;
    const now = Date.now();
    if (this._typingAt && now - this._typingAt < 2000) return;
    this._typingAt = now;
    const char = state.characters.find((c) => c.id === this.cfg.identity);
    if (!char) return;
    api('/api/typing', { channel: this.cfg.channel, characterId: char.id, sender: state.me });
  }

  updateGoBottom() {
    const c = this.msgs;
    const btn = this.el.querySelector('.w-gobottom');
    if (!btn) return;
    const far = c.scrollHeight - c.scrollTop - c.clientHeight > 200;
    btn.classList.toggle('show', far);
  }

  openAudience() {
    const seen = new Set();
    const cands = [];
    for (const c of state.characters) {
      if (!c.ownerClientId || c.ownerClientId === state.me || seen.has(c.ownerClientId)) continue;
      seen.add(c.ownerClientId);
      cands.push(c);
    }
    if (!cands.length) {
      this.audPop.innerHTML = '<div class="pop-h">还没有其他玩家</div>';
    } else {
      this.audPop.innerHTML = '<div class="pop-h">定向给（仅被选中的玩家与你可看）</div>'
        + cands.map((c) => `<label><input type="checkbox" value="${esc(c.ownerClientId)}" ${this.cfg.audience.includes(c.ownerClientId) ? 'checked' : ''}>
            <span>${esc(c.name)} <span style="color:var(--dim2);font-size:10.5px">${esc(displayId(c.ownerClientId))}</span></span></label>`).join('');
    }
    this.audPop.hidden = false;
    this.audPop.onchange = (e) => {
      const v = e.target.value;
      if (e.target.checked) {
        if (!this.cfg.audience.includes(v)) this.cfg.audience.push(v);
      } else {
        this.cfg.audience = this.cfg.audience.filter((x) => x !== v);
      }
      saveSession();
    };
  }

  closeAudience() {
    this.audPop.hidden = true;
  }

  setReplyBySeq(seq) {
    const m = state.messages.find((x) => x.seq === seq);
    if (!m) return;
    this.replyTo = { seq: m.seq, author: m.author || '', text: m.text || '' };
    const bar = this.el.querySelector('.reply-bar');
    bar.querySelector('b').textContent = '回复 ' + (m.author || '');
    bar.querySelector('.rb-text').textContent = String(m.text || '').replace(/\n/g, ' ');
    bar.hidden = false;
    this.input.focus();
  }

  clearReply() {
    this.replyTo = null;
    const bar = this.el.querySelector('.reply-bar');
    if (bar) bar.hidden = true;
  }

  /* 输入预览：交给服务端解析，保证和真正发出去的一致 */
  schedulePreview() {
    clearTimeout(this._pvTimer);
    const text = this.input.value;
    if (!text.trim()) { this.preview.hidden = true; return; }

    this._pvToken = (this._pvToken || 0) + 1;
    const token = this._pvToken;

    this._pvTimer = setTimeout(async () => {
      const r = await api('/api/preview', { text, kind: this.cfg.kind });
      if (token !== this._pvToken || !r || r.error) return;
      this.renderPreview(r);
    }, 220);
  }

  renderPreview(r) {
    const segs = Array.isArray(r.segments) ? r.segments : [];
    if (!segs.length) { this.preview.hidden = true; return; }

    const tag = { ic: '角色发言', emote: '动作', ooc: '皮下' };
    const rows = segs.slice(0, 5).map((s) =>
      `<div class="pv-item ${s.kind}"><span class="pv-tag">${tag[s.kind] || s.kind}</span><span class="pv-txt">${esc(s.text)}</span></div>`).join('');

    const head = r.auto
      ? (segs.length > 1 ? `<div class="pv-head">自动识别 · 将按标记拆成 ${segs.length} 条</div>` : '')
      : `<div class="pv-head">不识别标记 · 整条按「${tag[segs[0].kind] || segs[0].kind}」发</div>`;

    this.preview.innerHTML =
      head
      + rows
      + (segs.length > 5 ? `<div class="pv-head">…还有 ${segs.length - 5} 条</div>` : '');
    this.preview.hidden = false;
  }

  /** QQ 式「+1」：把这条消息的内容用自己的身份再发一条 */
  async repeatMessage(seq) {
    const m = state.messages.find((x) => Number(x.seq) === Number(seq));
    if (!m || !String(m.text || '').trim()) return;
    const keep = this.input.value;      /* 不冲掉正在打的字 */
    this.input.value = String(m.text);
    await this.send();
    this.input.value = keep;
    autosize(this.input);
    if (keep) this.schedulePreview();
  }

  async send() {
    const raw = this.input.value;
    if (!raw.trim()) return;

    const cfg = this.cfg;
    const char = state.characters.find((c) => c.id === cfg.identity);
    if (!char) { toast('先在侧栏「角色卡」新建一张，才能发言'); return; }

    let vis = cfg.vis;
    let audience = cfg.audience.slice();
    if (vis === 'dm') audience = [];
    if (vis === 'direct' && !audience.length) { toast('先在“定向”里选择接收的玩家'); this.openAudience(); return; }

    this.input.value = '';
    autosize(this.input);
    this._pvToken = (this._pvToken || 0) + 1;
    clearTimeout(this._pvTimer);
    this.preview.hidden = true;

    const data = await api('/api/message', {
      kind: cfg.kind,
      role: 'pc',
      author: char.name,
      characterId: char.id,
      replyTo: this.replyTo ? this.replyTo.seq : null,
      text: raw,
      visibility: vis,
      audience,
      sender: state.me,
      channel: this.cfg.channel,
    });

    if (data.error) { toast(data.error); this.input.value = raw; return; }

    this.clearReply();
    saveDraft(this.cfg.id, this.cfg.channel, '');
    pushDraftHistory(raw);
    const n = Array.isArray(data.messages) ? data.messages.length : 1;
    if (n > 1) toast(`按标记拆成 ${n} 条发出`);

    await poll();
    const w = winMap.get(cfg.id);
    if (w) w.scrollToBottom();
  }

  /* ---------------- 拖拽重排 ---------------- */
  attachDrag() {
    this.msgs.addEventListener('pointerdown', (e) => {
      if (state.dragging || e.button !== 0) return;
      /* 只有主持人、且开了「调整模式」才允许拖动消息 */
      if (!isDm() || !state.reorderMode) return;
      if (e.target.closest('button, a, input, textarea, select, .aud-pop')) return;
      const row = e.target.closest('.msg[data-seq]');
      if (!row) return;

      drag = {
        win: this,
        container: this.msgs,
        row,
        seq: Number(row.dataset.seq),
        rect: row.getBoundingClientRect(),
        startX: e.clientX,
        startY: e.clientY,
        lastY: e.clientY,
        active: false,
        ghost: null,
        ph: null,
        move: null,
        up: null,
      };
      drag.move = (ev) => onDragMove(ev);
      drag.up = (ev) => onDragUp(ev);
      window.addEventListener('pointermove', drag.move);
      window.addEventListener('pointerup', drag.up);
      window.addEventListener('pointercancel', drag.up);
    });
  }
}

let drag = null;

function messageSort(a, b) {
  const pa = a.pos == null ? a.seq : a.pos;
  const pb = b.pos == null ? b.seq : b.pos;
  if (pa !== pb) return pa - pb;
  return (a.seq || 0) - (b.seq || 0);
}

function msgAvatarHtml(m) {
  const meta = m.meta && typeof m.meta === 'object' ? m.meta : {};
  let src = meta.avatar || '';
  let cid = meta.characterId || '';
  if (!src && m.author) {
    // 老消息没有 meta.avatar，兜底按作者名找（同名角色可能不准，仅兜底）
    const c = state.characters.find((x) => x.name === m.author);
    if (c && c.avatar) src = c.avatar;
    if (c && !cid) cid = c.id;
  }
  return avatarHtml({ name: m.author || '?', avatar: src, avId: cid }, 'cav-msg');
}

/* 正文：把 {1d6} 渲染成行内骰点芯片 */
/* 消息头部显示发言者当前 HP 与 SAN（读角色卡实时值） */
function msgHpBadge(m) {
  const cid = (m.meta && m.meta.characterId) || '';
  const c = cid ? state.characters.find((x) => x.id === cid) : null;
  if (!c) return '';
  const hp = Number(c.hp);
  const max = Number(c.maxHp);
  if (!Number.isFinite(hp) || !Number.isFinite(max) || max <= 0) return '';
  const cls = hp <= max * 0.25 ? ' crit' : hp <= max * 0.5 ? ' low' : '';
  const san = c.san == null ? 3 : Number(c.san);
  return `<span class="hp-tag${cls}" title="HP ${hp}/${max} · SAN ${san}/3">${hp}/${max} · <span title="SAN">SAN ${san}</span></span>`;
}

/* @角色名 高亮：按现有角色卡名单匹配（长名优先），避免把普通 @ 也染色 */
function withMentions(html) {
  const names = [...new Set(state.characters.map((c) => String(c.name || '').trim()).filter(Boolean))]
    .sort((a, b) => b.length - a.length)
    .map((n) => esc(n));
  if (!names.length) return html;
  const re = new RegExp('@(' + names.map((n) => n.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')', 'g');
  return html.replace(re, '<span class="mention">@$1</span>');
}

function bodyHtml(m) {
  const text = String(m.text || '');
  const inline = m.meta && Array.isArray(m.meta.inline) ? m.meta.inline : [];
  if (!inline.length) return withEmojis(withMentions(esc(text)));

  let out = '';
  let at = 0;
  for (const s of inline) {
    if (!s || s.start < at || s.start > text.length) continue;
    out += withEmojis(withMentions(esc(text.slice(at, s.start))));
    /* 行内骰子走骰子消息的排版：骰面 + 固定修正 + = + 总点数 */
    const flatM = /([+-]\d+)\s*$/.exec(String(s.expr || ''));
    const flat = flatM ? Number(flatM[1]) : 0;
    const flatHtml = flat
      ? `<span class="dice-plus">+</span><span class="dice-op">${flat > 0 ? flat : `−${Math.abs(flat)}`}</span>`
      : '';
    const faces = Array.isArray(s.rolls) && s.rolls.length
      ? s.rolls.map((v) => `<span class="die-face">${esc(String(v))}</span>`)
          .join('<span class="dice-plus">+</span>') + flatHtml
      : `<span class="dic-expr">${esc(s.expr || '掷骰')}</span>`;
    out += `<span class="dice-inline" title="${esc(s.detail || '')}">${faces}`
      + `<span class="dice-eq">=</span><span class="dice-sum">${esc(String(s.total))}</span></span>`;
    at = s.start + s.len;
  }
  out += withEmojis(withMentions(esc(text.slice(at))));
  return out;
}

async function removeMessage(seq) {
  if (!confirm('删除这条消息？')) return;
  const r = await api('/api/message/delete', { seq, sender: state.me });
  if (r.error) { toast(r.error); return; }
  await reloadAll();
}

function beginEditMessage(win, seq) {
  const row = win.msgs.querySelector(`.msg[data-seq="${seq}"]`);
  const m = state.messages.find((x) => x.seq === seq);
  if (!row || !m) return;

  const main = row.querySelector('.m-main');
  if (!main || main.querySelector('.edit-ta')) return;

  const original = main.innerHTML;
  state.editing = seq;
  row.classList.add('editing');
  main.innerHTML = `
    <div class="edit-box">
      <textarea class="edit-ta"></textarea>
      <div class="edit-acts">
        <button data-ecancel>取消</button>
        <button class="primary" data-esave>保存</button>
      </div>
    </div>`;

  const ta = main.querySelector('.edit-ta');
  ta.value = m.text || '';
  ta.focus();
  ta.setSelectionRange(ta.value.length, ta.value.length);

  const close = () => {
    state.editing = null;
    main.innerHTML = original;
    row.classList.remove('editing');
  };

  main.querySelector('[data-ecancel]').onclick = close;
  main.querySelector('[data-esave]').onclick = async () => {
    const text = ta.value.trim();

    if (r.error) { toast(r.error); return; }

  ta.addEventListener('keydown', (e) => {

}

/* ---------------- 消息更多菜单 ---------------- */
let msgMenu = null;
let msgMenuScroll = null;

function closeMsgMenu() {
  if (msgMenuScroll) {
    msgMenuScroll.el.removeEventListener('scroll', msgMenuScroll.fn);
    msgMenuScroll = null;
  }
  if (!msgMenu) return;
  msgMenu.remove();
  msgMenu = null;
  document.removeEventListener('pointerdown', onMenuDocDown, true);
  document.removeEventListener('keydown', onMenuEsc, true);
}

function onMenuDocDown(e) {
  if (!msgMenu) return;
  if (msgMenu.contains(e.target)) return;
  closeMsgMenu();
}

function onMenuEsc(e) {
  if (e.key === 'Escape') { e.stopPropagation(); closeMsgMenu(); }
}

async function copyPlainText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch {
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
      return true;
    } catch { return false; }
  }
}

function openMsgMenu(win, seq, anchor) {
  closeMsgMenu();
  const m = state.messages.find((x) => x.seq === seq);
  if (!m) return;
  const meta = m.meta && typeof m.meta === 'object' ? m.meta : {};
  const canEdit = Boolean(m.sender) && (m.sender === state.me || isDm());

  const menu = document.createElement('div');
  menu.className = 'msg-menu';
  menu.innerHTML = `
    <div class="info">${esc(m.author || '')} · ${fmtDateTime(m.created_at)}${meta.edited ? ' · 已编辑' : ''}</div>
    <button class="mi" data-a="reply">回复这条</button>
    <button class="mi" data-a="copy">复制原文</button>
    ${canEdit ? '<button class="mi" data-a="edit">编辑</button>' : ''}
    ${isDm() ? `<button class="mi" data-a="fold">${meta.folded ? '取消折叠' : '折叠这条'}</button>` : ''}
    ${canEdit ? '<button class="mi danger" data-a="del">删除</button>' : ''}`;
  document.body.appendChild(menu);

  const r = anchor.getBoundingClientRect();
  const mw = menu.offsetWidth;
  const mh = menu.offsetHeight;
  const left = Math.max(8, Math.min(r.left, window.innerWidth - mw - 8));
  let top = r.bottom + 4;
  if (top + mh > window.innerHeight - 8) top = Math.max(8, r.top - mh - 4);
  menu.style.left = left + 'px';
  menu.style.top = top + 'px';

  msgMenu = menu;

  menu.addEventListener('click', async (e) => {
    const b = e.target.closest('[data-a]');
    if (!b) return;
    const a = b.dataset.a;
    closeMsgMenu();

    if (a === 'copy') {
      const okCopy = await copyPlainText(m.text || '');
      toast(okCopy ? '已复制原文' : '复制失败');
    } else if (a === 'reply') {
      win.setReplyBySeq(seq);
    } else if (a === 'edit') {
      beginEditMessage(win, seq);
    } else if (a === 'del') {
      removeMessage(seq);
    } else if (a === 'fold') {
      const out = await api('/api/message/fold', { seq, sender: state.me });
      if (out.error) { toast(out.error); return; }
      await reloadAll();
    }
  });

  const onScroll = () => closeMsgMenu();
  win.msgs.addEventListener('scroll', onScroll);
  msgMenuScroll = { el: win.msgs, fn: onScroll };

  setTimeout(() => {
    document.addEventListener('pointerdown', onMenuDocDown, true);
    document.addEventListener('keydown', onMenuEsc, true);
  }, 0);
}

/* 连续相同内容的消息合并成一条，尾巴挂 +N（模仿 QQ 跟队形）。
   只比「类型 + 可见性 + 文本」，不看发送者——这样多人跟同一句才会聚到一起，
   才能出现可点的 +1。系统提示和皮下不参与。 */
function bubbleKey(m) {
  const k = m.kind || 'ic';
  if (k === 'system' || k === 'ooc') return '';
  const t = String(m.text || '').trim();
  if (!t) return '';
  return [k, m.visibility || 'all', t].join('\u0001');
}

/* 不折叠：每条消息都照常显示。
   只有「连续相同那一串的最后一条」挂一个 +1（表示可以跟着发），
   前面的和中间的都不挂，而且文案固定就是 +1。 */
function markRepeats(list) {
  return list.map((m, i) => {
    const k = bubbleKey(m);
    const prev = list[i - 1];
    const next = list[i + 1];
    const prevSame = Boolean(k && prev && bubbleKey(prev) === k);
    const nextSame = Boolean(k && next && bubbleKey(next) === k);
    const show = prevSame && !nextSame;
    return Object.assign({}, m, { _plus: show ? 1 : 0 });
  });
}

/* ---------- 消息右键 / 长按菜单（复制、引用） ---------- */

/* 把「@角色名 」插到输入框末尾，不动光标前已有的字 */
function insertMention(win, name) {
  if (!win || !win.input) return;
  const ta = win.input;
  const v = ta.value;
  const pad = v && !/\s$/.test(v) ? ' ' : '';
  ta.value = v + pad + '@' + name + ' ';
  autosize(ta);
  if (typeof win.schedulePreview === 'function') win.schedulePreview();
  ta.focus();
  const end = ta.value.length;
  ta.setSelectionRange(end, end);
}

async function copyText(text) {
  const s = String(text || '');
  try {
    await navigator.clipboard.writeText(s);
    return true;
  } catch (err) {
    try {
      const ta = document.createElement('textarea');
      ta.value = s;
      ta.style.cssText = 'position:fixed;left:-9999px;top:0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
      return true;
    } catch (e2) { return false; }
  }
}

function isContinuous(a, b) {
  if (!a || !b) return false;
  const ka = a.kind || 'ic';
  const kb = b.kind || 'ic';
  // 系统提示和皮下都是「独立成行」的提示，不参与合并
  if (ka === 'system' || kb === 'system' || ka === 'ooc' || kb === 'ooc') return false;
  const ca = (a.meta && a.meta.characterId) || '';
  const cb = (b.meta && b.meta.characterId) || '';
  return a.sender === b.sender
    && a.author === b.author
    && ca === cb
    && ka === kb
    && (a.visibility || 'all') === (b.visibility || 'all');
}

/* 掷骰消息：不显示原文，只留结构化骰子卡片 + 左侧骰子标记 */
function rollMessageHtml(m) {
  const meta = m.meta && typeof m.meta === 'object' ? m.meta : {};
  const gm = Boolean(meta.gm);
  const crit = meta.nat6 ? ' crit' : meta.nat1 ? ' fumble' : '';
  const whisper = m.visibility === 'dm' ? '私主持人' : m.visibility === 'direct' ? '定向' : '';
  const ops = `<span class="msg-ops"><button data-mmore="${m.seq}" title="更多">⋮</button></span>`;
  return `<div class="msg k-roll${gm ? ' gm' : ''}${crit}" data-seq="${m.seq}">${ops}
    ${msgAvatarHtml(m)}
    <div class="m-main">
      <div class="m-head">
        <span class="who"${gm ? '' : ` style="color:${msgCharColor(m)}"`}>${esc(m.author || '—')}</span>
        ${gm ? '<span class="badge gm">主持人</span>' : ''}
        ${meta.dark ? '<span class="badge dark">暗骰</span>' : ''}
        ${whisper ? `<span class="badge w">${whisper}</span>` : ''}
        ${msgHpBadge(m)}
        <span class="mt">${fmtTime(m.created_at)}</span>
      </div>
      ${diceHtml(meta, m.seq)}
    </div>

}

/* 消息的表情回应（👍 之类），点一下加/取消 */
function reactionsHtml(m) {
  const r = (m.meta && m.meta.reactions) || {};
  const keys = Object.keys(r).filter((k) => Array.isArray(r[k]) && r[k].length);
  if (!keys.length) return '';
  const items = keys.map((k) => {
    const mine = r[k].includes(state.me);
    return `<button class="react${mine ? ' mine' : ''}" data-react="${esc(k)}" title="${esc(String(r[k].length))} 人">`
      + `<span class="re-emoji">${esc(k)}</span><span class="re-n">${r[k].length}</span></button>`;
  }).join('');
  return `<div class="reactions">${items}</div>`;
}

async function toggleReaction(seq, emoji) {
  if (!state.me) { toast('先进入房间'); return; }
  const r = await api('/api/reaction', { seq, emoji, clientId: state.me });
  if (r.error) { toast(r.error); return; }
  /* 回应改的是旧消息的 meta，增量轮询拿不到，直接重拉一次 */
