<script>
/* 兼容补丁：个别环境（后台标签页/无头浏览器）中 image.decode() 可能永不 settle，
   会使制卡工具的徽记与图片读取卡死。这里用 load 事件与之竞速，真实浏览器行为不变。 */
(function () {
  var orig = HTMLImageElement.prototype.decode;
  HTMLImageElement.prototype.decode = function () {
    var img = this;
    return Promise.race([
      orig.call(img).catch(function () {}),
      new Promise(function (res) {
        if (img.complete) return res();
        img.addEventListener('load', function () { res(); }, { once: true });
        img.addEventListener('error', function () { res(); }, { once: true });
      })
    ]);
  };
})();
</script>

<script src="/assets/forum.js?v=20091130"></script>
<script src="/assets/web-bridge.js?v=20091130"></script>
<script>
'use strict';
(async () => {
  await FF.renderHeader();
  const s = await FF.session();
  if (s.user && String(s.user.playerName || '').toLowerCase() === 'unknown') {
    document.body.classList.add('invade-mode');
    document.body.dataset.sectionName = '诡异入侵';
    document.title = '诡异入侵 · 怪啖论坛';
    const sn = document.querySelector('#site-header .section-name');
    if (sn) sn.textContent = '诡异入侵';
    document.getElementById('invade-gate').hidden = false;
    const form = document.getElementById('invade-form');
    const fileEl = document.getElementById('invade-avatar');
    const preview = document.getElementById('invade-avatar-preview');
    const readAsDataURL = file => new Promise((res, rej) => {
      const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file);
    });
    fileEl.onchange = async () => {
      const f = fileEl.files && fileEl.files[0];
      if (!f) { preview.hidden = true; return; }
      preview.src = await readAsDataURL(f); preview.hidden = false;
    };
    /* 头像先压到 WebP（最长边 512），避免大图把上传撑爆 */
    const avatarData = async () => {
      const f = fileEl.files && fileEl.files[0];
      if (!f) throw new Error('请上传头像。');
      const src = await readAsDataURL(f);
      const img = new Image(); img.src = src;
      if (img.decode) await img.decode().catch(() => {});
      else await new Promise(ok => { img.onload = ok; img.onerror = ok; });
      if (!img.naturalWidth) return src;
      const scale = Math.min(1, 512 / Math.max(img.naturalWidth, img.naturalHeight));
      const cv = document.createElement('canvas');
      cv.width = Math.max(1, Math.round(img.naturalWidth * scale));
      cv.height = Math.max(1, Math.round(img.naturalHeight * scale));
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      const webp = cv.toDataURL('image/webp', 0.88);
      return webp.startsWith('data:image/webp') ? webp : src;
    };
    form.onsubmit = async e => {
      e.preventDefault();
      const status = document.getElementById('invade-status');
      const button = form.querySelector('button[type="submit"]');
      button.disabled = true;
      status.textContent = '正在让什么东西进来…';
      try {
        await FF.api('/api/invade', { method: 'POST', body: {
          nickname: document.getElementById('invade-nickname').value.trim(),
          avatar: await avatarData()
        } });
        status.textContent = '……它进来了。聊天室响了一声。';
        form.reset(); preview.hidden = true;
      } catch (err) { status.textContent = err.message; }
      finally { button.disabled = false; }
    };
  }
})();
window.addEventListener('message', e => {
  if (e.origin !== location.origin || !e.data || e.data.source !== 'fanta-bridge') return;
  if (e.data.tool !== 'card' || !e.data.ok || e.data.ready) return;
  const note = document.getElementById('result-note');
  note.hidden = false;
  document.getElementById('result-text').textContent =
    e.data.status === 'approved' ? '账号创建成功并已通过审核，可直接登入聊天室。' : '账号创建成功，已提交管理员审核；通过审核后即可发言与投稿。';
  note.scrollIntoView({ behavior: 'smooth', block: 'center' });
});
</script>
